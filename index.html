// Junta: prestação + anexos (contrato, levantamento, despesas, repasse), cada grupo com uma folha de separação.
async function buildPrestacaoPdfBlob(dados, entries) {
  const lib = await loadPdfLib();
  const { PDFDocument, StandardFonts, rgb } = lib;
  const baseBytes = buildPrestacaoBase(dados);
  const out = await PDFDocument.create();
  out.setTitle("Prestação de contas — " + waSafe(dados.cliente.nome));
  out.setAuthor("Rezende Maia Advocacia");
  const base = await PDFDocument.load(baseBytes);
  (await out.copyPages(base, base.getPageIndices())).forEach((p) => out.addPage(p));
  const fBold = await out.embedFont(StandardFonts.HelveticaBold);
  const fReg = await out.embedFont(StandardFonts.Helvetica);
  const verde = rgb(PC_GREEN[0] / 255, PC_GREEN[1] / 255, PC_GREEN[2] / 255);
  const dourado = rgb(PC_GOLD[0] / 255, PC_GOLD[1] / 255, PC_GOLD[2] / 255);
  const cinza = rgb(0.35, 0.35, 0.35);
  const A = dados.anexos;
  const grupos = [["Contrato de honorários", A.contrato], ["Comprovante de levantamento", A.levantamento], ["Comprovantes das despesas", A.despesas], ["Comprovante do repasse", A.repasse]];

  for (let gi = 0; gi < grupos.length; gi++) {
    const [titulo, itens] = grupos[gi];
    if (!itens || itens.length === 0) continue;
    const num = gi + 1;
    // folha de separação
    const W = 595.28, H = 841.89;
    const sep = out.addPage([W, H]);
    sep.drawRectangle({ x: 0, y: H - 130, width: W, height: 130, color: verde });
    sep.drawText(waSafe(`ANEXO ${num}`), { x: 50, y: H - 80, size: 34, font: fBold, color: rgb(1, 1, 1) });
    sep.drawText(waSafe(titulo), { x: 50, y: H - 190, size: 22, font: fBold, color: verde });
    sep.drawRectangle({ x: 50, y: H - 202, width: 60, height: 2.5, color: dourado });
    sep.drawText(waSafe("Prestação de contas — " + dados.cliente.nome), { x: 50, y: H - 228, size: 11, font: fReg, color: cinza });
    let ly = H - 260;
    itens.forEach((it, i) => { sep.drawText(waSafe(`${i + 1}. ${it.legenda || it.nome || "arquivo"}`), { x: 50, y: ly, size: 10, font: fReg, color: cinza }); ly -= 15; });

    for (let i = 0; i < itens.length; i++) {
      const it = itens[i];
      let arq;
      try { arq = await resolverAnexo(it, entries); } catch (e) { throw new Error(`Anexo ${num} (${it.nome || it.legenda}): ${e.message}`); }
      if (arq.mime === "application/pdf") {
        try {
          const src = await PDFDocument.load(arq.bytes, { ignoreEncryption: true });
          (await out.copyPages(src, src.getPageIndices())).forEach((p) => out.addPage(p));
        } catch (e) { throw new Error(`Anexo ${num}: não consegui juntar o PDF "${it.nome || it.legenda}" (${e.message}). Tente anexar uma foto das páginas.`); }
      } else {
        let img;
        try { img = arq.mime === "image/png" ? await out.embedPng(arq.bytes) : await out.embedJpg(arq.bytes); }
        catch (e) { throw new Error(`Anexo ${num}: não consegui ler a imagem "${it.nome || it.legenda}".`); }
        const paisagem = img.width > img.height * 1.1;
        const pw = paisagem ? H : W, ph = paisagem ? W : H, m = 28;
        const page = out.addPage([pw, ph]);
        const sc = Math.min((pw - 2 * m) / img.width, (ph - 2 * m - 12) / img.height);
        const iw = img.width * sc, ih = img.height * sc;
        page.drawImage(img, { x: (pw - iw) / 2, y: m + 12 + (ph - 2 * m - 12 - ih) / 2, width: iw, height: ih });
        page.drawText(waSafe(`Anexo ${num} - ${titulo} | ${it.legenda || ""} | ${dados.cliente.nome} | arquivo ${i + 1}/${itens.length}`), { x: m, y: 16, size: 7, font: fReg, color: cinza });
      }
    }
  }
  const bytes = await out.save();
  return new Blob([bytes], { type: "application/pdf" });
}

// Escolher fotos / PDFs de um documento (contrato, comprovantes...).
function AnexoPicker({ items, onChange, showToast, texto, multiple }) {
  const ref = useRef(null);
  const [busy, setBusy] = useState(false);
  const lista = items || [];
  async function onFiles(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    setBusy(true);
    const novos = [];
    for (const file of files) {
      try {
        if (file.type === "application/pdf") {
          if (file.size > MAX_PDF_BYTES) { showToast(`"${file.name}" é um PDF grande demais (máx. ${Math.round(MAX_PDF_BYTES / 1024)} KB). Tire foto das páginas ou comprima o PDF.`, "error"); continue; }
          novos.push({ key: newId("a"), nome: file.name, mime: "application/pdf", dataUrl: await readFileAsDataURL(file) });
        } else {
          novos.push({ key: newId("a"), nome: file.name || "foto.jpg", mime: "image/jpeg", dataUrl: await compressImage(file, 1500, 0.72) });
        }
      } catch (err) { showToast("Não foi possível ler o arquivo " + (file.name || ""), "error"); }
    }
    setBusy(false);
    if (novos.length > 0) onChange(multiple === false ? novos.slice(0, 1) : [...lista, ...novos]);
  }
  return (
    <div style={{ marginTop: 4 }}>
      <input type="file" accept="image/*,application/pdf" multiple={multiple !== false} ref={ref} onChange={onFiles} style={{ display: "none" }} />
      {lista.map((it, i) => (
        <div key={it.id || it.key || i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 8px", marginBottom: 6, borderRadius: 8, backgroundColor: C.greenSoft, border: `1px solid ${C.green}` }}>
          {it.dataUrl && it.mime !== "application/pdf" ? (
            <img src={it.dataUrl} alt="" style={{ width: 34, height: 34, objectFit: "cover", borderRadius: 5, flexShrink: 0 }} />
          ) : (
            <span style={{ width: 34, height: 34, borderRadius: 5, backgroundColor: "#fff", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><Icon name={it.mime === "application/pdf" ? "clipboard" : "check"} size={16} color={C.green} /></span>
          )}
          <span style={{ flex: 1, minWidth: 0, fontFamily: FONT_SANS, fontSize: 12, color: C.ink, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{it.nome || "arquivo"}</span>
          <button type="button" onClick={() => onChange(lista.filter((_, j) => j !== i))} style={{ background: "none", border: "none", color: C.red, fontFamily: FONT_SANS, fontSize: 12, cursor: "pointer", padding: "4px 2px" }}>Remover</button>
        </div>
      ))}
      <button type="button" onClick={() => ref.current && ref.current.click()} disabled={busy} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: 11, borderRadius: 9, border: `1.5px dashed ${C.brass}`, backgroundColor: C.brassSoft, color: C.brassDark, fontFamily: FONT_SANS, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
        {busy ? <Spinner size={15} color={C.brassDark} /> : <Icon name="camera" size={16} />}
        {busy ? "Processando..." : (texto || (lista.length > 0 ? "Adicionar mais fotos / PDF" : "Tirar foto ou anexar PDF"))}
      </button>
    </div>
  );
}

// Espécie do benefício + contrato de honorários (usado no cadastro e na prestação).
function ContratoFields({ especie, dataContrato, contrato, onChange, showToast }) {
  return (
    <div>
      <Field label="Espécie do benefício" required>
        <TextInput list="especies-list" value={especie} onChange={(e) => onChange("especie", e.target.value)} placeholder="Ex.: Aposentadoria por incapacidade permanente" />
        <datalist id="especies-list">{ESPECIES_BENEFICIO.map((x) => (<option key={x} value={x} />))}</datalist>
      </Field>
      <Field label="Data de assinatura do contrato de honorários" required>
        <TextInput type="date" value={dataContrato} onChange={(e) => onChange("dataContrato", e.target.value)} />
      </Field>
      <Field label="Contrato de honorários assinado (foto ou PDF)" required hint="Obrigatório para gerar a prestação de contas. Vários arquivos/páginas são aceitos.">
        <AnexoPicker items={contrato} onChange={(v) => onChange("contrato", v)} showToast={showToast} />
      </Field>
    </div>
  );
}

function PcErros({ r }) {
  return (
    <div style={{ marginBottom: 12, padding: "12px 14px", borderRadius: 10, backgroundColor: C.redSoft, border: `1.5px solid ${C.red}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
        <Icon name="alert" size={17} color={C.red} />
        <strong style={{ fontFamily: FONT_SANS, fontSize: 13.5, color: C.red }}>Prestação de contas NÃO gerada — falta o que está abaixo</strong>
      </div>
      {r.docs.length > 0 && (
        <div style={{ marginBottom: 8 }}>
          <div style={{ fontFamily: FONT_SANS, fontSize: 12, fontWeight: 700, color: C.red, textTransform: "uppercase", letterSpacing: "0.04em" }}>Documentos faltando</div>
          <ul style={{ margin: "4px 0 0", paddingLeft: 18, fontFamily: FONT_SANS, fontSize: 12.5, color: C.ink, lineHeight: 1.5 }}>{r.docs.map((t, i) => <li key={i}>{t}</li>)}</ul>
        </div>
      )}
      {r.info.length > 0 && (
        <div>
          <div style={{ fontFamily: FONT_SANS, fontSize: 12, fontWeight: 700, color: C.red, textTransform: "uppercase", letterSpacing: "0.04em" }}>Informações faltando ou incorretas</div>
          <ul style={{ margin: "4px 0 0", paddingLeft: 18, fontFamily: FONT_SANS, fontSize: 12.5, color: C.ink, lineHeight: 1.5 }}>{r.info.map((t, i) => <li key={i}>{t}</li>)}</ul>
        </div>
      )}
    </div>
  );
}

function PrestacaoCard({ cliente, entries, draft, onOpen, setDraft, onGerar, busy, showToast }) {
  const [expanded, setExpanded] = useState(false);
  const [tentou, setTentou] = useState(false);
  const errosRef = useRef(null);
  const r = draft ? montarPrestacao({ cliente, entries, draft }) : null;
  const upd = (patch) => setDraft((d) => ({ ...d, ...patch }));
  const updRep = (patch) => setDraft((d) => ({ ...d, repasse: { ...d.repasse, ...patch } }));
  const updDesp = (key, patch) => setDraft((d) => ({ ...d, despesas: d.despesas.map((x) => (x.key === key ? { ...x, ...patch } : x)) }));
  const updOut = (key, patch) => setDraft((d) => ({ ...d, outros: d.outros.map((x) => (x.key === key ? { ...x, ...patch } : x)) }));
  const miniBtn = { display: "flex", alignItems: "center", justifyContent: "center", gap: 6, width: "100%", padding: 10, borderRadius: 9, border: `1.5px solid ${C.rule}`, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 13, fontWeight: 700, cursor: "pointer", marginBottom: 12 };

  function toggle() { if (!expanded && !draft) onOpen(); setExpanded((v) => !v); }
  function gerar() {
    setTentou(true);
    if (!r.ok) { setTimeout(() => errosRef.current && errosRef.current.scrollIntoView({ behavior: "smooth", block: "center" }), 60); return; }
    onGerar(cliente, draft);
  }
  const sub = (txt) => <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft, marginBottom: 8, lineHeight: 1.45 }}>{txt}</div>;
  const res = r ? r.dados.resumo : null;
  const linhaRes = (lbl, v, forte) => (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontFamily: FONT_SANS, fontSize: forte ? 14 : 12.5, fontWeight: forte ? 700 : 400, color: forte ? C.ink : C.inkSoft, padding: "3px 0", borderTop: forte ? `1px solid ${C.rule}` : "none", marginTop: forte ? 4 : 0 }}>
      <span>{lbl}</span><span style={{ fontFamily: FONT_MONO, color: C.ink }}>{formatBRL(v)}</span>
    </div>
  );

  return (
    <div style={{ backgroundColor: C.card, border: `1px solid ${C.ruleSoft}`, borderLeft: `4px solid ${cliente.dono === "Flávio" ? C.blue : C.brass}`, borderRadius: 10, overflow: "hidden" }}>
      <button onClick={toggle} style={{ width: "100%", textAlign: "left", padding: "12px 14px", display: "flex", alignItems: "center", gap: 12, background: "none", border: "none", cursor: "pointer" }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontFamily: FONT_SERIF, fontSize: 15, fontWeight: 700, color: C.ink }}>{cliente.nome}</span>
            <DonoBadge dono={cliente.dono} />
          </div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.inkSoft, marginTop: 2 }}>{cliente.cpf || "sem CPF"}{cliente.processo ? ` · ${cliente.processo}` : ""}</div>
        </div>
        <span style={{ fontFamily: FONT_SANS, fontSize: 10.5, fontWeight: 700, color: C.brassDark, backgroundColor: C.brassSoft, padding: "3px 8px", borderRadius: 999 }}>Prestar contas</span>
        <Icon name={expanded ? "chevronUp" : "chevronDown"} size={16} color={C.inkSoft} />
      </button>
      {expanded && draft && r && (
        <div style={{ padding: "12px 14px 14px", borderTop: `1px dashed ${C.ruleSoft}` }}>
          <span style={sectionLabelStyle}>1 · Identificação e contrato</span>
          <ContratoFields especie={draft.especie} dataContrato={draft.dataContrato} contrato={draft.contrato}
            onChange={(f, v) => upd({ [f]: v })} showToast={showToast} />

          <span style={{ ...sectionLabelStyle, marginTop: 6 }}>2 · Despesas reembolsáveis</span>
          {sub(res.despesas > 0 ? `O app descontou ${formatBRL(res.despesas)} do cliente como gastos reembolsáveis. Liste cada despesa com valor, data e comprovante (a soma precisa bater).` : "Este cliente não teve gastos reembolsáveis descontados. Não precisa listar despesas.")}
          {draft.despesas.map((d, i) => (
            <div key={d.key} style={{ padding: 10, marginBottom: 10, borderRadius: 9, backgroundColor: C.parchmentDark }}>
              <Field label={`Despesa ${i + 1}`}><TextInput value={d.descricao} onChange={(e) => updDesp(d.key, { descricao: e.target.value })} placeholder="Custas, perícia, deslocamento, cópias..." /></Field>
              <div style={gridTwo}>
                <Field label="Data"><TextInput type="date" value={d.data} onChange={(e) => updDesp(d.key, { data: e.target.value })} /></Field>
                <Field label="Valor"><MoneyInput value={d.valor} onChange={(e) => updDesp(d.key, { valor: e.target.value })} /></Field>
              </div>
              <AnexoPicker items={d.anexos} onChange={(v) => updDesp(d.key, { anexos: v })} showToast={showToast} texto="Anexar comprovante da despesa" />
              <button type="button" onClick={() => setDraft((x) => ({ ...x, despesas: x.despesas.filter((y) => y.key !== d.key) }))} style={{ marginTop: 6, background: "none", border: "none", color: C.red, fontFamily: FONT_SANS, fontSize: 12, cursor: "pointer", padding: 0 }}>Remover esta despesa</button>
            </div>
          ))}
          <button type="button" onClick={() => setDraft((x) => ({ ...x, despesas: [...x.despesas, { key: newId("dp"), descricao: "", data: "", valor: "", anexos: [] }] }))} style={miniBtn}><Icon name="plus" size={14} /> Adicionar despesa</button>

          <span style={{ ...sectionLabelStyle, marginTop: 6 }}>3 · Outros descontos autorizados</span>
          {sub("Só se o cliente autorizou algum desconto além dos honorários e das despesas. Normalmente fica em branco.")}
          {draft.outros.map((o, i) => (
            <div key={o.key} style={{ padding: 10, marginBottom: 10, borderRadius: 9, backgroundColor: C.parchmentDark }}>
              <Field label={`Desconto ${i + 1}`}><TextInput value={o.descricao} onChange={(e) => updOut(o.key, { descricao: e.target.value })} placeholder="Descreva o desconto autorizado" /></Field>
              <Field label="Valor"><MoneyInput value={o.valor} onChange={(e) => updOut(o.key, { valor: e.target.value })} /></Field>
              <button type="button" onClick={() => setDraft((x) => ({ ...x, outros: x.outros.filter((y) => y.key !== o.key) }))} style={{ background: "none", border: "none", color: C.red, fontFamily: FONT_SANS, fontSize: 12, cursor: "pointer", padding: 0 }}>Remover</button>
            </div>
          ))}
          <button type="button" onClick={() => setDraft((x) => ({ ...x, outros: [...x.outros, { key: newId("ou"), descricao: "", valor: "" }] }))} style={miniBtn}><Icon name="plus" size={14} /> Adicionar desconto</button>

          <div style={{ padding: "10px 12px", borderRadius: 9, backgroundColor: C.brassSoft, border: `1px solid ${C.brass}`, marginBottom: 14 }}>
            <span style={{ ...sectionLabelStyle, marginBottom: 6 }}>Resumo financeiro (calculado)</span>
            {linhaRes(`Valor bruto levantado${res.levantamentoTexto ? " — " + res.levantamentoTexto : ""}`, res.bruto)}
            {linhaRes("(–) Honorários — fase administrativa", res.administrativo)}
            {linhaRes(`(–) Honorários — fase judicial (${res.pct})`, res.honorarios)}
            {linhaRes("(–) Despesas reembolsáveis", res.despesas)}
            {linhaRes("(–) Outros descontos", res.outros)}
            {linhaRes("Líquido a repassar ao cliente", res.liquido, true)}
          </div>

          <span style={sectionLabelStyle}>4 · Repasse ao cliente</span>
          <div style={gridTwo}>
            <Field label="Data do repasse" required><TextInput type="date" value={draft.repasse.data} onChange={(e) => updRep({ data: e.target.value })} /></Field>
            <Field label="Forma" required>
              <select value={draft.repasse.forma} onChange={(e) => updRep({ forma: e.target.value })} style={{ ...inputBase, appearance: "none" }}>
                {PC_FORMAS.map((f) => (<option key={f} value={f}>{f}</option>))}
              </select>
            </Field>
          </div>
          <Field label="Favorecido (nome e CPF)" required><TextInput value={draft.repasse.favorecido} onChange={(e) => updRep({ favorecido: e.target.value })} /></Field>
          <Field label="Valor transferido ao cliente" required hint={`Líquido a repassar: ${formatBRL(res.liquido)}. Os dois valores precisam ser iguais (saldo remanescente zero).`}>
            <MoneyInput value={draft.repasse.valor} onChange={(e) => updRep({ valor: e.target.value })} />
          </Field>
          {res.liquido > 0 && parseNum(draft.repasse.valor) !== res.liquido && (
            <button type="button" onClick={() => updRep({ valor: String(res.liquido) })} style={{ marginTop: -8, marginBottom: 12, background: "none", border: "none", color: C.brassDark, fontFamily: FONT_SANS, fontSize: 12, fontWeight: 700, textDecoration: "underline", cursor: "pointer", padding: 0 }}>Preencher com o líquido ({formatBRL(res.liquido)})</button>
          )}
          <Field label="Comprovante da transferência (print, foto ou PDF)" required>
            <AnexoPicker items={draft.repasse.anexos} onChange={(v) => updRep({ anexos: v })} showToast={showToast} texto="Anexar comprovante do repasse" />
          </Field>

          <span style={{ ...sectionLabelStyle, marginTop: 6 }}>5 · Declaração e ciência</span>
          <div style={gridTwo}>
            <Field label="Cidade/UF" required><TextInput value={draft.cidadeUf} onChange={(e) => upd({ cidadeUf: e.target.value })} /></Field>
            <Field label="Data" required><TextInput type="date" value={draft.dataDecl} onChange={(e) => upd({ dataDecl: e.target.value })} /></Field>
          </div>

          <span style={{ ...sectionLabelStyle, marginTop: 6 }}>Comprovantes de levantamento</span>
          {sub("Vêm da foto/PDF anexado em cada levantamento. Para incluir ou trocar, vá em Histórico → Levantamentos → Editar.")}
          <div style={{ marginBottom: 14 }}>
            {r.levsCliente.length === 0 && <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.red }}>Nenhum levantamento do valor do cliente encontrado.</span>}
            {r.levsCliente.map((l) => (
              <div key={l.en.id} style={{ display: "flex", alignItems: "center", gap: 8, fontFamily: FONT_SANS, fontSize: 12.5, color: l.en.foto ? C.green : C.red, padding: "3px 0" }}>
                <Icon name={l.en.foto ? "check" : "alert"} size={14} color={l.en.foto ? C.green : C.red} />
                {formatDateBR(l.en.dataLevantamento)} · {BANCOS[l.en.banco] ? BANCOS[l.en.banco].short : l.en.banco} · {formatBRL(l.en.valorTotal)} — {l.en.foto ? "comprovante anexado" : "SEM comprovante"}
              </div>
            ))}
          </div>

          <div ref={errosRef}>{tentou && !r.ok && <PcErros r={r} />}</div>
          <button type="button" onClick={gerar} disabled={busy} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: C.ink, color: "#fff", fontFamily: FONT_SANS, fontSize: 15, fontWeight: 700, padding: 14, borderRadius: 10, border: "none", cursor: busy ? "default" : "pointer", opacity: busy ? 0.7 : 1 }}>
            {busy ? <Spinner size={17} /> : <Icon name="fileText" size={17} />} {busy ? "Gerando PDF..." : "Gerar prestação de contas"}
          </button>
          <div style={{ fontFamily: FONT_SANS, fontSize: 11, color: C.inkSoft, marginTop: 8, textAlign: "center" }}>Gera um único PDF: prestação + contrato + levantamento + despesas + repasse. Fica salvo em Histórico → Prestações.</div>
        </div>
      )}
    </div>
  );
}

function PrestacaoTab({ clientes, entries, prestacoes, drafts, setDrafts, onGerar, pcBusy, showToast }) {
  const lista = clientes.filter((c) => situacaoCliente(c, entries, prestacoes).prestacaoPendente).sort((a, b) => a.nome.localeCompare(b.nome, "pt-BR"));
  if (lista.length === 0) {
    return <EmptyState title="Nenhuma prestação de contas pendente" text="Quando um cliente tiver o levantamento lançado, ele aparece aqui até a prestação de contas ser gerada. As já geradas ficam em Histórico → Prestações." />;
  }
  return (
    <div>
      <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "10px 12px", borderRadius: 8, backgroundColor: C.parchmentDark, marginBottom: 14 }}>
        <Icon name="info" size={13} color={C.inkSoft} />
        <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft, lineHeight: 1.5 }}>Clientes já levantados que ainda não tiveram a prestação de contas gerada. O PDF só sai com todas as informações e documentos; se faltar algo, o app lista o que é.</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {lista.map((c) => (
          <PrestacaoCard key={c.id} cliente={c} entries={entries} draft={drafts[c.id]} showToast={showToast}
            onOpen={() => setDrafts((d) => (d[c.id] ? d : { ...d, [c.id]: novoDraftPrestacao(c, entries) }))}
            setDraft={(fn) => setDrafts((d) => ({ ...d, [c.id]: typeof fn === "function" ? fn(d[c.id] || novoDraftPrestacao(c, entries)) : fn }))}
            onGerar={onGerar} busy={pcBusy === c.id} />
        ))}
      </div>
    </div>
  );
}

function PrestacaoHistCard({ p, busy, onDownload, onRefazer }) {
  const [confirm, setConfirm] = useState(false);
  const rs = (p.dados && p.dados.resumo) || {};
  return (
    <div style={{ backgroundColor: C.card, border: `1px solid ${C.ruleSoft}`, borderLeft: `4px solid ${C.green}`, borderRadius: 10, padding: "12px 14px" }}>
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10 }}>
        <div style={{ minWidth: 0 }}>
          <div style={{ fontFamily: FONT_SERIF, fontSize: 15, fontWeight: 700, color: C.ink }}>{p.clienteNome}</div>
          <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft, marginTop: 3 }}>Gerada em {fmtTs(p.geradoEm)}{p.geradoPor ? ` · ${p.geradoPor}` : ""}</div>
          {p.dados && p.dados.repasse && <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft, marginTop: 2 }}>Repasse em {formatDateBR(p.dados.repasse.data)} · {p.dados.repasse.forma}</div>}
        </div>
        <div style={{ textAlign: "right", flexShrink: 0 }}>
          <div style={{ fontFamily: FONT_SANS, fontSize: 10.5, color: C.inkSoft }}>Líquido ao cliente</div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700, color: C.ink }}>{formatBRL(rs.liquido != null ? rs.liquido : p.liquido)}</div>
        </div>
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 12, flexWrap: "wrap" }}>
        <button onClick={onDownload} disabled={busy} style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 14px", borderRadius: 8, border: "none", backgroundColor: C.ink, color: "#fff", fontFamily: FONT_SANS, fontSize: 13, fontWeight: 700, cursor: busy ? "default" : "pointer", opacity: busy ? 0.7 : 1 }}>
          {busy ? <Spinner size={14} /> : <Icon name="download" size={14} />} {busy ? "Montando PDF..." : "Baixar PDF completo"}
        </button>
        {!confirm ? (
          <button onClick={() => setConfirm(true)} disabled={busy} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.rule}`, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><Icon name="pencil" size={13} /> Refazer</button>
        ) : (
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: C.red }}>Apaga esta e reabre o formulário. Confirmar?</span>
            <button onClick={() => { setConfirm(false); onRefazer(); }} style={{ background: C.red, color: "#fff", border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Sim</button>
            <button onClick={() => setConfirm(false)} style={{ background: "none", color: C.inkSoft, border: `1px solid ${C.rule}`, borderRadius: 6, padding: "5px 10px", fontSize: 12, cursor: "pointer" }}>Não</button>
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Histórico Tab (tudo o que já saiu das outras abas fica aqui) ----------
function HistoricoTab({ entries, clientes, prestacoes, pendentesCount, totalPendente, onEdit, onDelete, onGeneratePDF, pdfBusy, onEditCliente, onDeleteCliente, onDownloadPrestacao, onRefazerPrestacao, pcBusy }) {
  const [view, setView] = useState("lev");
  const [expandedId, setExpandedId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const abas = [["lev", `Levantamentos (${entries.length})`], ["pc", `Prestações (${prestacoes.length})`], ["cli", `Clientes (${clientes.length})`]];
  return (
    <div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        {abas.map(([k, lbl]) => (
          <button key={k} onClick={() => setView(k)} style={{ flex: 1, padding: "9px 4px", borderRadius: 8, border: `1.5px solid ${view === k ? C.ink : C.rule}`, backgroundColor: view === k ? C.ink : "#fff", color: view === k ? "#fff" : C.ink, fontFamily: FONT_SANS, fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}>{lbl}</button>
        ))}
      </div>

      {view === "lev" && (entries.length === 0 ? (
        <EmptyState title="Nenhum levantamento registrado" text="Toque em “Novo” para registrar o primeiro levantamento de RPV." />
      ) : (
        <div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, padding: "10px 14px", borderRadius: 8, backgroundColor: C.card, border: `1px solid ${C.ruleSoft}` }}>
            <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>{entries.length} registro(s) · {pendentesCount} sem relatório</span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 700, color: C.brassDark }}>{formatBRL(totalPendente)}</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {entries.map((en, i) => (
              <EntryCard key={en.id} entry={en} index={entries.length - i} expanded={expandedId === en.id} onToggle={() => setExpandedId(expandedId === en.id ? null : en.id)}
                onEdit={() => onEdit(en)} onGeneratePDF={() => onGeneratePDF(en)} pdfBusy={pdfBusy} confirmingDelete={confirmDeleteId === en.id}
                onAskDelete={() => setConfirmDeleteId(en.id)} onCancelDelete={() => setConfirmDeleteId(null)}
                onConfirmDelete={() => { onDelete(en.id); setConfirmDeleteId(null); }} />
            ))}
          </div>
        </div>
      ))}

      {view === "pc" && (prestacoes.length === 0 ? (
        <EmptyState title="Nenhuma prestação de contas gerada" text="As prestações geradas ficam aqui, com o PDF completo disponível para baixar de novo quando precisar." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {prestacoes.map((p) => (
            <PrestacaoHistCard key={p.id} p={p} busy={pcBusy === p.id} onDownload={() => onDownloadPrestacao(p)} onRefazer={() => onRefazerPrestacao(p)} />
          ))}
        </div>
      ))}

      {view === "cli" && (clientes.length === 0 ? (
        <EmptyState title="Nenhum cliente cadastrado" text="Cadastre clientes na aba “Clientes”." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {clientes.map((c) => (
            <ClientCard key={c.id} cliente={c} entries={entries} prestacoes={prestacoes} onEdit={() => onEditCliente(c)} confirmingDelete={confirmDeleteId === c.id}
              onAskDelete={() => setConfirmDeleteId(c.id)} onCancelDelete={() => setConfirmDeleteId(null)}
              onConfirmDelete={() => { onDeleteCliente(c.id); setConfirmDeleteId(null); }} />
          ))}
        </div>
      ))}
    </div>
  );
}

// ---------- Main App ----------
function RPVLedgerApp() {
  const [user, setUser] = useState(undefined); // undefined = checking, null = logged out
  const [entries, setEntries] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [dataLoading, setDataLoading] = useState(true);
  const [tab, setTab] = useState("clientes");
  const [toast, setToast] = useState(null);

  const [form, setForm] = useState(EMPTY_FORM);
  const [editingId, setEditingId] = useState(null);
  const [rateioManual, setRateioManual] = useState(false);
  const [photoDataUrl, setPhotoDataUrl] = useState(null);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const fileInputRef = useRef(null);
  const valorInputRef = useRef(null);

  const [clientForm, setClientForm] = useState(EMPTY_CLIENT_FORM);
  const [editingClienteId, setEditingClienteId] = useState(null);
  const [savingCliente, setSavingCliente] = useState(false);
  const [pdfBusy, setPdfBusy] = useState(false);
  const [prestacoes, setPrestacoes] = useState([]);
  const [pcDrafts, setPcDrafts] = useState({});
  const [pcBusy, setPcBusy] = useState(null);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u || null));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user) return;
    setDataLoading(true);
    const unsubEntries = db.collection("levantamentos").orderBy("dataLevantamento", "desc").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => d.data())); setDataLoading(false); },
      () => setDataLoading(false)
    );
    const unsubClientes = db.collection("clientes").orderBy("dataCadastro", "desc").onSnapshot(
      (snap) => setClientes(snap.docs.map((d) => d.data())),
      () => {}
    );
    const unsubPrest = db.collection("prestacoes").orderBy("geradoEm", "desc").onSnapshot(
      (snap) => setPrestacoes(snap.docs.map((d) => d.data())),
      () => {}
    );
    return () => { unsubEntries(); unsubClientes(); unsubPrest(); };
  }, [user]);

  function showToast(msg, type) {
    setToast({ msg, type: type || "success" });
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 3200);
  }

  const responsaveisConhecidos = useMemo(() => Array.from(new Set(entries.map((e) => e.responsavel).filter(Boolean))), [entries]);

  function resetForm() { setForm(EMPTY_FORM); setPhotoDataUrl(null); setEditingId(null); setRateioManual(false); setLastSaved(null); }
  function nextEntry() { setForm((f) => ({ ...EMPTY_FORM, banco: f.banco, responsavel: f.responsavel })); setPhotoDataUrl(null); setEditingId(null); setRateioManual(false); setLastSaved(null); }

  async function startEdit(entry) {
    setEditingId(entry.id); setLastSaved(null); setRateioManual(true);
    setForm({
      clienteId: entry.clienteId || "", cliente: entry.cliente, processo: entry.processo, banco: entry.banco,
      dataLevantamento: entry.dataLevantamento, responsavel: entry.responsavel,
      valorTotal: entry.valorTotal ? String(entry.valorTotal) : "",
      valorEscritorio: entry.valorEscritorio ? String(entry.valorEscritorio) : "",
      valorCliente: entry.valorCliente ? String(entry.valorCliente) : "",
      valorFlavio: entry.valorFlavio ? String(entry.valorFlavio) : "",
      valorBruno: entry.valorBruno ? String(entry.valorBruno) : "",
      sucumbencial: !!entry.sucumbencial, obs: entry.obs || "",
      valorPrincipal: entry.valorPrincipal ? String(entry.valorPrincipal) : "", valorDestaque: entry.valorDestaque ? String(entry.valorDestaque) : "",
    });
    setPhotoDataUrl(entry.foto || null);
    setTab("novo");
  }

  async function handlePhotoFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setPhotoBusy(true);
    try {
      if (file.type === "application/pdf") {
        if (file.size > MAX_PDF_BYTES) {
          showToast(`PDF muito grande (máx. ${Math.round(MAX_PDF_BYTES / 1024)} KB). Tente um arquivo menor.`, "error");
        } else {
          setPhotoDataUrl(await readFileAsDataURL(file));
        }
      } else {
        setPhotoDataUrl(await compressImage(file));
      }
    } catch (err) {
      showToast("Não foi possível processar o arquivo.", "error");
    }
    setPhotoBusy(false);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const linkedClient = clientes.find((c) => c.id === form.clienteId) || null;
    const usaDestaque = !!(linkedClient && linkedClient.temDestaque);
    const vP = usaDestaque ? parseNum(form.valorPrincipal) : parseNum(form.valorTotal);
    const vD = usaDestaque ? parseNum(form.valorDestaque) : 0;
    const totalLev = vP + vD;
    if (!form.cliente.trim() || !form.processo.trim() || !form.dataLevantamento || !form.responsavel.trim() || !(totalLev > 0)) {
      showToast(usaDestaque && !(totalLev > 0) ? "Informe o valor levantado do principal e/ou do destaque." : "Preencha os campos obrigatórios.", "error"); return;
    }
    setSaving(true);
    const id = editingId || newId("rpv");
    const baseEntry = editingId ? entries.find((en) => en.id === editingId) : null;

    let valores;
    if (linkedClient && !rateioManual) {
      const split = computeLevantamento({ cliente: linkedClient, vPrincipal: vP, vDestaque: vD, sucumbencial: form.sucumbencial, parceiroJaPago: parceiroJaPagoDe(entries, linkedClient.id, editingId) });
      valores = { valorEscritorio: split.escritorio, valorCliente: split.cliente, valorFlavio: split.flavio, valorBruno: split.bruno,
        valorParceiro: split.comissaoParceiro, parceiroNome: split.comissaoParceiro > 0 ? (linkedClient.parceiroNome || "").trim() : null,
        administrativoPendente: split.administrativoPendente || 0, valorExcedenteCliente: split.excedenteCliente || 0, det: detDeSplit(split, vP, vD, linkedClient) };
    } else {
      valores = { valorEscritorio: parseNum(form.valorEscritorio), valorCliente: parseNum(form.valorCliente), valorFlavio: parseNum(form.valorFlavio), valorBruno: parseNum(form.valorBruno), valorParceiro: 0, parceiroNome: null, administrativoPendente: 0, valorExcedenteCliente: 0,
        det: (baseEntry && baseEntry.det && Math.abs((baseEntry.valorTotal || 0) - totalLev) < 0.005 && Math.abs((baseEntry.valorCliente || 0) - parseNum(form.valorCliente)) < 0.005) ? baseEntry.det : null };
    }

    const entry = {
      id, clienteId: form.clienteId || null, cliente: form.cliente.trim(), processo: form.processo.trim(),
      banco: form.banco, dataLevantamento: form.dataLevantamento, responsavel: form.responsavel.trim(),
      valorTotal: totalLev, ...valores, sucumbencial: !!form.sucumbencial,
      tipoLevantamento: !usaDestaque || form.sucumbencial ? "completo" : vP > 0 && vD > 0 ? "ambos" : vD > 0 ? "destaque" : "principal",
      valorPrincipal: vP, valorDestaque: vD, tipoRequisicao: linkedClient ? (linkedClient.tipoRequisicao || "RPV") : (baseEntry ? baseEntry.tipoRequisicao || null : null),
      donoCliente: linkedClient ? linkedClient.dono : baseEntry ? baseEntry.donoCliente : null,
      obs: form.obs.trim(), foto: photoDataUrl || null, temFoto: !!photoDataUrl,
      enviado: baseEntry ? !!baseEntry.enviado : false, enviadoEm: baseEntry ? baseEntry.enviadoEm : null,
      criadoEm: baseEntry ? baseEntry.criadoEm : Date.now(), editadoEm: Date.now(),
      registradoPor: user.email,
    };

    try {
      await db.collection("levantamentos").doc(id).set(entry);
    } catch (err) {
      showToast("Erro ao salvar: " + err.message, "error");
      setSaving(false);
      return;
    }

    setSaving(false);
    if (editingId) { showToast("Levantamento atualizado."); resetForm(); setTab("historico"); }
    else { showToast("Levantamento registrado."); setLastSaved(entry); }
  }

  async function handleDelete(id) {
    try { await db.collection("levantamentos").doc(id).delete(); showToast("Registro excluído."); if (editingId === id) resetForm(); }
    catch (err) { showToast("Erro ao excluir: " + err.message, "error"); }
  }

  async function markAsSent(ids, msg) {
    try {
      const batch = db.batch();
      const stamp = Date.now();
      ids.forEach((id) => batch.update(db.collection("levantamentos").doc(id), { enviado: true, enviadoEm: stamp }));
      await batch.commit();
      showToast(typeof msg === "string" ? msg : `${ids.length} registro(s) marcado(s) como enviado(s).`);
    } catch (err) { showToast("Erro ao marcar como enviado: " + err.message, "error"); }
  }

  async function generateSinglePDF(entry, preloadedPhoto) {
    const cliente = clientes.find((c) => c.id === entry.clienteId) || null;
    const photo = preloadedPhoto !== undefined ? preloadedPhoto : entry.foto || null;
    setPdfBusy(true);
    try {
      const entryP = { ...entry, _pend: pendenciaTexto(entry, cliente, entries) };
      const blob = buildSinglePdfBlob(entryP, cliente, photo);
      const baseFilename = `RPV-${entry.cliente}-${entry.dataLevantamento}`.replace(/[^\w.\- ]/g, "");
      const items = [{ blob, filename: `${baseFilename}.pdf` }];
      if (photo && isPdfDataUrl(photo)) {
        items.push({ blob: dataUrlToBlob(photo), filename: `${baseFilename}-comprovante-banco.pdf` });
      }
      await shareFiles(items, showToast);
    } catch (err) {
      showToast("Erro ao gerar o PDF: " + err.message, "error");
    }
    setPdfBusy(false);
  }
  async function generateBatchPDF(list, totals, periodoLabel) {
    setPdfBusy(true);
    try {
      const blob = buildBatchPdfBlob(list, totals, periodoLabel);
      const filename = `Relatorio-RPV-${todayISO()}.pdf`;
      const ok = await sharePdfBlob(blob, filename, showToast);
      setPdfBusy(false);
      return ok;
    } catch (err) {
      showToast("Erro ao gerar o PDF: " + err.message, "error");
    }
    setPdfBusy(false);
    return false;
  }

  async function generateBackup() {
    setPdfBusy(true);
    try {
      const payload = {
        geradoEm: new Date().toISOString(),
        totalClientes: clientes.length,
        totalLevantamentos: entries.length,
        totalPrestacoes: prestacoes.length,
        prestacoes,
        clientes,
        levantamentos: entries,
      };
      const json = JSON.stringify(payload, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const filename = `backup-controle-rpv-${todayISO()}.json`;
      await shareFiles([{ blob, filename, type: "application/json" }], showToast);
    } catch (err) {
      showToast("Erro ao gerar backup: " + err.message, "error");
    }
    setPdfBusy(false);
  }

  // ---- Prestação de contas
  async function persistirDraft(draft, clienteId) {
    const contrato = await guardarAnexos(draft.contrato, clienteId, "contrato");
    const despesas = [];
    for (const d of draft.despesas || []) despesas.push({ ...d, anexos: await guardarAnexos(d.anexos, clienteId, "despesa") });
    const repasse = { ...draft.repasse, anexos: await guardarAnexos(draft.repasse.anexos, clienteId, "repasse") };
    return { ...draft, contrato, despesas, repasse };
  }
  async function gerarPrestacao(cliente, draft) {
    setPcBusy(cliente.id);
    try {
      const saved = await persistirDraft(draft, cliente.id);
      const r = montarPrestacao({ cliente, entries, draft: saved });
      if (!r.ok) { showToast("Há pendências na prestação de contas.", "error"); setPcBusy(null); return; }
      const blob = await buildPrestacaoPdfBlob(r.dados, entries);
      const id = newId("pc");
      await db.collection("clientes").doc(cliente.id).set({
        especieBeneficio: (saved.especie || "").trim(), dataContrato: saved.dataContrato || "",
        contratoAnexos: saved.contrato.map((a) => ({ id: a.id, nome: a.nome, mime: a.mime })), editadoEm: Date.now(),
      }, { merge: true });
      await db.collection("prestacoes").doc(id).set({
        id, clienteId: cliente.id, clienteNome: cliente.nome, geradoEm: Date.now(), geradoPor: user.email,
        liquido: r.dados.resumo.liquido, dados: semDataUrl(r.dados), draft: semDataUrl(saved),
      });
      setPcDrafts((d) => { const n = { ...d }; delete n[cliente.id]; return n; });
      showToast("Prestação de contas gerada. Ela fica em Histórico → Prestações.");
      await shareFiles([{ blob, filename: nomeArquivoPrestacao(cliente.nome) }], showToast);
    } catch (err) {
      showToast("Erro ao gerar a prestação de contas: " + err.message, "error");
    }
    setPcBusy(null);
  }
  async function baixarPrestacao(p) {
    setPcBusy(p.id);
    try {
      const blob = await buildPrestacaoPdfBlob(p.dados, entries);
      await shareFiles([{ blob, filename: nomeArquivoPrestacao(p.clienteNome) }], showToast);
    } catch (err) { showToast("Erro ao montar o PDF: " + err.message, "error"); }
    setPcBusy(null);
  }
  async function refazerPrestacao(p) {
    try {
      await db.collection("prestacoes").doc(p.id).delete();
      if (p.draft) setPcDrafts((d) => ({ ...d, [p.clienteId]: p.draft }));
      setTab("prestacao");
      showToast("Prestação apagada. Ajuste o que precisar e gere de novo.");
    } catch (err) { showToast("Erro ao refazer: " + err.message, "error"); }
  }

  function resetClientForm() { setClientForm(EMPTY_CLIENT_FORM); setEditingClienteId(null); }
  function startEditCliente(cliente) {
    setEditingClienteId(cliente.id);
    setClientForm({
      dataCadastro: cliente.dataCadastro || todayISO(), nome: cliente.nome, cpf: cliente.cpf || "",
      numeroBeneficio: cliente.numeroBeneficio || "", processo: cliente.processo || "",
      valorEstimado: cliente.valorEstimado ? String(cliente.valorEstimado) : "", dono: cliente.dono,
      percentualExito: cliente.percentualExito ? String(cliente.percentualExito) : "30",
      valorAdministrativo: cliente.valorAdministrativo ? String(cliente.valorAdministrativo) : "",
      gastosReembolsaveis: cliente.gastosReembolsaveis ? String(cliente.gastosReembolsaveis) : "",
      temSucumbencia: !!cliente.temSucumbencia, valorSucumbencial: cliente.valorSucumbencial ? String(cliente.valorSucumbencial) : "", obs: cliente.obs || "",
      parceiroNome: cliente.parceiroNome || "", parceiroTipo: cliente.parceiroTipo || "percentual", parceiroValor: cliente.parceiroValor ? String(cliente.parceiroValor) : "",
      tipoRequisicao: cliente.tipoRequisicao || "RPV", numeroRequisicao: cliente.numeroRequisicao || "",
      temDestaque: !!cliente.temDestaque, valorDestaque: cliente.valorDestaque ? String(cliente.valorDestaque) : "",
      valorLiquido: cliente.temDestaque ? String(Math.max(0, (cliente.valorEstimado || 0) - (cliente.valorDestaque || 0))) : "",
      administrativoPago: !!cliente.administrativoPago,
      administrativoPagoValor: cliente.administrativoPagoValor ? String(cliente.administrativoPagoValor) : (cliente.administrativoPago && cliente.valorAdministrativo ? String(cliente.valorAdministrativo) : ""),
      especieBeneficio: cliente.especieBeneficio || "", dataContrato: cliente.dataContrato || "",
      contratoItens: (cliente.contratoAnexos || []).map((a) => ({ ...a })),
    });
  }

  async function handleSubmitCliente(e) {
    e.preventDefault();
    if (!clientForm.nome.trim() || !clientForm.dono || !clientForm.percentualExito) {
      showToast("Preencha nome, dono do cliente e percentual do êxito.", "error"); return;
    }
    if (clientForm.temDestaque) {
      if (!(parseNum(clientForm.valorDestaque) > 0)) { showToast("Informe o valor do destaque de honorários (ou desmarque a caixa).", "error"); return; }
      if (!(parseNum(clientForm.valorLiquido) > 0)) { showToast("Informe o valor do cliente (RPV/precatório sem o destaque).", "error"); return; }
    }
    setSavingCliente(true);
    const id = editingClienteId || newId("cli");
    const base = editingClienteId ? clientes.find((c) => c.id === editingClienteId) : null;
    let contratoAnexos = [];
    try {
      const salvos = await guardarAnexos(clientForm.contratoItens, id, "contrato");
      contratoAnexos = salvos.map((a) => ({ id: a.id, nome: a.nome, mime: a.mime }));
      const mantidos = new Set(contratoAnexos.map((a) => a.id));
      for (const a of (base && base.contratoAnexos) || []) { if (!mantidos.has(a.id)) await db.collection("anexos").doc(a.id).delete(); }
    } catch (err) { showToast("Erro ao salvar o contrato: " + err.message, "error"); setSavingCliente(false); return; }
    const cliente = {
      ...(base || {}),
      id, dataCadastro: clientForm.dataCadastro || todayISO(), nome: clientForm.nome.trim().toLocaleUpperCase("pt-BR"), cpf: clientForm.cpf.trim(),
      numeroBeneficio: clientForm.numeroBeneficio.trim(), processo: clientForm.processo.trim(),
      valorEstimado: clientForm.temDestaque ? parseNum(clientForm.valorLiquido) + parseNum(clientForm.valorDestaque) : parseNum(clientForm.valorEstimado), dono: clientForm.dono, percentualExito: parseNum(clientForm.percentualExito),
      valorAdministrativo: parseNum(clientForm.valorAdministrativo), gastosReembolsaveis: parseNum(clientForm.gastosReembolsaveis), temSucumbencia: !!clientForm.temSucumbencia,
      valorSucumbencial: parseNum(clientForm.valorSucumbencial), obs: clientForm.obs.trim(),
      parceiroNome: clientForm.parceiroNome.trim(), parceiroTipo: clientForm.parceiroTipo === "fixo" ? "fixo" : "percentual",
      parceiroValor: clientForm.parceiroNome.trim() ? parseNum(clientForm.parceiroValor) : 0,
      tipoRequisicao: clientForm.tipoRequisicao === "Precatório" ? "Precatório" : "RPV", numeroRequisicao: clientForm.numeroRequisicao.trim(),
      temDestaque: !!clientForm.temDestaque, valorDestaque: clientForm.temDestaque ? parseNum(clientForm.valorDestaque) : 0,
      administrativoPago: !!clientForm.administrativoPago && parseNum(clientForm.valorAdministrativo) > 0,
      administrativoPagoValor: clientForm.administrativoPago ? Math.min(parseNum(clientForm.administrativoPagoValor) || parseNum(clientForm.valorAdministrativo), parseNum(clientForm.valorAdministrativo)) : 0,
      especieBeneficio: clientForm.especieBeneficio.trim(), dataContrato: clientForm.dataContrato || "", contratoAnexos,
      criadoEm: base ? base.criadoEm : Date.now(), editadoEm: Date.now(),
    };
    try {
      await db.collection("clientes").doc(id).set(cliente);
      showToast(editingClienteId ? "Cadastro atualizado." : "Cliente cadastrado.");
      resetClientForm();
    } catch (err) { showToast("Erro ao salvar cliente: " + err.message, "error"); }
    setSavingCliente(false);
  }

  async function handleDeleteCliente(id) {
    try { await db.collection("clientes").doc(id).delete(); showToast("Cadastro excluído."); if (editingClienteId === id) resetClientForm(); }
    catch (err) { showToast("Erro ao excluir: " + err.message, "error"); }
  }

  if (user === undefined) {
    return <div style={{ minHeight: "100vh", backgroundColor: C.ink, display: "flex", alignItems: "center", justifyContent: "center" }}><Spinner size={26} /></div>;
  }
  if (user === null) return <LoginScreen />;

  const clientesPend = clientes.filter((c) => situacaoCliente(c, entries, prestacoes).pendenteLancar);
  const clientesOpcoes = clientes.filter((c) => c.id === form.clienteId || clientesPend.some((x) => x.id === c.id));
  const prestPendentes = clientes.filter((c) => situacaoCliente(c, entries, prestacoes).prestacaoPendente).length;
  const pendentes = entries.filter((en) => !en.enviado);
  const totalPendente = pendentes.reduce((s, en) => s + (en.valorTotal || 0), 0);

  return (
    <div style={{ minHeight: "100vh", width: "100%", backgroundColor: C.parchment, fontFamily: FONT_SANS }}>
      <header className="no-print" style={{ padding: "28px 20px 20px", backgroundColor: C.ink, borderBottom: `3px double ${C.brass}` }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <LogoMark size={38} />
            <div>
              <span style={{ fontFamily: FONT_SANS, fontSize: 11, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: C.brassSoft }}>Rezende Maia Advocacia</span>
              <h1 style={{ fontFamily: FONT_SERIF, fontSize: 22, fontWeight: 700, color: "#fff", letterSpacing: "0.01em", marginTop: 1 }}>Controle de RPV</h1>
            </div>
          </div>
          <button onClick={() => auth.signOut()} title="Sair" style={{ background: "none", border: "none", color: "#B7C2CE", cursor: "pointer", padding: 6 }}><Icon name="logout" size={18} /></button>
        </div>
        <p style={{ fontFamily: FONT_SANS, fontSize: 12, color: "#B7C2CE", marginTop: 8 }}>{user.email} · dados sincronizados entre seus aparelhos</p>
      </header>

      <main style={{ padding: "20px 16px 112px", maxWidth: 520, margin: "0 auto" }}>
        {dataLoading ? (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: "96px 0", color: C.inkSoft }}>
            <Spinner size={20} color={C.inkSoft} /><span style={{ marginLeft: 8, fontFamily: FONT_SANS, fontSize: 14 }}>Carregando registros...</span>
          </div>
        ) : tab === "clientes" ? (
          <ClientesTab clientes={clientesPend} entries={entries} showToast={showToast} clientForm={clientForm} setClientForm={setClientForm} onSubmit={handleSubmitCliente}
            editingClienteId={editingClienteId} onCancelEdit={resetClientForm} onEdit={startEditCliente} onDelete={handleDeleteCliente} saving={savingCliente} />
        ) : tab === "novo" ? (
          <FormTab form={form} setForm={setForm} onSubmit={handleSubmit} editingId={editingId} onCancelEdit={resetForm}
            photoDataUrl={photoDataUrl} setPhotoDataUrl={setPhotoDataUrl} photoBusy={photoBusy} fileInputRef={fileInputRef} valorInputRef={valorInputRef}
            onPhotoFile={handlePhotoFile} responsaveisConhecidos={responsaveisConhecidos} clientes={clientes} entries={entries} saving={saving} showToast={showToast}
            rateioManual={rateioManual} setRateioManual={setRateioManual} lastSaved={lastSaved} onNextEntry={nextEntry} clientesOpcoes={clientesOpcoes}
            onGeneratePDF={(entry) => generateSinglePDF(entry, photoDataUrl)} pdfBusy={pdfBusy} />
        ) : tab === "prestacao" ? (
          <PrestacaoTab clientes={clientes} entries={entries} prestacoes={prestacoes} drafts={pcDrafts} setDrafts={setPcDrafts} onGerar={gerarPrestacao} pcBusy={pcBusy} showToast={showToast} />
        ) : tab === "historico" ? (
          <HistoricoTab entries={entries} clientes={clientes} prestacoes={prestacoes} pendentesCount={pendentes.length} totalPendente={totalPendente} onEdit={startEdit} onDelete={handleDelete} onGeneratePDF={(entry) => generateSinglePDF(entry)} pdfBusy={pdfBusy}
            onEditCliente={(c) => { startEditCliente(c); setTab("clientes"); }} onDeleteCliente={handleDeleteCliente}
            onDownloadPrestacao={baixarPrestacao} onRefazerPrestacao={refazerPrestacao} pcBusy={pcBusy} />
        ) : (
          <RelatorioTab entries={entries} clientes={clientes} onMarkSent={markAsSent} showToast={showToast} onGeneratePDF={generateBatchPDF} pdfBusy={pdfBusy} onBackup={generateBackup} />
        )}
      </main>

      <Toast toast={toast} />

      <nav className="no-print" style={{ position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", backgroundColor: "#fff", borderTop: `1.5px solid ${C.rule}`, boxShadow: "0 -4px 14px rgba(31,44,61,0.06)" }}>
        <NavButton active={tab === "clientes"} icon={<Icon name="users" size={18} />} label="Clientes" onClick={() => { if (tab !== "clientes") resetClientForm(); setTab("clientes"); }} />
        <NavButton active={tab === "novo"} icon={<Icon name="plus" size={19} />} label="Novo" onClick={() => { if (tab !== "novo") resetForm(); setTab("novo"); }} />
        <NavButton active={tab === "prestacao"} icon={<Icon name="fileText" size={19} />} label="Prestação" badge={prestPendentes > 0 ? prestPendentes : null} onClick={() => setTab("prestacao")} />
        <NavButton active={tab === "historico"} icon={<Icon name="clipboard" size={19} />} label="Histórico" onClick={() => setTab("historico")} />
        <NavButton active={tab === "relatorio"} icon={<Icon name="send" size={18} />} label="Relatório" badge={pendentes.length > 0 ? pendentes.length : null} onClick={() => setTab("relatorio")} />
      </nav>
    </div>
  );
}

function NavButton({ active, icon, label, onClick, badge }) {
  return (
    <button onClick={onClick} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, position: "relative", padding: "10px 0 12px", background: "none", border: "none", cursor: "pointer" }}>
      <span style={{ color: active ? C.brass : "#A6AFB9" }}>{icon}</span>
      <span style={{ fontFamily: FONT_SANS, fontSize: 10.5, fontWeight: active ? 700 : 500, color: active ? C.ink : "#A6AFB9", letterSpacing: "0.02em" }}>{label}</span>
      {badge && (
        <span style={{ position: "absolute", top: 4, right: "calc(50% - 26px)", minWidth: 16, height: 16, borderRadius: 999, backgroundColor: C.red, color: "#fff", fontSize: 9.5, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px" }}>{badge}</span>
      )}
    </button>
  );
}

// ---------- Boot ----------
const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(FIREBASE_READY ? <RPVLedgerApp /> : <SetupScreen />);
</script>

<script>
  if (window.__FIREBASE_CONFIG__ && window.__FIREBASE_CONFIG__.apiKey.indexOf("COLOQUE_AQUI") === -1) {
    if ("serviceWorker" in navigator) {
      // Quando uma versão nova do app assume o controle, recarrega a página
      // automaticamente uma vez para exibir a atualização (evita ficar
      // "preso" numa versão antiga em cache).
      let alreadyReloaded = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (alreadyReloaded) return;
        alreadyReloaded = true;
        window.location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  }
</script>
</body>
</html>
