// ---------- Helpers ----------
function todayISO() { return new Date().toISOString().slice(0, 10); }
function nowLabel() {
  const d = new Date();
  return `${formatDateBR(d.toISOString().slice(0, 10))} às ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function formatDateBR(iso) {
  if (!iso) return "—";
  const parts = iso.split("-");
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}/${m}/${y}`;
}
function formatBRL(v) {
  const n = Number(v) || 0;
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function formatPct(v) {
  const n = Number(v) || 0;
  return `${n.toLocaleString("pt-BR", { maximumFractionDigits: 2 })}%`;
}
function parseNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function newId(prefix) { return (prefix || "id") + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8); }
function maskCPF(value) {
  const digits = String(value).replace(/\D/g, "").slice(0, 11);
  if (digits.length > 9) return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
  if (digits.length > 6) return digits.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
  if (digits.length > 3) return digits.replace(/(\d{3})(\d{1,3})/, "$1.$2");
  return digits;
}
function compressImage(file, maxW = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Falha ao ler arquivo"));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Falha ao carregar imagem"));
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = quality;
        let dataUrl = canvas.toDataURL("image/jpeg", q);
        let tries = 0;
        while (dataUrl.length > 700000 && tries < 6) {
          q = Math.max(0.3, q - 0.12);
          dataUrl = canvas.toDataURL("image/jpeg", q);
          tries++;
        }
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function computeSplit({ valorTotal, percentualExito, dono, sucumbencial }) {
  const total = Number(valorTotal) || 0;
  const donoIsBruno = dono === "Bruno";
  if (sucumbencial) {
    return { escritorio: 0, cliente: 0, flavio: donoIsBruno ? 0 : total, bruno: donoIsBruno ? total : 0, honorarioTotal: total, baseDivisivel: 0, excedente: total };
  }
  const pct = (Number(percentualExito) || 0) / 100;
  const honorarioTotal = total * pct;
  const baseDivisivel = Math.min(honorarioTotal, total * 0.3);
  const excedente = Math.max(0, honorarioTotal - baseDivisivel);
  const escritorio = baseDivisivel * 0.5;
  const donoShare = baseDivisivel * 0.4 + excedente;
  const outroShare = baseDivisivel * 0.1;
  const clienteValor = Math.max(0, total - honorarioTotal);
  return {
    escritorio, cliente: clienteValor,
    flavio: donoIsBruno ? outroShare : donoShare,
    bruno: donoIsBruno ? donoShare : outroShare,
    honorarioTotal, baseDivisivel, excedente,
  };
}

// ---------- Login ----------
function LoginScreen() {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleLogin(e) {
    e.preventDefault();
    setErro("");
    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), senha);
    } catch (err) {
      const msgs = {
        "auth/invalid-email": "E-mail inválido.",
        "auth/user-not-found": "Usuário não encontrado. Peça para o administrador criar seu acesso no Firebase.",
        "auth/wrong-password": "Senha incorreta.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/too-many-requests": "Muitas tentativas. Aguarde um momento e tente de novo.",
      };
      setErro(msgs[err.code] || "Não foi possível entrar. Confira o e-mail e a senha.");
    }
    setLoading(false);
  }

  return (
    <div style={{ minHeight: "100vh", backgroundColor: C.ink, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: FONT_SANS }}>
      <form onSubmit={handleLogin} style={{ width: "100%", maxWidth: 340 }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 26 }}>
          <LogoMark size={54} />
          <span style={{ fontFamily: FONT_SANS, fontSize: 11, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: C.brassSoft, marginTop: 12 }}>Rezende Maia Advocacia</span>
          <h1 style={{ fontFamily: FONT_SERIF, fontSize: 22, color: "#fff", marginTop: 2 }}>Controle de RPV</h1>
        </div>
        <div style={{ backgroundColor: "#28394E", borderRadius: 12, padding: 18 }}>
          <Field label="E-mail">
            <TextInput type="email" autoCapitalize="none" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seuemail@exemplo.com" required />
          </Field>
          <Field label="Senha">
            <TextInput type="password" value={senha} onChange={(e) => setSenha(e.target.value)} placeholder="••••••••" required />
          </Field>
          {erro && (
            <div style={{ backgroundColor: C.redSoft, border: `1px solid ${C.red}`, borderRadius: 8, padding: "8px 10px", marginBottom: 10 }}>
              <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.red }}>{erro}</span>
            </div>
          )}
          <button type="submit" disabled={loading} style={{ width: "100%", backgroundColor: C.brass, color: "#fff", fontFamily: FONT_SANS, fontSize: 15, fontWeight: 700, padding: "13px", borderRadius: 9, border: "none", cursor: loading ? "default" : "pointer", opacity: loading ? 0.75 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
            {loading && <Spinner size={16} />} Entrar
          </button>
        </div>
        <p style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: "#8A9AAC", textAlign: "center", marginTop: 14 }}>
          Acesso restrito à equipe do escritório. Contas são criadas pelo administrador no painel do Firebase.
        </p>
      </form>
    </div>
  );
}

function FeeBreakdown({ dono, percentualExito, valorEstimado, valorAdministrativo, temSucumbencia, valorSucumbencial }) {
  const valor = parseNum(valorEstimado);
  const split = computeSplit({ valorTotal: valor, percentualExito, dono, sucumbencial: false });
  const donoLabel = dono === "Flávio" ? "Dr. Flávio" : "Bruno";
  const outroLabel = dono === "Flávio" ? "Bruno" : "Dr. Flávio";
  const donoTotal = dono === "Flávio" ? split.flavio : split.bruno;
  const outroTotal = dono === "Flávio" ? split.bruno : split.flavio;
  return (
    <div style={{ backgroundColor: C.ink, borderRadius: 10, padding: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon name="scale" size={14} color={C.brassSoft} />
        <span style={{ fontFamily: FONT_SERIF, fontSize: 12, fontWeight: 700, color: C.brassSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>Como ficam os honorários</span>
      </div>
      {valor > 0 ? (
        <React.Fragment>
          <BreakdownRow label={`Honorário total (${formatPct(percentualExito)} de ${formatBRL(valor)})`} value={split.honorarioTotal} />
          <BreakdownRow label="Base divisível (até 30% do valor)" value={split.baseDivisivel} />
          {split.excedente > 0 && <BreakdownRow label={`Excedente — 100% ${donoLabel}`} value={split.excedente} highlight />}
          <div style={{ height: 1, backgroundColor: "rgba(241,230,200,0.2)", margin: "8px 0" }} />
          <BreakdownRow label="Escritório (50% do divisível)" value={split.escritorio} bold />
          <BreakdownRow label={`${donoLabel}, dono do cliente (40% + excedente)`} value={donoTotal} bold />
          <BreakdownRow label={`${outroLabel}, outro sócio (10% do divisível)`} value={outroTotal} bold />
          <BreakdownRow label="Cliente recebe" value={split.cliente} />
        </React.Fragment>
      ) : (
        <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: "#B7C2CE" }}>Informe o valor do RPV/precatório expedido para ver a simulação do rateio.</span>
      )}
      {parseNum(valorAdministrativo) > 0 && (
        <React.Fragment>
          <div style={{ height: 1, backgroundColor: "rgba(241,230,200,0.2)", margin: "8px 0" }} />
          <BreakdownRow label="Valor administrativo (INSS)" value={parseNum(valorAdministrativo)} />
          <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: "#B7C2CE", marginTop: 2 }}>Destino: {administrativoDestino(dono)}</div>
        </React.Fragment>
      )}
      {temSucumbencia && (
        <React.Fragment>
          <div style={{ height: 1, backgroundColor: "rgba(241,230,200,0.2)", margin: "8px 0" }} />
          {parseNum(valorSucumbencial) > 0 && <BreakdownRow label="Honorários sucumbenciais (estimado)" value={parseNum(valorSucumbencial)} />}
          <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: "#B7C2CE", marginTop: 2 }}>Sucumbenciais são 100% de {donoLabel} — não entram no divisível.</div>
        </React.Fragment>
      )}
    </div>
  );
}
function BreakdownRow({ label, value, bold, highlight }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "2px 0" }}>
      <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: highlight ? C.bbAccent : bold ? "#fff" : "#B7C2CE" }}>{label}</span>
      <span style={{ fontFamily: FONT_MONO, fontSize: bold ? "13.5px" : "12px", fontWeight: bold ? 700 : 500, color: highlight ? C.bbAccent : bold ? C.brassSoft : "#DDE3E9", fontVariantNumeric: "tabular-nums", whiteSpace: "nowrap" }}>{formatBRL(value)}</span>
    </div>
  );
}

        <span style={sectionLabelStyle}>Valor levantado</span>
        <MoneyInput big inputRef={valorInputRef} value={form.valorTotal} onChange={(e) => set("valorTotal", e.target.value)} />
        <div style={{ marginTop: 12 }}>
          <Field label="Responsável pelo levantamento" required>
            <TextInput list="responsaveis-list" value={form.responsavel} onChange={(e) => set("responsavel", e.target.value)} placeholder="Quem foi ao banco" />
            <datalist id="responsaveis-list">{responsaveisConhecidos.map((r) => (<option key={r} value={r} />))}</datalist>
          </Field>
        </div>
        {linkedClient && (
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
            <input type="checkbox" checked={form.sucumbencial} onChange={(e) => set("sucumbencial", e.target.checked)} style={{ width: 16, height: 16, accentColor: C.brass }} />
            <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.ink }}>Honorários sucumbenciais (100% {linkedClient.dono === "Flávio" ? "Dr. Flávio" : "Bruno"})</span>
          </label>
        )}
      </div>

      <div style={cardStyle}>
        <span style={sectionLabelStyle}>Comprovante do banco</span>
        <input type="file" accept="image/*" capture="environment" ref={fileInputRef} onChange={onPhotoFile} style={{ display: "none" }} />
        {photoDataUrl ? (
          <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
            <div style={{ width: 92, height: 92, borderRadius: 8, overflow: "hidden", border: `1px solid ${C.rule}`, transform: "rotate(-1.5deg)", boxShadow: "0 2px 6px rgba(31,44,61,0.15)", flexShrink: 0 }}>
              <img src={photoDataUrl} alt="Comprovante" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, color: C.brassDark, background: "none", border: `1.5px solid ${C.brass}`, borderRadius: 7, padding: "6px 10px", cursor: "pointer" }}>Tirar outra foto</button>
              <button type="button" onClick={() => setPhotoDataUrl(null)} style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.red, background: "none", border: "none", padding: "0 2px", cursor: "pointer", textAlign: "left" }}>Remover foto</button>
            </div>
          </div>
        ) : (
          <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={photoBusy} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: 18, borderRadius: 10, border: `2px dashed ${C.brass}`, backgroundColor: C.brassSoft, color: C.brassDark, fontFamily: FONT_SANS, fontSize: 14.5, fontWeight: 700, cursor: "pointer" }}>
            {photoBusy ? <Spinner size={18} color={C.brassDark} /> : <Icon name="camera" size={18} />}
            {photoBusy ? "Processando foto..." : "Tirar foto do comprovante"}
          </button>
        )}
      </div>

      <div style={cardStyle}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <span style={{ ...sectionLabelStyle, marginBottom: 0 }}>Rateio dos valores</span>
          {linkedClient && (
            <button type="button" onClick={() => setRateioManual((m) => !m)} style={{ fontFamily: FONT_SANS, fontSize: 11.5, fontWeight: 700, color: C.brassDark, background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>
              {rateioManual ? "Usar cálculo automático" : "Ajustar manualmente"}
            </button>
          )}
        </div>
        {autoSplit ? (
          form.valorTotal ? <AutoRateioPreview split={autoSplit} /> : <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Informe o valor levantado para calcular o rateio.</span>
        ) : (
          <React.Fragment>
            <div style={gridTwo}>
              <Field label="Escritório"><MoneyInput value={form.valorEscritorio} onChange={(e) => set("valorEscritorio", e.target.value)} /></Field>
              <Field label="Cliente"><MoneyInput value={form.valorCliente} onChange={(e) => set("valorCliente", e.target.value)} /></Field>
              <Field label="Dr. Flávio"><MoneyInput value={form.valorFlavio} onChange={(e) => set("valorFlavio", e.target.value)} /></Field>
              <Field label="Bruno (honorários)"><MoneyInput value={form.valorBruno} onChange={(e) => set("valorBruno", e.target.value)} /></Field>
            </div>
            {form.valorTotal && (
              <div style={{ marginTop: 4, padding: "8px 12px", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8, backgroundColor: showDiffWarning ? C.redSoft : C.greenSoft, border: `1px solid ${showDiffWarning ? C.red : C.green}` }}>
                <Icon name={showDiffWarning ? "alert" : "check"} size={15} color={showDiffWarning ? C.red : C.green} />
                <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: showDiffWarning ? C.red : C.green }}>
                  {showDiffWarning ? `Rateio (${formatBRL(somaManual)}) não bate com o valor total. Diferença de ${formatBRL(Math.abs(diffManual))} ${diffManual > 0 ? "faltando distribuir" : "a mais no rateio"}.` : `Rateio confere com o valor total (${formatBRL(somaManual)}).`}
                </span>
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      <button type="button" onClick={() => setShowDetails((s) => !s)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 4px", marginBottom: 8, background: "none", border: "none", cursor: "pointer" }}>
        <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 700, color: C.inkSoft, textTransform: "uppercase", letterSpacing: "0.05em" }}>Mais detalhes</span>
        <Icon name={showDetails ? "chevronUp" : "chevronDown"} size={16} color={C.inkSoft} />
      </button>

      {showDetails && (
        <div style={cardStyle}>
          <Field label="Data do levantamento" required><TextInput type="date" value={form.dataLevantamento} onChange={(e) => set("dataLevantamento", e.target.value)} /></Field>
          <span style={sectionLabelStyle}>Observações</span>
          <textarea value={form.obs} onChange={(e) => set("obs", e.target.value)} placeholder="Opcional" rows={2} style={{ ...inputBase, resize: "vertical", fontFamily: FONT_SANS }} />
        </div>
      )}

      <button type="submit" disabled={saving} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: C.ink, color: "#fff", fontFamily: FONT_SANS, fontSize: 15, fontWeight: 700, padding: 14, borderRadius: 10, border: "none", cursor: saving ? "default" : "pointer", opacity: saving ? 0.7 : 1 }}>
        {saving ? <Spinner size={17} /> : <Icon name="check" size={17} />}
        {editingId ? "Salvar alterações" : "Registrar levantamento"}
      </button>
    </form>
  );
}

// ---------- Histórico Tab ----------
function HistoricoTab({ entries, pendentesCount, totalPendente, onEdit, onDelete, onGeneratePDF }) {
  const [expandedId, setExpandedId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  if (entries.length === 0) return <EmptyState title="Nenhum levantamento registrado" text="Toque em “Novo” para registrar o primeiro levantamento de RPV." />;
  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16, padding: "10px 14px", borderRadius: 8, backgroundColor: C.card, border: `1px solid ${C.ruleSoft}` }}>
        <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>{entries.length} registro(s) · {pendentesCount} pendente(s)</span>
        <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 700, color: C.brassDark }}>{formatBRL(totalPendente)}</span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {entries.map((en, i) => (
          <EntryCard key={en.id} entry={en} index={entries.length - i} expanded={expandedId === en.id} onToggle={() => setExpandedId(expandedId === en.id ? null : en.id)}
            onEdit={() => onEdit(en)} onGeneratePDF={() => onGeneratePDF(en)} confirmingDelete={confirmDeleteId === en.id}
            onAskDelete={() => setConfirmDeleteId(en.id)} onCancelDelete={() => setConfirmDeleteId(null)}
            onConfirmDelete={() => { onDelete(en.id); setConfirmDeleteId(null); }} />
        ))}
      </div>
    </div>
  );
}

function EntryCard({ entry, index, expanded, onToggle, onEdit, onGeneratePDF, confirmingDelete, onAskDelete, onCancelDelete, onConfirmDelete }) {
  return (
    <div style={{ backgroundColor: C.card, border: `1px solid ${C.ruleSoft}`, borderLeft: `4px solid ${C.brass}`, borderRadius: 10, overflow: "hidden" }}>
      <button onClick={onToggle} style={{ width: "100%", textAlign: "left", padding: "12px 14px", display: "flex", alignItems: "flex-start", gap: 12, background: "none", border: "none", cursor: "pointer" }}>
        <span style={{ fontFamily: FONT_SERIF, fontSize: 12, color: C.rule, fontWeight: 700, marginTop: 2 }}>{String(index).padStart(2, "0")}</span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontFamily: FONT_SERIF, fontSize: 15, fontWeight: 700, color: C.ink }}>{entry.cliente}</span>
            <BankBadge banco={entry.banco} />
            {entry.sucumbencial && <span style={{ fontFamily: FONT_SANS, fontSize: 10, fontWeight: 700, color: C.blue, backgroundColor: C.blueSoft, padding: "2px 6px", borderRadius: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>Sucumbência</span>}
          </div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.inkSoft, marginTop: 2 }}>Proc. {entry.processo}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
            <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>{formatDateBR(entry.dataLevantamento)}</span>
            <StatusStamp enviado={entry.enviado} />
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
          <span style={{ fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700, color: C.ink, fontVariantNumeric: "tabular-nums" }}>{formatBRL(entry.valorTotal)}</span>
          <Icon name={expanded ? "chevronUp" : "chevronDown"} size={16} color={C.inkSoft} />
        </div>
      </button>
      {expanded && (
        <div style={{ padding: "0 14px 14px", borderTop: `1px dashed ${C.ruleSoft}` }}>
          <div style={{ ...gridTwo, marginTop: 12 }}>
            <LedgerValue label="Escritório" value={entry.valorEscritorio} />
            <LedgerValue label="Cliente" value={entry.valorCliente} />
            <LedgerValue label="Dr. Flávio" value={entry.valorFlavio} />
            <LedgerValue label="Bruno" value={entry.valorBruno} />
          </div>
          <div style={{ marginTop: 10, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Responsável pelo levantamento: <strong style={{ color: C.ink }}>{entry.responsavel}</strong></div>
          {entry.obs && <div style={{ marginTop: 4, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft, fontStyle: "italic" }}>“{entry.obs}”</div>}
          {entry.foto && (
            <div style={{ marginTop: 12 }}>
              <img src={entry.foto} alt="Comprovante" style={{ maxWidth: 160, borderRadius: 8, border: `1px solid ${C.rule}`, transform: "rotate(-1deg)", boxShadow: "0 2px 6px rgba(31,44,61,0.15)" }} />
            </div>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
            <button onClick={onGeneratePDF} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.brass}`, backgroundColor: C.brassSoft, color: C.brassDark, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}><Icon name="printer" size={13} /> PDF</button>
            <button onClick={onEdit} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.rule}`, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><Icon name="pencil" size={13} /> Editar</button>
            {!confirmingDelete ? (
              <button onClick={onAskDelete} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.redSoft}`, backgroundColor: "#fff", color: C.red, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><Icon name="trash" size={13} /> Excluir</button>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: C.red }}>Confirmar exclusão?</span>
                <button onClick={onConfirmDelete} style={{ background: C.red, color: "#fff", border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Sim</button>
                <button onClick={onCancelDelete} style={{ background: "none", color: C.inkSoft, border: `1px solid ${C.rule}`, borderRadius: 6, padding: "5px 10px", fontSize: 12, cursor: "pointer" }}>Não</button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function LedgerValue({ label, value }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px dotted ${C.ruleSoft}`, paddingBottom: 3 }}>
      <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>{label}</span>
      <span style={{ fontFamily: FONT_MONO, fontSize: 12.5, color: C.ink, fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>{formatBRL(value)}</span>
    </div>
  );
}

// ---------- Relatório Tab ----------
function RelatorioTab({ entries, onMarkSent, showToast, onGeneratePDF }) {
  const [dataInicio, setDataInicio] = useState("");
  const [dataFim, setDataFim] = useState("");
  const [apenasPendentes, setApenasPendentes] = useState(true);
  const [selecionados, setSelecionados] = useState(() => new Set());
  const [showPreview, setShowPreview] = useState(false);

  const filtrados = useMemo(() => {
    return entries.filter((en) => (apenasPendentes ? !en.enviado : true))
      .filter((en) => (dataInicio ? en.dataLevantamento >= dataInicio : true))
      .filter((en) => (dataFim ? en.dataLevantamento <= dataFim : true))
      .sort((a, b) => (a.dataLevantamento || "").localeCompare(b.dataLevantamento || ""));
  }, [entries, apenasPendentes, dataInicio, dataFim]);

  useEffect(() => { setSelecionados(new Set(filtrados.map((en) => en.id))); }, [dataInicio, dataFim, apenasPendentes, entries.length]);

  const lista = filtrados.filter((en) => selecionados.has(en.id));
  const totals = lista.reduce((acc, en) => {
    acc.total += en.valorTotal || 0; acc.escritorio += en.valorEscritorio || 0; acc.cliente += en.valorCliente || 0;
    acc.flavio += en.valorFlavio || 0; acc.bruno += en.valorBruno || 0; return acc;
  }, { total: 0, escritorio: 0, cliente: 0, flavio: 0, bruno: 0 });

  const periodoLabel = dataInicio || dataFim ? `${dataInicio ? formatDateBR(dataInicio) : "início"} a ${dataFim ? formatDateBR(dataFim) : "hoje"}` : "todos os registros";

  function reportText() {
    const linhas = lista.map((en, i) => (
      `${i + 1}. ${en.cliente} — Proc. ${en.processo}${en.sucumbencial ? " (honorários sucumbenciais)" : ""}\n` +
      `   Banco: ${BANCOS[en.banco] ? BANCOS[en.banco].short : en.banco} | Data: ${formatDateBR(en.dataLevantamento)} | Responsável: ${en.responsavel}\n` +
      `   Valor total: ${formatBRL(en.valorTotal)}\n` +
      `   Escritório: ${formatBRL(en.valorEscritorio)} | Cliente: ${formatBRL(en.valorCliente)} | Dr. Flávio: ${formatBRL(en.valorFlavio)} | Bruno (honorários): ${formatBRL(en.valorBruno)}` +
      (en.obs ? `\n   Obs: ${en.obs}` : "")
    )).join("\n\n");
    return (
      `RELATÓRIO DE LEVANTAMENTO DE RPV — REZENDE MAIA ADVOCACIA\n` +
      `Gerado em ${formatDateBR(todayISO())} · Período: ${periodoLabel}\n` +
      `${lista.length} levantamento(s)\n\n${linhas || "(nenhum registro selecionado)"}\n\n————————————————————\nTOTAIS\n` +
      `Valor total levantado: ${formatBRL(totals.total)}\nEscritório: ${formatBRL(totals.escritorio)}\nCliente: ${formatBRL(totals.cliente)}\n` +
      `Dr. Flávio: ${formatBRL(totals.flavio)}\nBruno (honorários): ${formatBRL(totals.bruno)}`
    );
  }

  async function copyReport() {
    const text = reportText();
    try { await navigator.clipboard.writeText(text); showToast("Relatório copiado. Cole no WhatsApp ou e-mail para o financeiro e Dr. Flávio."); }
    catch (e) { showToast("Não copiou automaticamente — selecione o texto do relatório manualmente.", "error"); setShowPreview(true); }
  }
  function toggleSelect(id) { setSelecionados((prev) => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; }); }

  return (
    <div>
      <div style={cardStyle}>
        <span style={sectionLabelStyle}>Filtros</span>
        <div style={gridTwo}>
          <Field label="De"><TextInput type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} /></Field>
          <Field label="Até"><TextInput type="date" value={dataFim} onChange={(e) => setDataFim(e.target.value)} /></Field>
        </div>
        <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
          <input type="checkbox" checked={apenasPendentes} onChange={(e) => setApenasPendentes(e.target.checked)} style={{ width: 16, height: 16, accentColor: C.brass }} />
          <span style={{ fontFamily: FONT_SANS, fontSize: 13, color: C.ink }}>Somente pendentes de envio</span>
        </label>
      </div>

      {filtrados.length === 0 ? (
        <EmptyState title="Nada por aqui" text="Nenhum levantamento encontrado para os filtros selecionados." />
      ) : (
        <React.Fragment>
          <div style={cardStyle}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ ...sectionLabelStyle, marginBottom: 0 }}>Registros incluídos</span>
              <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: C.inkSoft }}>{selecionados.size}/{filtrados.length}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {filtrados.map((en) => (
                <label key={en.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", borderRadius: 8, cursor: "pointer", backgroundColor: selecionados.has(en.id) ? C.brassSoft : C.parchmentDark }}>
                  <input type="checkbox" checked={selecionados.has(en.id)} onChange={() => toggleSelect(en.id)} style={{ width: 15, height: 15, accentColor: C.brass, flexShrink: 0 }} />
                  <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.ink, flex: 1, minWidth: 0 }}>{en.cliente} <span style={{ color: C.inkSoft }}>· {formatDateBR(en.dataLevantamento)}</span></span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 12.5, fontWeight: 700, color: C.ink }}>{formatBRL(en.valorTotal)}</span>
                </label>
              ))}
            </div>
          </div>

          <div style={{ ...cardStyle, backgroundColor: C.ink }}>
            <span style={{ fontFamily: FONT_SERIF, fontSize: 12, fontWeight: 700, color: C.brassSoft, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10, display: "block" }}>Totais do relatório</span>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <TotalRow label="Valor total levantado" value={totals.total} strong />
              <TotalRow label="Escritório" value={totals.escritorio} />
              <TotalRow label="Cliente" value={totals.cliente} />
              <TotalRow label="Dr. Flávio" value={totals.flavio} />
              <TotalRow label="Bruno (honorários)" value={totals.bruno} />
            </div>
          </div>

          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <button onClick={copyReport} disabled={lista.length === 0} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: C.ink, color: "#fff", fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, padding: 13, borderRadius: 10, border: "none", cursor: lista.length === 0 ? "default" : "pointer", opacity: lista.length === 0 ? 0.5 : 1 }}>
              <Icon name="copy" size={15} /> Copiar texto
            </button>
            <button onClick={() => onGeneratePDF(lista, totals, periodoLabel)} disabled={lista.length === 0} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, padding: 13, borderRadius: 10, border: `1.5px solid ${C.rule}`, cursor: lista.length === 0 ? "default" : "pointer", opacity: lista.length === 0 ? 0.5 : 1 }}>
              <Icon name="printer" size={15} /> Baixar PDF
            </button>
          </div>

          <button onClick={() => setShowPreview((s) => !s)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 4, marginBottom: 12, fontFamily: FONT_SANS, fontSize: 12, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>
            {showPreview ? "Ocultar" : "Ver"} texto do relatório <Icon name={showPreview ? "chevronUp" : "chevronDown"} size={14} />
          </button>

          {lista.length > 0 && !lista.every((en) => en.enviado) && (
            <button onClick={() => onMarkSent(lista.map((en) => en.id))} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 16, backgroundColor: C.greenSoft, border: `1.5px solid ${C.green}`, color: C.green, fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, padding: 12, borderRadius: 10, cursor: "pointer" }}>
              <Icon name="check" size={15} /> Marcar selecionados como enviados
            </button>
          )}

          {showPreview && (
            <div style={{ backgroundColor: "#fff", border: `1px solid ${C.ruleSoft}`, borderRadius: 10, padding: 14, marginBottom: 20 }}>
              <pre style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink, whiteSpace: "pre-wrap", wordBreak: "break-word", margin: 0, lineHeight: 1.5 }}>{reportText()}</pre>
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}
function TotalRow({ label, value, strong }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <span style={{ fontFamily: FONT_SANS, fontSize: strong ? 13.5 : 12.5, color: strong ? "#fff" : "#B7C2CE" }}>{label}</span>
      <span style={{ fontFamily: FONT_MONO, fontSize: strong ? 16 : 13, fontWeight: 700, color: strong ? C.brassSoft : "#E4E9EE", fontVariantNumeric: "tabular-nums" }}>{formatBRL(value)}</span>
    </div>
  );
}

// ---------- Print / PDF sheet ----------
const printInk = "#1F2C3D", printBrass = "#7C611F", printRule = "#C9BCA0";
function PrintSheet({ data }) { return data.type === "single" ? <SinglePrintSheet {...data} /> : <BatchPrintSheet {...data} />; }
function PrintHeader({ subtitle }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, borderBottom: `2px solid ${printInk}`, paddingBottom: 12, marginBottom: 18 }}>
      <LogoMark size={44} />
      <div>
        <div style={{ fontFamily: FONT_SANS, fontSize: 11, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: printBrass }}>Rezende Maia Advocacia</div>
        <div style={{ fontFamily: FONT_SERIF, fontSize: 19, fontWeight: 700, color: printInk }}>{subtitle}</div>
      </div>
    </div>
  );
}
function PrintRow({ label, value, mono }) {
  return (
    <tr>
      <td style={{ padding: "5px 10px 5px 0", fontFamily: FONT_SANS, fontSize: 11.5, color: "#5A6B7D", whiteSpace: "nowrap", verticalAlign: "top" }}>{label}</td>
      <td style={{ padding: "5px 0", fontFamily: mono ? FONT_MONO : FONT_SANS, fontSize: 12.5, color: printInk, fontWeight: 600 }}>{value}</td>
    </tr>
  );
}
function SinglePrintSheet({ entry, cliente, photo }) {
  return (
    <div className="print-sheet" style={{ fontFamily: FONT_SANS, color: printInk, padding: 8 }}>
      <PrintHeader subtitle="Comprovante de Levantamento de RPV" />
      <table style={{ borderCollapse: "collapse", width: "100%", marginBottom: 16 }}><tbody>
        <PrintRow label="Cliente" value={entry.cliente} />
        {cliente && cliente.cpf && <PrintRow label="CPF" value={cliente.cpf} mono />}
        {cliente && cliente.numeroBeneficio && <PrintRow label="Nº do benefício" value={cliente.numeroBeneficio} mono />}
        <PrintRow label="Nº do processo" value={entry.processo} mono />
        <PrintRow label="Dono do cliente" value={entry.donoCliente === "Flávio" ? "Dr. Flávio" : "Bruno"} />
      </tbody></table>
      <table style={{ borderCollapse: "collapse", width: "100%", marginBottom: 16 }}><tbody>
        <PrintRow label="Banco" value={BANCOS[entry.banco] ? BANCOS[entry.banco].label : entry.banco} />
        <PrintRow label="Data do levantamento" value={formatDateBR(entry.dataLevantamento)} />
        <PrintRow label="Responsável" value={entry.responsavel} />
        <PrintRow label="Valor total levantado" value={formatBRL(entry.valorTotal)} mono />
        {entry.sucumbencial && <PrintRow label="Natureza" value="Honorários sucumbenciais (100% do dono do cliente)" />}
      </tbody></table>
      <div style={{ fontFamily: FONT_SERIF, fontSize: 12.5, fontWeight: 700, color: printBrass, textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 8 }}>Rateio</div>
      <table style={{ borderCollapse: "collapse", width: "100%", marginBottom: 18, border: `1px solid ${printRule}` }}>
        <thead><tr style={{ backgroundColor: "#F1E6C8" }}>
          <th style={{ textAlign: "left", padding: "6px 10px", fontFamily: FONT_SANS, fontSize: 11, color: printBrass, fontWeight: 700 }}>Destinatário</th>
          <th style={{ textAlign: "right", padding: "6px 10px", fontFamily: FONT_SANS, fontSize: 11, color: printBrass, fontWeight: 700 }}>Valor</th>
        </tr></thead>
        <tbody>
          {[["Escritório", entry.valorEscritorio], ["Cliente", entry.valorCliente], ["Dr. Flávio", entry.valorFlavio], ["Bruno (honorários)", entry.valorBruno]].map(([label, value]) => (
            <tr key={label} style={{ borderTop: `1px solid ${printRule}` }}>
              <td style={{ padding: "6px 10px", fontFamily: FONT_SANS, fontSize: 12 }}>{label}</td>
              <td style={{ padding: "6px 10px", fontFamily: FONT_MONO, fontSize: 12, textAlign: "right", fontWeight: 600 }}>{formatBRL(value)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      {entry.obs && (<div style={{ marginBottom: 16 }}><div style={{ fontFamily: FONT_SANS, fontSize: 11, fontWeight: 700, color: "#5A6B7D", textTransform: "uppercase" }}>Observações</div><div style={{ fontFamily: FONT_SANS, fontSize: 12.5, marginTop: 3 }}>{entry.obs}</div></div>)}
      {photo && (<div style={{ marginBottom: 16 }}><div style={{ fontFamily: FONT_SANS, fontSize: 11, fontWeight: 700, color: "#5A6B7D", textTransform: "uppercase", marginBottom: 6 }}>Comprovante emitido pelo banco</div><img src={photo} alt="Comprovante" style={{ maxWidth: "70%", border: `1px solid ${printRule}`, borderRadius: 4 }} /></div>)}
      <div style={{ borderTop: `1px solid ${printRule}`, paddingTop: 8, marginTop: 12, fontFamily: FONT_SANS, fontSize: 10, color: "#8A93A0" }}>Documento interno gerado pelo Controle de RPV — Rezende Maia Advocacia em {nowLabel()}.</div>
    </div>
  );
}
function BatchPrintSheet({ list, totals, periodoLabel }) {
  return (
    <div className="print-sheet" style={{ fontFamily: FONT_SANS, color: printInk, padding: 8 }}>
      <PrintHeader subtitle="Relatório de Levantamento de RPV" />
      <div style={{ fontFamily: FONT_SANS, fontSize: 12, color: "#5A6B7D", marginBottom: 14 }}>Gerado em {formatDateBR(todayISO())} · Período: {periodoLabel} · {list.length} levantamento(s)</div>
      <table style={{ borderCollapse: "collapse", width: "100%", border: `1px solid ${printRule}`, marginBottom: 18 }}>
        <thead><tr style={{ backgroundColor: "#F1E6C8" }}>
          {["Cliente", "Processo", "Banco", "Data", "Responsável", "Total", "Escritório", "Cliente", "Dr. Flávio", "Bruno"].map((h) => (
            <th key={h} style={{ textAlign: "left", padding: "6px 8px", fontFamily: FONT_SANS, fontSize: 10, color: printBrass, fontWeight: 700, whiteSpace: "nowrap" }}>{h}</th>
          ))}
        </tr></thead>
        <tbody>
          {list.map((en) => (
            <tr key={en.id} style={{ borderTop: `1px solid ${printRule}` }}>
              <td style={{ padding: "6px 8px", fontFamily: FONT_SANS, fontSize: 10.5 }}>{en.cliente}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_MONO, fontSize: 9.5 }}>{en.processo}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_SANS, fontSize: 10.5 }}>{BANCOS[en.banco] ? BANCOS[en.banco].short : en.banco}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_SANS, fontSize: 10.5, whiteSpace: "nowrap" }}>{formatDateBR(en.dataLevantamento)}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_SANS, fontSize: 10.5 }}>{en.responsavel}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_MONO, fontSize: 10.5, textAlign: "right" }}>{formatBRL(en.valorTotal)}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_MONO, fontSize: 10.5, textAlign: "right" }}>{formatBRL(en.valorEscritorio)}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_MONO, fontSize: 10.5, textAlign: "right" }}>{formatBRL(en.valorCliente)}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_MONO, fontSize: 10.5, textAlign: "right" }}>{formatBRL(en.valorFlavio)}</td>
              <td style={{ padding: "6px 8px", fontFamily: FONT_MONO, fontSize: 10.5, textAlign: "right" }}>{formatBRL(en.valorBruno)}</td>
            </tr>
          ))}
        </tbody>
      </table>
      <table style={{ borderCollapse: "collapse", width: "60%", marginLeft: "auto" }}><tbody>
        <PrintRow label="Valor total levantado" value={formatBRL(totals.total)} mono />
        <PrintRow label="Escritório" value={formatBRL(totals.escritorio)} mono />
        <PrintRow label="Cliente" value={formatBRL(totals.cliente)} mono />
        <PrintRow label="Dr. Flávio" value={formatBRL(totals.flavio)} mono />
        <PrintRow label="Bruno (honorários)" value={formatBRL(totals.bruno)} mono />
      </tbody></table>
      <div style={{ borderTop: `1px solid ${printRule}`, paddingTop: 8, marginTop: 20, fontFamily: FONT_SANS, fontSize: 10, color: "#8A93A0" }}>Documento interno gerado pelo Controle de RPV — Rezende Maia Advocacia em {nowLabel()}.</div>
    </div>
  );
}

// ---------- Main App ----------
function RPVLedgerApp() {
  const [user, setUser] = useState(undefined); // undefined = checking, null = logged out
  const [entries, setEntries] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [dataLoading, setDataLoading] = useState(true);
  const [tab, setTab] = useState("clientes");
  const [toast, setToast] = useState(null);

  const [form, setForm] = useState(EMPTY_FORM);
  const [editingId, setEditingId] = useState(null);
  const [rateioManual, setRateioManual] = useState(false);
  const [photoDataUrl, setPhotoDataUrl] = useState(null);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const fileInputRef = useRef(null);
  const valorInputRef = useRef(null);

  const [clientForm, setClientForm] = useState(EMPTY_CLIENT_FORM);
  const [editingClienteId, setEditingClienteId] = useState(null);
  const [savingCliente, setSavingCliente] = useState(false);

  const [printData, setPrintData] = useState(null);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged((u) => setUser(u || null));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!user) return;
    setDataLoading(true);
    const unsubEntries = db.collection("levantamentos").orderBy("dataLevantamento", "desc").onSnapshot(
      (snap) => { setEntries(snap.docs.map((d) => d.data())); setDataLoading(false); },
      () => setDataLoading(false)
    );
    const unsubClientes = db.collection("clientes").orderBy("dataCadastro", "desc").onSnapshot(
      (snap) => setClientes(snap.docs.map((d) => d.data())),
      () => {}
    );
    return () => { unsubEntries(); unsubClientes(); };
  }, [user]);

  useEffect(() => {
    if (!printData) return;
    const t = setTimeout(() => window.print(), 250);
    return () => clearTimeout(t);
  }, [printData]);

  useEffect(() => {
    function onAfterPrint() { setPrintData(null); }
    window.addEventListener("afterprint", onAfterPrint);
    return () => window.removeEventListener("afterprint", onAfterPrint);
  }, []);

  function showToast(msg, type) {
    setToast({ msg, type: type || "success" });
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 3200);
  }

  const responsaveisConhecidos = useMemo(() => Array.from(new Set(entries.map((e) => e.responsavel).filter(Boolean))), [entries]);

  function resetForm() { setForm(EMPTY_FORM); setPhotoDataUrl(null); setEditingId(null); setRateioManual(false); setLastSaved(null); }
  function nextEntry() { setForm((f) => ({ ...EMPTY_FORM, banco: f.banco, responsavel: f.responsavel })); setPhotoDataUrl(null); setEditingId(null); setRateioManual(false); setLastSaved(null); }

  async function startEdit(entry) {
    setEditingId(entry.id); setLastSaved(null); setRateioManual(true);
    setForm({
      clienteId: entry.clienteId || "", cliente: entry.cliente, processo: entry.processo, banco: entry.banco,
      dataLevantamento: entry.dataLevantamento, responsavel: entry.responsavel,
      valorTotal: entry.valorTotal ? String(entry.valorTotal) : "",
      valorEscritorio: entry.valorEscritorio ? String(entry.valorEscritorio) : "",
      valorCliente: entry.valorCliente ? String(entry.valorCliente) : "",
      valorFlavio: entry.valorFlavio ? String(entry.valorFlavio) : "",
      valorBruno: entry.valorBruno ? String(entry.valorBruno) : "",
      sucumbencial: !!entry.sucumbencial, obs: entry.obs || "",
    });
    setPhotoDataUrl(entry.foto || null);
    setTab("novo");
  }

  async function handlePhotoFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setPhotoBusy(true);
    try { setPhotoDataUrl(await compressImage(file)); }
    catch (err) { showToast("Não foi possível processar a foto.", "error"); }
    setPhotoBusy(false);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    if (!form.cliente.trim() || !form.processo.trim() || !form.dataLevantamento || !form.responsavel.trim() || !form.valorTotal) {
      showToast("Preencha os campos obrigatórios.", "error"); return;
    }
    setSaving(true);
    const id = editingId || newId("rpv");
    const baseEntry = editingId ? entries.find((en) => en.id === editingId) : null;
    const linkedClient = clientes.find((c) => c.id === form.clienteId) || null;

    let valores;
    if (linkedClient && !rateioManual) {
      const split = computeSplit({ valorTotal: parseNum(form.valorTotal), percentualExito: linkedClient.percentualExito, dono: linkedClient.dono, sucumbencial: form.sucumbencial });
      valores = { valorEscritorio: split.escritorio, valorCliente: split.cliente, valorFlavio: split.flavio, valorBruno: split.bruno };
    } else {
      valores = { valorEscritorio: parseNum(form.valorEscritorio), valorCliente: parseNum(form.valorCliente), valorFlavio: parseNum(form.valorFlavio), valorBruno: parseNum(form.valorBruno) };
    }

    const entry = {
      id, clienteId: form.clienteId || null, cliente: form.cliente.trim(), processo: form.processo.trim(),
      banco: form.banco, dataLevantamento: form.dataLevantamento, responsavel: form.responsavel.trim(),
      valorTotal: parseNum(form.valorTotal), ...valores, sucumbencial: !!form.sucumbencial,
      donoCliente: linkedClient ? linkedClient.dono : baseEntry ? baseEntry.donoCliente : null,
      obs: form.obs.trim(), foto: photoDataUrl || null, temFoto: !!photoDataUrl,
      enviado: baseEntry ? !!baseEntry.enviado : false, enviadoEm: baseEntry ? baseEntry.enviadoEm : null,
      criadoEm: baseEntry ? baseEntry.criadoEm : Date.now(), editadoEm: Date.now(),
      registradoPor: user.email,
    };

    try {
      await db.collection("levantamentos").doc(id).set(entry);
    } catch (err) {
      showToast("Erro ao salvar: " + err.message, "error");
      setSaving(false);
      return;
    }

    setSaving(false);
    if (editingId) { showToast("Levantamento atualizado."); resetForm(); setTab("historico"); }
    else { showToast("Levantamento registrado. Gerando PDF..."); setLastSaved(entry); setPrintData({ type: "single", entry, cliente: linkedClient, photo: photoDataUrl }); }
  }

  async function handleDelete(id) {
    try { await db.collection("levantamentos").doc(id).delete(); showToast("Registro excluído."); if (editingId === id) resetForm(); }
    catch (err) { showToast("Erro ao excluir: " + err.message, "error"); }
  }

  async function markAsSent(ids) {
    try {
      const batch = db.batch();
      const stamp = Date.now();
      ids.forEach((id) => batch.update(db.collection("levantamentos").doc(id), { enviado: true, enviadoEm: stamp }));
      await batch.commit();
      showToast(`${ids.length} registro(s) marcado(s) como enviado(s).`);
    } catch (err) { showToast("Erro ao marcar como enviado: " + err.message, "error"); }
  }

  function generateSinglePDF(entry, preloadedPhoto) {
    const cliente = clientes.find((c) => c.id === entry.clienteId) || null;
    const photo = preloadedPhoto !== undefined ? preloadedPhoto : entry.foto || null;
    setPrintData({ type: "single", entry, cliente, photo });
  }
  function generateBatchPDF(list, totals, periodoLabel) { setPrintData({ type: "batch", list, totals, periodoLabel }); }

  function resetClientForm() { setClientForm(EMPTY_CLIENT_FORM); setEditingClienteId(null); }
  function startEditCliente(cliente) {
    setEditingClienteId(cliente.id);
    setClientForm({
      dataCadastro: cliente.dataCadastro || todayISO(), nome: cliente.nome, cpf: cliente.cpf || "",
      numeroBeneficio: cliente.numeroBeneficio || "", processo: cliente.processo || "",
      valorEstimado: cliente.valorEstimado ? String(cliente.valorEstimado) : "", dono: cliente.dono,
      percentualExito: cliente.percentualExito ? String(cliente.percentualExito) : "30",
      valorAdministrativo: cliente.valorAdministrativo ? String(cliente.valorAdministrativo) : "",
      temSucumbencia: !!cliente.temSucumbencia, valorSucumbencial: cliente.valorSucumbencial ? String(cliente.valorSucumbencial) : "", obs: cliente.obs || "",
    });
  }

  async function handleSubmitCliente(e) {
    e.preventDefault();
    if (!clientForm.nome.trim() || !clientForm.dono || !clientForm.percentualExito) {
      showToast("Preencha nome, dono do cliente e percentual do êxito.", "error"); return;
    }
    setSavingCliente(true);
    const id = editingClienteId || newId("cli");
    const base = editingClienteId ? clientes.find((c) => c.id === editingClienteId) : null;
    const cliente = {
      id, dataCadastro: clientForm.dataCadastro || todayISO(), nome: clientForm.nome.trim(), cpf: clientForm.cpf.trim(),
      numeroBeneficio: clientForm.numeroBeneficio.trim(), processo: clientForm.processo.trim(),
      valorEstimado: parseNum(clientForm.valorEstimado), dono: clientForm.dono, percentualExito: parseNum(clientForm.percentualExito),
      valorAdministrativo: parseNum(clientForm.valorAdministrativo), temSucumbencia: !!clientForm.temSucumbencia,
      valorSucumbencial: parseNum(clientForm.valorSucumbencial), obs: clientForm.obs.trim(),
      criadoEm: base ? base.criadoEm : Date.now(), editadoEm: Date.now(),
    };
    try {
      await db.collection("clientes").doc(id).set(cliente);
      showToast(editingClienteId ? "Cadastro atualizado." : "Cliente cadastrado.");
      resetClientForm();
    } catch (err) { showToast("Erro ao salvar cliente: " + err.message, "error"); }
    setSavingCliente(false);
  }

  async function handleDeleteCliente(id) {
    try { await db.collection("clientes").doc(id).delete(); showToast("Cadastro excluído."); if (editingClienteId === id) resetClientForm(); }
    catch (err) { showToast("Erro ao excluir: " + err.message, "error"); }
  }

  if (user === undefined) {
    return <div style={{ minHeight: "100vh", backgroundColor: C.ink, display: "flex", alignItems: "center", justifyContent: "center" }}><Spinner size={26} /></div>;
  }
  if (user === null) return <LoginScreen />;

  const pendentes = entries.filter((en) => !en.enviado);
  const totalPendente = pendentes.reduce((s, en) => s + (en.valorTotal || 0), 0);

  return (
    <div style={{ minHeight: "100vh", width: "100%", backgroundColor: C.parchment, fontFamily: FONT_SANS }}>
      <header className="no-print" style={{ padding: "28px 20px 20px", backgroundColor: C.ink, borderBottom: `3px double ${C.brass}` }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <LogoMark size={38} />
            <div>
              <span style={{ fontFamily: FONT_SANS, fontSize: 11, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: C.brassSoft }}>Rezende Maia Advocacia</span>
              <h1 style={{ fontFamily: FONT_SERIF, fontSize: 22, fontWeight: 700, color: "#fff", letterSpacing: "0.01em", marginTop: 1 }}>Controle de RPV</h1>
            </div>
          </div>
          <button onClick={() => auth.signOut()} title="Sair" style={{ background: "none", border: "none", color: "#B7C2CE", cursor: "pointer", padding: 6 }}><Icon name="logout" size={18} /></button>
        </div>
        <p style={{ fontFamily: FONT_SANS, fontSize: 12, color: "#B7C2CE", marginTop: 8 }}>{user.email} · dados sincronizados entre seus aparelhos</p>
      </header>

      <main style={{ padding: "20px 16px 112px", maxWidth: 520, margin: "0 auto" }}>
        {dataLoading ? (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: "96px 0", color: C.inkSoft }}>
            <Spinner size={20} color={C.inkSoft} /><span style={{ marginLeft: 8, fontFamily: FONT_SANS, fontSize: 14 }}>Carregando registros...</span>
          </div>
        ) : tab === "clientes" ? (
          <ClientesTab clientes={clientes} clientForm={clientForm} setClientForm={setClientForm} onSubmit={handleSubmitCliente}
            editingClienteId={editingClienteId} onCancelEdit={resetClientForm} onEdit={startEditCliente} onDelete={handleDeleteCliente} saving={savingCliente} />
        ) : tab === "novo" ? (
          <FormTab form={form} setForm={setForm} onSubmit={handleSubmit} editingId={editingId} onCancelEdit={resetForm}
            photoDataUrl={photoDataUrl} setPhotoDataUrl={setPhotoDataUrl} photoBusy={photoBusy} fileInputRef={fileInputRef} valorInputRef={valorInputRef}
            onPhotoFile={handlePhotoFile} responsaveisConhecidos={responsaveisConhecidos} clientes={clientes} saving={saving} showToast={showToast}
            rateioManual={rateioManual} setRateioManual={setRateioManual} lastSaved={lastSaved} onNextEntry={nextEntry}
            onGeneratePDF={(entry) => generateSinglePDF(entry, photoDataUrl)} />
        ) : tab === "historico" ? (
          <HistoricoTab entries={entries} pendentesCount={pendentes.length} totalPendente={totalPendente} onEdit={startEdit} onDelete={handleDelete} onGeneratePDF={(entry) => generateSinglePDF(entry)} />
        ) : (
          <RelatorioTab entries={entries} onMarkSent={markAsSent} showToast={showToast} onGeneratePDF={generateBatchPDF} />
        )}
      </main>

      <Toast toast={toast} />

      <nav className="no-print" style={{ position: "fixed", bottom: 0, left: 0, right: 0, display: "flex", backgroundColor: "#fff", borderTop: `1.5px solid ${C.rule}`, boxShadow: "0 -4px 14px rgba(31,44,61,0.06)" }}>
        <NavButton active={tab === "clientes"} icon={<Icon name="users" size={18} />} label="Clientes" onClick={() => { if (tab !== "clientes") resetClientForm(); setTab("clientes"); }} />
        <NavButton active={tab === "novo"} icon={<Icon name="plus" size={19} />} label="Novo" onClick={() => { if (tab !== "novo") resetForm(); setTab("novo"); }} />
        <NavButton active={tab === "historico"} icon={<Icon name="clipboard" size={19} />} label="Histórico" badge={pendentes.length > 0 ? pendentes.length : null} onClick={() => setTab("historico")} />
        <NavButton active={tab === "relatorio"} icon={<Icon name="send" size={18} />} label="Relatório" onClick={() => setTab("relatorio")} />
      </nav>

      {printData && <PrintSheet data={printData} />}
    </div>
  );
}

function NavButton({ active, icon, label, onClick, badge }) {
  return (
    <button onClick={onClick} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, position: "relative", padding: "10px 0 12px", background: "none", border: "none", cursor: "pointer" }}>
      <span style={{ color: active ? C.brass : "#A6AFB9" }}>{icon}</span>
      <span style={{ fontFamily: FONT_SANS, fontSize: 10.5, fontWeight: active ? 700 : 500, color: active ? C.ink : "#A6AFB9", letterSpacing: "0.02em" }}>{label}</span>
      {badge && (
        <span style={{ position: "absolute", top: 4, right: "calc(50% - 26px)", minWidth: 16, height: 16, borderRadius: 999, backgroundColor: C.red, color: "#fff", fontSize: 9.5, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 3px" }}>{badge}</span>
      )}
    </button>
  );
}

// ---------- Boot ----------
const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(FIREBASE_READY ? <RPVLedgerApp /> : <SetupScreen />);
