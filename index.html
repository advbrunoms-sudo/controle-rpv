// ---------- Clientes Tab ----------
function ClientesTab({ clientes, entries, clientForm, setClientForm, onSubmit, editingClienteId, onCancelEdit, onEdit, onDelete, saving, showToast }) {
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [leitura, setLeitura] = useState(null); // { busy, erro, found, texto, vazio }
  const [verTexto, setVerTexto] = useState(false);
  const pdfInputRef = useRef(null);
  function set(field, value) { setClientForm((f) => ({ ...f, [field]: value })); }

  async function onPdfRequisicao(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setVerTexto(false);
    setLeitura({ busy: true });
    try {
      const texto = await readPdfText(file);
      if (texto.replace(/\s/g, "").length < 40) {
        setLeitura({ erro: "Este PDF não tem texto selecionável (parece ser uma imagem digitalizada). Preencha os dados manualmente.", texto });
        return;
      }
      const { fields, found } = extractRequisicao(texto);
      if (found.length === 0) {
        setLeitura({ erro: "Li o PDF, mas não reconheci os campos. Preencha manualmente.", texto });
        return;
      }
      setClientForm((f) => {
        const n = { ...f };
        if (fields.nome) n.nome = fields.nome.toLocaleUpperCase("pt-BR");
        if (fields.cpf) n.cpf = fields.cpf;
        if (fields.processo) n.processo = fields.processo;
        if (fields.tipoRequisicao) n.tipoRequisicao = fields.tipoRequisicao;
        if (fields.numeroRequisicao) n.numeroRequisicao = fields.numeroRequisicao;
        if (fields.temDestaque) {
          n.temDestaque = true; n.valorDestaque = String(fields.valorDestaque);
          if (fields.valorLiquido != null) n.valorLiquido = String(fields.valorLiquido);
        } else {
          const v = fields.valorTotalPdf != null ? fields.valorTotalPdf : fields.valorLiquido;
          if (v != null) n.valorEstimado = String(v);
        }
        if (fields.temSucumbencia) { n.temSucumbencia = true; n.valorSucumbencial = String(fields.valorSucumbencial); }
        return n;
      });
      setLeitura({ found, texto, banco: fields.bancoDepositario || null,
        aviso: fields.temDestaque && fields.valorLiquidoDoTotal ? "O PDF só trouxe um valor total. Coloquei esse valor como \"valor do cliente\": se ele já inclui o destaque, subtraia o destaque antes de salvar (o app soma cliente + destaque)." : null,
        faltou: ["nome", "cpf", "processo", "numeroRequisicao"].filter((k) => !fields[k]).map((k) => ({ nome: "nome do cliente", cpf: "CPF", processo: "nº do processo", numeroRequisicao: "nº do ofício/requisição" }[k])) });
    } catch (err) {
      setLeitura({ erro: "Não consegui ler o PDF: " + err.message + ". Preencha manualmente." });
    }
  }

  return (
    <div>
      <form onSubmit={onSubmit}>
        {editingClienteId && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, padding: "8px 12px", borderRadius: 8, backgroundColor: C.brassSoft, border: `1px solid ${C.brass}` }}>
            <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.brassDark, fontWeight: 600 }}>Editando cadastro existente</span>
            <button type="button" onClick={onCancelEdit} style={{ background: "none", border: "none", color: C.brassDark, cursor: "pointer" }}><Icon name="x" size={16} /></button>
          </div>
        )}

        <div style={cardStyle}>
          <span style={sectionLabelStyle}>RPV / Precatório</span>
          <input type="file" accept="application/pdf" ref={pdfInputRef} onChange={onPdfRequisicao} style={{ display: "none" }} />
          <button type="button" onClick={() => pdfInputRef.current && pdfInputRef.current.click()} disabled={leitura && leitura.busy} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: 14, borderRadius: 10, border: `2px dashed ${C.brass}`, backgroundColor: C.brassSoft, color: C.brassDark, fontFamily: FONT_SANS, fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 10 }}>
            {leitura && leitura.busy ? <Spinner size={16} color={C.brassDark} /> : <Icon name="clipboard" size={17} />}
            {leitura && leitura.busy ? "Lendo o PDF..." : "Ler o PDF do RPV / Precatório"}
          </button>
          {leitura && !leitura.busy && (
            <div style={{ marginBottom: 12, padding: "10px 12px", borderRadius: 8, backgroundColor: leitura.erro ? C.redSoft : C.greenSoft, border: `1px solid ${leitura.erro ? C.red : C.green}` }}>
              {leitura.erro ? (
                <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.red }}>{leitura.erro}</span>
              ) : (
                <div style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.green, lineHeight: 1.5 }}>
                  <strong>Dados lidos do PDF e preenchidos abaixo:</strong> {leitura.found.join(", ")}.<br />
                  {leitura.faltou && leitura.faltou.length > 0 && <div style={{ color: C.red, marginTop: 4 }}><strong>Não encontrei:</strong> {leitura.faltou.join(", ")}. Preencha manualmente.</div>}
                  {leitura.aviso && <div style={{ color: C.red, marginTop: 4 }}>{leitura.aviso}</div>}
                  <span style={{ color: C.ink }}>Confira tudo antes de salvar. O que não veio no PDF (dono do cliente, percentual, administrativo, gastos, parceiro) é preenchido por você.</span>
                </div>
              )}
              {leitura.texto && (
                <button type="button" onClick={() => setVerTexto((v) => !v)} style={{ marginTop: 6, background: "none", border: "none", padding: 0, fontFamily: FONT_SANS, fontSize: 11.5, fontWeight: 700, color: C.inkSoft, textDecoration: "underline", cursor: "pointer" }}>{verTexto ? "Esconder texto lido" : "Ver texto lido do PDF"}</button>
              )}
              {verTexto && leitura.texto && (
                <pre style={{ marginTop: 6, maxHeight: 180, overflow: "auto", fontFamily: FONT_MONO, fontSize: 10.5, color: C.ink, whiteSpace: "pre-wrap", wordBreak: "break-word", backgroundColor: "#fff", borderRadius: 6, padding: 8 }}>{leitura.texto}</pre>
              )}
            </div>
          )}
          <Field label="Tipo da requisição">
            <div style={{ display: "flex", gap: 8 }}>
              {["RPV", "Precatório"].map((t) => (
                <button type="button" key={t} onClick={() => set("tipoRequisicao", t)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1.5px solid ${clientForm.tipoRequisicao === t ? C.ink : C.rule}`, backgroundColor: clientForm.tipoRequisicao === t ? C.ink : "#fff", color: clientForm.tipoRequisicao === t ? "#fff" : C.ink, fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, cursor: "pointer" }}>{t}</button>
              ))}
            </div>
          </Field>
          <Field label="Nº da requisição"><TextInput value={clientForm.numeroRequisicao} onChange={(e) => set("numeroRequisicao", e.target.value)} placeholder="Número do ofício / requisição" style={{ fontFamily: FONT_MONO, fontSize: 13 }} /></Field>
          {!clientForm.temDestaque && (
            <Field label="Valor da requisição (RPV / precatório expedido)"><MoneyInput value={clientForm.valorEstimado} onChange={(e) => set("valorEstimado", e.target.value)} /></Field>
          )}

          <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4, cursor: "pointer" }}>
            <input type="checkbox" checked={clientForm.temDestaque} onChange={(e) => set("temDestaque", e.target.checked)} style={{ width: 16, height: 16, accentColor: C.brass }} />
            <span style={{ fontFamily: FONT_SANS, fontSize: 13, color: C.ink, fontWeight: 600 }}>Destaque de honorários advocatícios</span>
          </label>
          {clientForm.temDestaque && (
            <div style={{ marginTop: 8, padding: 12, borderRadius: 9, backgroundColor: C.parchmentDark }}>
              <Field label="Valor do cliente (RPV / precatório, sem o destaque)" required>
                <MoneyInput value={clientForm.valorLiquido} onChange={(e) => set("valorLiquido", e.target.value)} />
              </Field>
              <Field label="Valor do destaque (honorários advocatícios)" required>
                <MoneyInput value={clientForm.valorDestaque} onChange={(e) => set("valorDestaque", e.target.value)} />
              </Field>
              {(() => {
                const L = parseNum(clientForm.valorLiquido), D = parseNum(clientForm.valorDestaque), T = L + D;
                if (!(T > 0)) return null;
                const H = T * (parseNum(clientForm.percentualExito) / 100);
                return (
                  <div style={{ marginBottom: 8 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>
                      <span>Valor total (cliente + destaque)</span>
                      <strong style={{ color: C.ink, fontFamily: FONT_MONO }}>{formatBRL(T)}</strong>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft, marginTop: 3 }}>
                      <span>Destaque = {formatPct(Math.round((D / T) * 10000) / 100)} do total · contrato {formatPct(clientForm.percentualExito)}</span>
                      <strong style={{ color: C.ink, fontFamily: FONT_MONO }}>{formatBRL(Math.max(0, H - D))} do cliente</strong>
                    </div>
                    {D > H + 0.005 && (
                      <div style={{ marginTop: 6, fontFamily: FONT_SANS, fontSize: 11.5, color: C.red }}>Atenção: o destaque ({formatBRL(D)}) é maior que o honorário contratado ({formatBRL(H)}). O app vai considerar o destaque como honorário e não cobra nada a mais do cliente. Confira o percentual.</div>
                    )}
                  </div>
                );
              })()}
              <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
                <Icon name="info" size={13} color={C.inkSoft} />
                <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>O valor total é a soma do cliente + destaque. O honorário é o percentual do êxito sobre esse total: o que o destaque não cobrir é descontado do cliente quando sacar o principal.</span>
              </div>
            </div>
          )}
        </div>

        <div style={cardStyle}>
          <span style={sectionLabelStyle}>Dados do cliente</span>
          <div style={gridTwo}>
            <Field label="Data de cadastro"><TextInput type="date" value={clientForm.dataCadastro} onChange={(e) => set("dataCadastro", e.target.value)} /></Field>
            <Field label="CPF"><TextInput value={clientForm.cpf} onChange={(e) => set("cpf", maskCPF(e.target.value))} placeholder="000.000.000-00" inputMode="numeric" style={{ fontFamily: FONT_MONO, fontSize: 14 }} /></Field>
          </div>
          <Field label="Nome completo" required><TextInput value={clientForm.nome} onChange={(e) => set("nome", e.target.value.toLocaleUpperCase("pt-BR"))} placeholder="NOME DO CLIENTE" style={{ textTransform: "uppercase" }} /></Field>
          <div style={gridTwo}>
            <Field label="Número do benefício (NB)"><TextInput value={clientForm.numeroBeneficio} onChange={(e) => set("numeroBeneficio", e.target.value)} placeholder="000.000.000-0" style={{ fontFamily: FONT_MONO, fontSize: 14 }} /></Field>
            <Field label="Nº do processo"><TextInput value={clientForm.processo} onChange={(e) => set("processo", e.target.value)} placeholder="0000000-00.0000..." style={{ fontFamily: FONT_MONO, fontSize: 13 }} /></Field>
          </div>
          <Field label="Dono do cliente" required>
            <div style={{ display: "flex", gap: 8 }}>
              {Object.keys(DONOS).map((key) => (
                <button type="button" key={key} onClick={() => set("dono", key)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1.5px solid ${clientForm.dono === key ? C.ink : C.rule}`, backgroundColor: clientForm.dono === key ? C.ink : "#fff", color: clientForm.dono === key ? "#fff" : C.ink, fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, cursor: "pointer" }}>
                  {DONOS[key].label}
                </button>
              ))}
            </div>
          </Field>
        </div>

        <div style={cardStyle}>
          <span style={sectionLabelStyle}>Benefício e contrato de honorários</span>
          <ContratoFields especie={clientForm.especieBeneficio} dataContrato={clientForm.dataContrato} contrato={clientForm.contratoItens}
            onChange={(f, v) => set(f === "especie" ? "especieBeneficio" : f === "contrato" ? "contratoItens" : f, v)} showToast={showToast} />
          <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px", borderRadius: 8, backgroundColor: C.parchmentDark }}>
            <Icon name="info" size={13} color={C.inkSoft} />
            <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>Esses dados vão para a prestação de contas. Podem ser preenchidos agora ou só na hora de gerar a prestação.</span>
          </div>
        </div>

        <div style={cardStyle}>
          <span style={sectionLabelStyle}>Valores a serem cobrados</span>
          <div style={gridTwo}>
            <Field label="Percentual do êxito" required hint="Padrão do escritório: 30%">
              <div style={{ position: "relative" }}>
                <input type="number" inputMode="decimal" step="0.5" min="0" max="100" value={clientForm.percentualExito} onChange={(e) => set("percentualExito", e.target.value)} style={{ ...inputBase, paddingRight: 30, fontFamily: FONT_MONO }} />
                <span style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", color: C.inkSoft, fontSize: 14, fontWeight: 600 }}>%</span>
              </div>
            </Field>
            <Field label="Valor administrativo"><MoneyInput value={clientForm.valorAdministrativo} onChange={(e) => set("valorAdministrativo", e.target.value)} /></Field>
          </div>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px", borderRadius: 8, backgroundColor: C.parchmentDark, marginBottom: 12 }}>
            <Icon name="info" size={13} color={C.inkSoft} />
            <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>Administrativo do Dr. Flávio vai 100% para ele. Administrativo de cliente do Dr. Bruno vai 100% para o escritório. O desconto no RPV vai até o limite de 50% do valor total (honorários + administrativo); o que passar disso fica pendente para cobrança por outro meio.</span>
          </div>
          {clientForm.valorAdministrativo && (
            <div style={{ marginBottom: 12 }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                <input type="checkbox" checked={!!clientForm.administrativoPago} onChange={(e) => setClientForm((f) => ({ ...f, administrativoPago: e.target.checked, administrativoPagoValor: e.target.checked ? (f.administrativoPagoValor || f.valorAdministrativo) : "" }))} style={{ width: 16, height: 16, accentColor: C.brass }} />
                <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.ink }}>Administrativo já foi pago pelo cliente (não descontar do RPV)</span>
              </label>
              {clientForm.administrativoPago && (
                <div style={{ marginTop: 8, padding: 12, borderRadius: 9, backgroundColor: C.parchmentDark }}>
                  <Field label="Quanto já foi pago do administrativo" hint="Esse valor sai do cálculo e do limite de 50%. Só o que faltar pagar pode ser descontado do RPV.">
                    <MoneyInput value={clientForm.administrativoPagoValor} onChange={(e) => set("administrativoPagoValor", e.target.value)} />
                  </Field>
                  {parseNum(clientForm.valorAdministrativo) > 0 && (
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>
                      <span>Ainda a pagar</span>
                      <strong style={{ color: C.ink, fontFamily: FONT_MONO }}>{formatBRL(Math.max(0, parseNum(clientForm.valorAdministrativo) - parseNum(clientForm.administrativoPagoValor)))}</strong>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          <Field label="Gastos reembolsáveis">
            <MoneyInput value={clientForm.gastosReembolsaveis} onChange={(e) => set("gastosReembolsaveis", e.target.value)} />
          </Field>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px", borderRadius: 8, backgroundColor: C.parchmentDark, marginBottom: 12 }}>
            <Icon name="info" size={13} color={C.inkSoft} />
            <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>Gastos que o escritório adiantou pelo cliente (perícia, deslocamento, etc.). Ao sair o RPV/precatório, esse valor é descontado do cliente e volta integralmente para o escritório.</span>
          </div>

          <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4, cursor: "pointer" }}>
            <input type="checkbox" checked={clientForm.temSucumbencia} onChange={(e) => set("temSucumbencia", e.target.checked)} style={{ width: 16, height: 16, accentColor: C.brass }} />
            <span style={{ fontFamily: FONT_SANS, fontSize: 13, color: C.ink }}>Possui honorários sucumbenciais</span>
          </label>
          {clientForm.temSucumbencia && (
            <div style={{ marginTop: 8 }}>
              <Field label="Valor estimado da sucumbência" hint="100% do advogado dono do cliente — não entra no divisível">
                <MoneyInput value={clientForm.valorSucumbencial} onChange={(e) => set("valorSucumbencial", e.target.value)} />
              </Field>
            </div>
          )}
        </div>

        <div style={cardStyle}>
          <span style={sectionLabelStyle}>Parceiro(a) — comissão</span>
          <Field label="Nome do(a) parceiro(a) que trouxe o cliente" hint="Deixe em branco se o cliente não veio de parceiro">
            <TextInput value={clientForm.parceiroNome} onChange={(e) => set("parceiroNome", e.target.value)} placeholder="Nome do(a) parceiro(a)" />
          </Field>
          {clientForm.parceiroNome.trim() !== "" && (
            <React.Fragment>
              <Field label="Tipo da comissão">
                <div style={{ display: "flex", gap: 8 }}>
                  {[["percentual", "Percentual (%)"], ["fixo", "Valor fixo (R$)"]].map(([key, lbl]) => (
                    <button type="button" key={key} onClick={() => set("parceiroTipo", key)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1.5px solid ${clientForm.parceiroTipo === key ? C.ink : C.rule}`, backgroundColor: clientForm.parceiroTipo === key ? C.ink : "#fff", color: clientForm.parceiroTipo === key ? "#fff" : C.ink, fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, cursor: "pointer" }}>
                      {lbl}
                    </button>
                  ))}
                </div>
              </Field>
              <Field label={clientForm.parceiroTipo === "fixo" ? "Valor da comissão" : "Percentual da comissão"} hint={clientForm.parceiroTipo === "fixo" ? "Valor em reais, descontado da parte do escritório" : "Costuma ser 10% — calculado sobre a parte do escritório (sem os gastos reembolsáveis)"}>
                {clientForm.parceiroTipo === "fixo" ? (
                  <MoneyInput value={clientForm.parceiroValor} onChange={(e) => set("parceiroValor", e.target.value)} />
                ) : (
                  <div style={{ position: "relative" }}>
                    <input type="number" inputMode="decimal" step="0.5" min="0" max="100" value={clientForm.parceiroValor} onChange={(e) => set("parceiroValor", e.target.value)} placeholder="10" style={{ ...inputBase, paddingRight: 30, fontFamily: FONT_MONO }} />
                    <span style={{ position: "absolute", right: 12, top: "50%", transform: "translateY(-50%)", color: C.inkSoft, fontSize: 14, fontWeight: 600 }}>%</span>
                  </div>
                )}
              </Field>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px", borderRadius: 8, backgroundColor: C.parchmentDark }}>
                <Icon name="info" size={13} color={C.inkSoft} />
                <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>A comissão sai do valor do escritório. O cliente e os sócios não são afetados.</span>
              </div>
            </React.Fragment>
          )}
        </div>

        <div style={{ marginBottom: 14 }}>
          <FeeBreakdown dono={clientForm.dono} percentualExito={clientForm.percentualExito} valorEstimado={clientForm.temDestaque ? String(parseNum(clientForm.valorLiquido) + parseNum(clientForm.valorDestaque)) : clientForm.valorEstimado} valorAdministrativo={clientForm.valorAdministrativo} administrativoPago={clientForm.administrativoPago} administrativoPagoValor={clientForm.administrativoPagoValor} valorGastos={clientForm.gastosReembolsaveis} parceiroNome={clientForm.parceiroNome} parceiroTipo={clientForm.parceiroTipo} parceiroValor={clientForm.parceiroValor} temDestaque={clientForm.temDestaque} valorDestaque={clientForm.valorDestaque} />
        </div>

        {clientForm.temSucumbencia && (
          <div style={{ marginBottom: 14 }}>
            <SucumbenciaBox dono={clientForm.dono} valorSucumbencial={clientForm.valorSucumbencial} />
          </div>
        )}

        <div style={cardStyle}>
          <span style={sectionLabelStyle}>Observações</span>
          <textarea value={clientForm.obs} onChange={(e) => set("obs", e.target.value)} placeholder="Opcional" rows={2} style={{ ...inputBase, resize: "vertical", fontFamily: FONT_SANS }} />
        </div>

        <button type="submit" disabled={saving} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: C.ink, color: "#fff", fontFamily: FONT_SANS, fontSize: 15, fontWeight: 700, padding: 14, borderRadius: 10, border: "none", cursor: saving ? "default" : "pointer", opacity: saving ? 0.7 : 1, marginBottom: 24 }}>
          {saving ? <Spinner size={17} /> : <Icon name="userPlus" size={17} />}
          {editingClienteId ? "Salvar alterações" : "Cadastrar cliente"}
        </button>
      </form>

      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
        <Icon name="users" size={15} color={C.brassDark} />
        <span style={{ fontFamily: FONT_SERIF, fontSize: 13, fontWeight: 700, color: C.brassDark, textTransform: "uppercase", letterSpacing: "0.06em" }}>Aguardando levantamento ({clientes.length})</span>
      </div>

      {clientes.length === 0 ? (
        <EmptyState title="Nenhum cliente aguardando levantamento" text="Cadastre o cliente com antecedência para agilizar o levantamento no banco. Clientes já levantados ficam em Histórico → Clientes." />
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 16 }}>
          {clientes.map((c) => (
            <ClientCard key={c.id} cliente={c} entries={entries} onEdit={() => onEdit(c)} confirmingDelete={confirmDeleteId === c.id}
              onAskDelete={() => setConfirmDeleteId(c.id)} onCancelDelete={() => setConfirmDeleteId(null)}
              onConfirmDelete={() => { onDelete(c.id); setConfirmDeleteId(null); }} />
          ))}
        </div>
      )}
    </div>
  );
}

function ClientCard({ cliente, entries, prestacoes, onEdit, confirmingDelete, onAskDelete, onCancelDelete, onConfirmDelete }) {
  const [expanded, setExpanded] = useState(false);
  return (
    <div style={{ backgroundColor: C.card, border: `1px solid ${C.ruleSoft}`, borderLeft: `4px solid ${cliente.dono === "Flávio" ? C.blue : C.brass}`, borderRadius: 10, overflow: "hidden" }}>
      <button onClick={() => setExpanded((s) => !s)} style={{ width: "100%", textAlign: "left", padding: "12px 14px", display: "flex", alignItems: "flex-start", gap: 12, background: "none", border: "none", cursor: "pointer" }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontFamily: FONT_SERIF, fontSize: 15, fontWeight: 700, color: C.ink }}>{cliente.nome}</span>
            <DonoBadge dono={cliente.dono} />
          </div>
          {cliente.cpf && <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.inkSoft, marginTop: 2 }}>{cliente.cpf}</div>}
          <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft, marginTop: 3 }}>Cadastrado em {formatDateBR(cliente.dataCadastro)} · Êxito {formatPct(cliente.percentualExito)}</div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>
          <span style={{ fontFamily: FONT_MONO, fontSize: 14, fontWeight: 700, color: C.ink }}>{formatBRL(cliente.valorEstimado)}</span>
          <Icon name={expanded ? "chevronUp" : "chevronDown"} size={16} color={C.inkSoft} />
        </div>
      </button>
      {expanded && (
        <div style={{ padding: "0 14px 14px", borderTop: `1px dashed ${C.ruleSoft}` }}>
          {cliente.numeroBeneficio && <div style={{ marginTop: 12, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>NB: <strong style={{ color: C.ink }}>{cliente.numeroBeneficio}</strong></div>}
          {cliente.processo && <div style={{ marginTop: 4, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Processo: <strong style={{ color: C.ink, fontFamily: FONT_MONO }}>{cliente.processo}</strong></div>}
          <div style={{ marginTop: 12, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>{reqLabel(cliente.tipoRequisicao)}{cliente.numeroRequisicao ? <span> nº <strong style={{ color: C.ink, fontFamily: FONT_MONO }}>{cliente.numeroRequisicao}</strong></span> : null}</div>
          {cliente.temDestaque && cliente.valorDestaque > 0 && <div style={{ marginTop: 4, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Destaque de honorários: <strong style={{ color: C.ink }}>{formatBRL(cliente.valorDestaque)}</strong> · principal sem destaque: <strong style={{ color: C.ink }}>{formatBRL(Math.max(0, (cliente.valorEstimado || 0) - cliente.valorDestaque))}</strong></div>}
          {(() => {
            const st = statusLevantamento(cliente, entries || []);
            const chip = (ok, txt) => <span style={{ fontFamily: FONT_SANS, fontSize: 11, fontWeight: 700, padding: "3px 8px", borderRadius: 999, backgroundColor: ok ? C.greenSoft : C.parchmentDark, color: ok ? C.green : C.inkSoft, border: `1px solid ${ok ? C.green : C.rule}` }}>{txt}</span>;
            return (
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                {cliente.temDestaque
                  ? [chip(st.principalFeito, st.principalFeito ? `${reqLabel(cliente.tipoRequisicao)} levantado` : `${reqLabel(cliente.tipoRequisicao)} pendente`), chip(st.destaqueFeito, st.destaqueFeito ? "Destaque levantado" : "Destaque pendente")]
                  : chip(st.principalFeito, st.principalFeito ? "Levantado" : "Aguardando levantamento")}
                {cliente.temSucumbencia && (() => { const ok = (entries || []).some((e) => e.clienteId === cliente.id && e.sucumbencial); return chip(ok, ok ? "Sucumbência levantada" : "Sucumbência a levantar"); })()}
                {prestacoes && st.principalFeito && (() => { const ok = prestacoes.some((p) => p.clienteId === cliente.id); return chip(ok, ok ? "Prestação de contas gerada" : "Prestação pendente"); })()}
              </div>
            );
          })()}
          {cliente.valorAdministrativo > 0 && <div style={{ marginTop: 4, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Administrativo: <strong style={{ color: C.ink }}>{formatBRL(cliente.valorAdministrativo)}</strong> · {administrativoDestino(cliente.dono)}</div>}
          {cliente.gastosReembolsaveis > 0 && <div style={{ marginTop: 4, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Gastos reembolsáveis: <strong style={{ color: C.ink }}>{formatBRL(cliente.gastosReembolsaveis)}</strong> · voltam para o escritório</div>}
          {cliente.parceiroNome && <div style={{ marginTop: 4, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Parceiro(a): <strong style={{ color: C.ink }}>{cliente.parceiroNome}</strong>{cliente.parceiroValor > 0 && <span> · comissão {cliente.parceiroTipo === "fixo" ? formatBRL(cliente.parceiroValor) : formatPct(cliente.parceiroValor)} (sai do escritório)</span>}</div>}
          {cliente.obs && <div style={{ marginTop: 4, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft, fontStyle: "italic" }}>“{cliente.obs}”</div>}
          <div style={{ marginTop: 12 }}>
            <FeeBreakdown dono={cliente.dono} percentualExito={cliente.percentualExito} valorEstimado={cliente.valorEstimado} valorAdministrativo={cliente.valorAdministrativo} administrativoPago={cliente.administrativoPago} administrativoPagoValor={cliente.administrativoPagoValor} valorGastos={cliente.gastosReembolsaveis} parceiroNome={cliente.parceiroNome} parceiroTipo={cliente.parceiroTipo} parceiroValor={cliente.parceiroValor} temDestaque={cliente.temDestaque} valorDestaque={cliente.valorDestaque} />
          </div>
          {cliente.temSucumbencia && (
            <div style={{ marginTop: 10 }}>
              <SucumbenciaBox dono={cliente.dono} valorSucumbencial={cliente.valorSucumbencial} />
            </div>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14 }}>
            <button onClick={onEdit} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.rule}`, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><Icon name="pencil" size={13} /> Editar</button>
            {!confirmingDelete ? (
              <button onClick={onAskDelete} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.redSoft}`, backgroundColor: "#fff", color: C.red, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><Icon name="trash" size={13} /> Excluir</button>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: C.red }}>Confirmar exclusão?</span>
                <button onClick={onConfirmDelete} style={{ background: C.red, color: "#fff", border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Sim</button>
                <button onClick={onCancelDelete} style={{ background: "none", color: C.inkSoft, border: `1px solid ${C.rule}`, borderRadius: 6, padding: "5px 10px", fontSize: 12, cursor: "pointer" }}>Não</button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- Auto rateio preview ----------
function AutoRateioPreview({ split }) {
  return (
    <div style={{ backgroundColor: C.parchmentDark, borderRadius: 9, padding: "12px 14px" }}>
      <div style={gridTwo}>
        <LedgerValue label={split.comissaoParceiro > 0 ? "Escritório (líquido)" : "Escritório"} value={split.escritorio} />
        <LedgerValue label="Cliente" value={split.cliente} />
        <LedgerValue label="Dr. Flávio" value={split.flavio} />
        <LedgerValue label="Dr. Bruno" value={split.bruno} />
        {split.comissaoParceiro > 0 && <LedgerValue label="Parceiro(a)" value={split.comissaoParceiro} />}
      </div>
      {split.comissaoParceiro > 0 && (
        <div style={{ fontFamily: FONT_SANS, fontSize: 11, color: C.inkSoft, marginTop: 8 }}>
          Comissão de parceiro(a) já descontada da parte do escritório (não afeta o cliente).
        </div>
      )}
      {split.administrativoAplicado > 0 && (
        <div style={{ fontFamily: FONT_SANS, fontSize: 11, color: C.inkSoft, marginTop: 8 }}>
          Inclui {formatBRL(split.administrativoAplicado)} de valor administrativo, descontado do cliente.
        </div>
      )}
      {split.gastosAplicado > 0 && (
        <div style={{ fontFamily: FONT_SANS, fontSize: 11, color: C.inkSoft, marginTop: 4 }}>
          Inclui {formatBRL(split.gastosAplicado)} de gastos reembolsáveis, descontados do cliente.
        </div>
      )}
      {split.excedenteCliente > 0 && (
        <div style={{ fontFamily: FONT_SANS, fontSize: 11, color: C.inkSoft, marginTop: 4 }}>
          Inclui {formatBRL(split.excedenteCliente)} de honorários contratados que o destaque não cobriu, descontados do cliente.
        </div>
      )}
      {split.administrativoPendente > 0 && (
        <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, fontWeight: 700, color: C.red, marginTop: 6 }}>
          Administrativo pendente: {formatBRL(split.administrativoPendente)} não pôde ser descontado do RPV (limite de 50%). Confirmar pagamento por outro meio (cartão, boleto ou nota promissória).
        </div>
      )}
    </div>
  );
}

// ---------- Novo / Editar Levantamento Tab ----------
function FormTab({ form, setForm, onSubmit, editingId, onCancelEdit, photoDataUrl, setPhotoDataUrl, photoBusy, fileInputRef, valorInputRef, onPhotoFile, responsaveisConhecidos, clientes, entries, saving, showToast, rateioManual, setRateioManual, lastSaved, onNextEntry, onGeneratePDF, pdfBusy, clientesOpcoes }) {
  const [showDetails, setShowDetails] = useState(false);
  function set(field, value) { setForm((f) => ({ ...f, [field]: value })); }
  const linkedClient = clientes.find((c) => c.id === form.clienteId) || null;
  const usaDestaque = !!(linkedClient && linkedClient.temDestaque);
  const vP = usaDestaque ? parseNum(form.valorPrincipal) : parseNum(form.valorTotal);
  const vD = usaDestaque ? parseNum(form.valorDestaque) : 0;
  const totalLev = vP + vD;
  const stCliente = usaDestaque ? statusLevantamento(linkedClient, (entries || []).filter((en) => en.id !== editingId)) : null;
  const autoSplit = linkedClient && !rateioManual ? computeLevantamento({ cliente: linkedClient, vPrincipal: vP, vDestaque: vD, sucumbencial: form.sucumbencial, parceiroJaPago: parceiroJaPagoDe(entries || [], linkedClient.id, editingId) }) : null;
  const somaManual = parseNum(form.valorEscritorio) + parseNum(form.valorCliente) + parseNum(form.valorFlavio) + parseNum(form.valorBruno);
  const diffManual = Math.round((totalLev - somaManual) * 100) / 100;
  const showDiffWarning = !autoSplit && totalLev > 0 && Math.abs(diffManual) > 0.01;

  if (lastSaved) {
    return (
      <div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", padding: "24px 16px", ...cardStyle }}>
          <div style={{ width: 52, height: 52, borderRadius: 999, backgroundColor: C.greenSoft, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 12 }}>
            <Icon name="check" size={26} color={C.green} strokeWidth={2.5} />
          </div>
          <span style={{ fontFamily: FONT_SERIF, fontSize: 18, fontWeight: 700, color: C.ink }}>Levantamento registrado</span>
          <span style={{ fontFamily: FONT_SANS, fontSize: 13, color: C.inkSoft, marginTop: 4 }}>Toque no botão abaixo para gerar o PDF do comprovante e enviar direto pelo WhatsApp, e-mail, ou salvar no aparelho.</span>
          <div style={{ width: "100%", marginTop: 16, backgroundColor: C.parchmentDark, borderRadius: 10, padding: 14, textAlign: "left" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
              <span style={{ fontFamily: FONT_SERIF, fontSize: 15, fontWeight: 700, color: C.ink }}>{lastSaved.cliente}</span>
              <BankBadge banco={lastSaved.banco} />
            </div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.inkSoft }}>Proc. {lastSaved.processo}</div>
            {tipoLevLabel(lastSaved) && <div style={{ fontFamily: FONT_SANS, fontSize: 12, fontWeight: 700, color: C.brassDark, marginTop: 6 }}>{tipoLevLabel(lastSaved)}</div>}
            <div style={{ fontFamily: FONT_MONO, fontSize: 20, fontWeight: 700, color: C.ink, marginTop: 6 }}>{formatBRL(lastSaved.valorTotal)}</div>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, width: "100%", marginTop: 16 }}>
            <button onClick={() => onGeneratePDF(lastSaved)} disabled={pdfBusy} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: C.ink, color: "#fff", fontFamily: FONT_SANS, fontSize: 14.5, fontWeight: 700, padding: 13, borderRadius: 10, border: "none", cursor: pdfBusy ? "default" : "pointer", opacity: pdfBusy ? 0.7 : 1 }}>
              {pdfBusy ? <Spinner size={16} /> : <Icon name="printer" size={16} />} {pdfBusy ? "Gerando PDF..." : "Compartilhar / baixar PDF"}
            </button>
            <button onClick={onNextEntry} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 14.5, fontWeight: 700, padding: 13, borderRadius: 10, border: `1.5px solid ${C.rule}`, cursor: "pointer" }}>
              <Icon name="arrowRight" size={16} /> Registrar próximo cliente
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <form onSubmit={onSubmit}>
      {editingId && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, padding: "8px 12px", borderRadius: 8, backgroundColor: C.brassSoft, border: `1px solid ${C.brass}` }}>
          <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.brassDark, fontWeight: 600 }}>Editando registro existente</span>
          <button type="button" onClick={onCancelEdit} style={{ background: "none", border: "none", color: C.brassDark, cursor: "pointer" }}><Icon name="x" size={16} /></button>
        </div>
      )}

      <div style={cardStyle}>
        <span style={sectionLabelStyle}>Cliente</span>
        {clientes.length > 0 ? (
          <Field label="Selecione o cliente cadastrado" required hint={(clientesOpcoes || []).length === 0 ? "Todos os clientes cadastrados já foram levantados (veja em Histórico → Clientes)." : undefined}>
            <select value={form.clienteId} onChange={(e) => {
                const id = e.target.value;
                const c = clientes.find((cl) => cl.id === id);
                setForm((f) => ({ ...f, clienteId: id, cliente: c ? c.nome.toLocaleUpperCase("pt-BR") : "", processo: c && c.processo ? c.processo : f.processo }));
                setRateioManual(false);
                if (id) setTimeout(() => valorInputRef.current && valorInputRef.current.focus(), 60);
              }} style={{ ...inputBase, appearance: "none", fontSize: 16, fontWeight: 600 }}>
              <option value="">— selecionar —</option>
              {(clientesOpcoes || clientes).map((c) => (<option key={c.id} value={c.id}>{c.nome}{c.cpf ? ` — ${c.cpf}` : ""}</option>))}
            </select>
          </Field>
        ) : (
          <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "10px 12px", borderRadius: 8, backgroundColor: C.parchmentDark, marginBottom: 12 }}>
            <Icon name="info" size={13} color={C.inkSoft} />
            <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: C.inkSoft }}>Nenhum cliente cadastrado ainda. Cadastre na aba “Clientes” ou preencha manualmente abaixo.</span>
          </div>
        )}

        {linkedClient ? (
          <div style={{ marginTop: 4, padding: "10px 12px", borderRadius: 8, display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 8, backgroundColor: C.brassSoft, border: `1px solid ${C.brass}` }}>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <DonoBadge dono={linkedClient.dono} />
                <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.brassDark }}>Êxito {formatPct(linkedClient.percentualExito)}</span>
              </div>
              {linkedClient.numeroBeneficio && <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: C.brassDark, marginTop: 3 }}>NB {linkedClient.numeroBeneficio}</div>}
            </div>
          </div>
        ) : (
          <React.Fragment>
            <Field label="Cliente" required><TextInput value={form.cliente} onChange={(e) => set("cliente", e.target.value)} placeholder="Nome completo do cliente" /></Field>
            <Field label="Número do processo" required><TextInput value={form.processo} onChange={(e) => set("processo", e.target.value)} placeholder="0000000-00.0000.0.00.0000" style={{ fontFamily: FONT_MONO, fontSize: 14 }} /></Field>
          </React.Fragment>
        )}
      </div>

      <div style={cardStyle}>
        <span style={sectionLabelStyle}>Banco</span>
        <div style={{ display: "flex", gap: 8 }}>
          {Object.entries(BANCOS).map(([key, b]) => (
            <button type="button" key={key} onClick={() => set("banco", key)} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: "12px 0", borderRadius: 8, border: `1.5px solid ${form.banco === key ? b.color : C.rule}`, backgroundColor: form.banco === key ? b.color : "#fff", color: form.banco === key ? "#fff" : C.ink, fontFamily: FONT_SANS, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
              {b.short}
            </button>
          ))}
        </div>
      </div>

      <div style={cardStyle}>
        <span style={sectionLabelStyle}>{usaDestaque ? "Valores levantados" : "Valor levantado"}</span>
        {usaDestaque ? (
          <React.Fragment>
            <div style={{ display: "flex", alignItems: "flex-start", gap: 8, padding: "8px 12px", borderRadius: 8, backgroundColor: C.parchmentDark, marginBottom: 12 }}>
              <Icon name="info" size={13} color={C.inkSoft} />
              <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>Este cliente tem destaque de honorários. Lance só o que foi sacado hoje: o {reqLabel(linkedClient.tipoRequisicao)}, o destaque, ou os dois. Deixe em branco a parte que não foi sacada.</span>
            </div>
            <Field label={`${reqLabel(linkedClient.tipoRequisicao)} (principal, sem o destaque)`} hint={`Previsto: ${formatBRL(Math.max(0, (linkedClient.valorEstimado || 0) - (linkedClient.valorDestaque || 0)))}${stCliente && stCliente.principalFeito ? ` · já levantado: ${formatBRL(stCliente.principal)}` : ""}`}>
              <MoneyInput big inputRef={valorInputRef} value={form.valorPrincipal} onChange={(e) => set("valorPrincipal", e.target.value)} />
            </Field>
            <Field label="Destaque de honorários advocatícios" hint={`Previsto: ${formatBRL(linkedClient.valorDestaque || 0)}${stCliente && stCliente.destaqueFeito ? ` · já levantado: ${formatBRL(stCliente.destaque)}` : ""}`}>
              <MoneyInput big value={form.valorDestaque} onChange={(e) => set("valorDestaque", e.target.value)} />
            </Field>
            {totalLev > 0 && (
              <div style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft, marginBottom: 4 }}>
                Levantamento: <strong style={{ color: C.ink }}>{vP > 0 && vD > 0 ? `${reqLabel(linkedClient.tipoRequisicao)} + destaque de honorários` : vD > 0 ? "somente destaque de honorários" : `somente ${reqLabel(linkedClient.tipoRequisicao)}`}</strong> · total {formatBRL(totalLev)}
              </div>
            )}
          </React.Fragment>
        ) : (
          <MoneyInput big inputRef={valorInputRef} value={form.valorTotal} onChange={(e) => set("valorTotal", e.target.value)} />
        )}
        <div style={{ marginTop: 12 }}>
          <Field label="Responsável pelo levantamento" required>
            <TextInput list="responsaveis-list" value={form.responsavel} onChange={(e) => set("responsavel", e.target.value)} placeholder="Quem foi ao banco" />
            <datalist id="responsaveis-list">{responsaveisConhecidos.map((r) => (<option key={r} value={r} />))}</datalist>
          </Field>
        </div>
        {linkedClient && (
          <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
            <input type="checkbox" checked={form.sucumbencial} onChange={(e) => set("sucumbencial", e.target.checked)} style={{ width: 16, height: 16, accentColor: C.brass }} />
            <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.ink }}>Honorários sucumbenciais (100% {linkedClient.dono === "Flávio" ? "Dr. Flávio" : "Dr. Bruno"})</span>
          </label>
        )}
      </div>

      <div style={cardStyle}>
        <span style={sectionLabelStyle}>Comprovante do banco</span>
        <input type="file" accept="image/*,application/pdf" capture="environment" ref={fileInputRef} onChange={onPhotoFile} style={{ display: "none" }} />
        {photoDataUrl ? (
          <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>
            {isPdfDataUrl(photoDataUrl) ? (
              <div style={{ width: 92, height: 92, borderRadius: 8, border: `1px solid ${C.rule}`, transform: "rotate(-1.5deg)", boxShadow: "0 2px 6px rgba(31,44,61,0.15)", flexShrink: 0, backgroundColor: C.parchmentDark, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4 }}>
                <Icon name="clipboard" size={24} color={C.brassDark} />
                <span style={{ fontFamily: FONT_SANS, fontSize: 10, fontWeight: 700, color: C.brassDark }}>PDF</span>
              </div>
            ) : (
              <div style={{ width: 92, height: 92, borderRadius: 8, overflow: "hidden", border: `1px solid ${C.rule}`, transform: "rotate(-1.5deg)", boxShadow: "0 2px 6px rgba(31,44,61,0.15)", flexShrink: 0 }}>
                <img src={photoDataUrl} alt="Comprovante" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
              </div>
            )}
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} style={{ fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, color: C.brassDark, background: "none", border: `1.5px solid ${C.brass}`, borderRadius: 7, padding: "6px 10px", cursor: "pointer" }}>Trocar arquivo</button>
              <button type="button" onClick={() => setPhotoDataUrl(null)} style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.red, background: "none", border: "none", padding: "0 2px", cursor: "pointer", textAlign: "left" }}>Remover</button>
            </div>
          </div>
        ) : (
          <button type="button" onClick={() => fileInputRef.current && fileInputRef.current.click()} disabled={photoBusy} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, padding: 18, borderRadius: 10, border: `2px dashed ${C.brass}`, backgroundColor: C.brassSoft, color: C.brassDark, fontFamily: FONT_SANS, fontSize: 14.5, fontWeight: 700, cursor: "pointer" }}>
            {photoBusy ? <Spinner size={18} color={C.brassDark} /> : <Icon name="camera" size={18} />}
            {photoBusy ? "Processando..." : "Tirar foto ou anexar PDF do comprovante"}
          </button>
        )}
      </div>

      <div style={cardStyle}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
          <span style={{ ...sectionLabelStyle, marginBottom: 0 }}>Rateio dos valores</span>
          {linkedClient && (
            <button type="button" onClick={() => setRateioManual((m) => !m)} style={{ fontFamily: FONT_SANS, fontSize: 11.5, fontWeight: 700, color: C.brassDark, background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>
              {rateioManual ? "Usar cálculo automático" : "Ajustar manualmente"}
            </button>
          )}
        </div>
        {autoSplit ? (
          totalLev > 0 ? <AutoRateioPreview split={autoSplit} /> : <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Informe o valor levantado para calcular o rateio.</span>
        ) : (
          <React.Fragment>
            <div style={gridTwo}>
              <Field label="Escritório"><MoneyInput value={form.valorEscritorio} onChange={(e) => set("valorEscritorio", e.target.value)} /></Field>
              <Field label="Cliente"><MoneyInput value={form.valorCliente} onChange={(e) => set("valorCliente", e.target.value)} /></Field>
              <Field label="Dr. Flávio"><MoneyInput value={form.valorFlavio} onChange={(e) => set("valorFlavio", e.target.value)} /></Field>
              <Field label="Dr. Bruno (honorários)"><MoneyInput value={form.valorBruno} onChange={(e) => set("valorBruno", e.target.value)} /></Field>
            </div>
            {totalLev > 0 && (
              <div style={{ marginTop: 4, padding: "8px 12px", borderRadius: 8, display: "flex", alignItems: "flex-start", gap: 8, backgroundColor: showDiffWarning ? C.redSoft : C.greenSoft, border: `1px solid ${showDiffWarning ? C.red : C.green}` }}>
                <Icon name={showDiffWarning ? "alert" : "check"} size={15} color={showDiffWarning ? C.red : C.green} />
                <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: showDiffWarning ? C.red : C.green }}>
                  {showDiffWarning ? `Rateio (${formatBRL(somaManual)}) não bate com o valor total. Diferença de ${formatBRL(Math.abs(diffManual))} ${diffManual > 0 ? "faltando distribuir" : "a mais no rateio"}.` : `Rateio confere com o valor total (${formatBRL(somaManual)}).`}
                </span>
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      <button type="button" onClick={() => setShowDetails((s) => !s)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 4px", marginBottom: 8, background: "none", border: "none", cursor: "pointer" }}>
        <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 700, color: C.inkSoft, textTransform: "uppercase", letterSpacing: "0.05em" }}>Mais detalhes</span>
        <Icon name={showDetails ? "chevronUp" : "chevronDown"} size={16} color={C.inkSoft} />
      </button>

      {showDetails && (
        <div style={cardStyle}>
          <Field label="Data do levantamento" required><TextInput type="date" value={form.dataLevantamento} onChange={(e) => set("dataLevantamento", e.target.value)} /></Field>
          <span style={sectionLabelStyle}>Observações</span>
          <textarea value={form.obs} onChange={(e) => set("obs", e.target.value)} placeholder="Opcional" rows={2} style={{ ...inputBase, resize: "vertical", fontFamily: FONT_SANS }} />
        </div>
      )}

      <button type="submit" disabled={saving} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: C.ink, color: "#fff", fontFamily: FONT_SANS, fontSize: 15, fontWeight: 700, padding: 14, borderRadius: 10, border: "none", cursor: saving ? "default" : "pointer", opacity: saving ? 0.7 : 1 }}>
        {saving ? <Spinner size={17} /> : <Icon name="check" size={17} />}
        {editingId ? "Salvar alterações" : "Registrar levantamento"}
      </button>
    </form>
  );
}

function EntryCard({ entry, index, expanded, onToggle, onEdit, onGeneratePDF, pdfBusy, confirmingDelete, onAskDelete, onCancelDelete, onConfirmDelete }) {
  return (
    <div style={{ backgroundColor: C.card, border: `1px solid ${C.ruleSoft}`, borderLeft: `4px solid ${C.brass}`, borderRadius: 10, overflow: "hidden" }}>

        <span style={{ fontFamily: FONT_SERIF, fontSize: 12, color: C.rule, fontWeight: 700, marginTop: 2 }}>{String(index).padStart(2, "0")}</span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
            <span style={{ fontFamily: FONT_SERIF, fontSize: 15, fontWeight: 700, color: C.ink }}>{entry.cliente}</span>
            <BankBadge banco={entry.banco} />
            {entry.sucumbencial && <span style={{ fontFamily: FONT_SANS, fontSize: 10, fontWeight: 700, color: C.blue, backgroundColor: C.blueSoft, padding: "2px 6px", borderRadius: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>Sucumbência</span>}
            {tipoLevLabel(entry) && <span style={{ fontFamily: FONT_SANS, fontSize: 10, fontWeight: 700, color: C.brassDark, backgroundColor: C.brassSoft, padding: "2px 6px", borderRadius: 4, textTransform: "uppercase", letterSpacing: "0.03em" }}>{tipoLevCurto(entry)}</span>}
          </div>
          <div style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.inkSoft, marginTop: 2 }}>Proc. {entry.processo}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
            <span style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.inkSoft }}>{formatDateBR(entry.dataLevantamento)}</span>

        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 4 }}>

            <LedgerValue label="Dr. Flávio" value={entry.valorFlavio} />
            <LedgerValue label="Dr. Bruno" value={entry.valorBruno} />
            {entry.valorParceiro > 0 && <LedgerValue label={`Parceiro(a)${entry.parceiroNome ? " — " + entry.parceiroNome : ""}`} value={entry.valorParceiro} />}
          </div>
          {tipoLevLabel(entry) && (
            <div style={{ marginTop: 10, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>

              {entry.valorPrincipal > 0 && <span> · {reqLabel(entry.tipoRequisicao)}: {formatBRL(entry.valorPrincipal)}</span>}
              {entry.valorDestaque > 0 && <span> · Destaque: {formatBRL(entry.valorDestaque)}</span>}
            </div>
          )}
          {entry.valorExcedenteCliente > 0 && <div style={{ marginTop: 6, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Honorários contratados descontados do cliente (excedente do destaque): <strong style={{ color: C.ink }}>{formatBRL(entry.valorExcedenteCliente)}</strong></div>}
          {entry.administrativoPendente > 0 && <div style={{ marginTop: 6, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 700, color: C.red }}>Administrativo pendente: {formatBRL(entry.administrativoPendente)} (confirmar pagamento por outro meio)</div>}
          <div style={{ marginTop: 10, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft }}>Responsável pelo levantamento: <strong style={{ color: C.ink }}>{entry.responsavel}</strong></div>
          {entry.obs && <div style={{ marginTop: 4, fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft, fontStyle: "italic" }}>“{entry.obs}”</div>}
          {entry.foto && (
            <div style={{ marginTop: 12 }}>
              {isPdfDataUrl(entry.foto) ? (
                <a href={entry.foto} download={`comprovante-${entry.cliente}.pdf`} style={{ display: "inline-flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1px solid ${C.rule}`, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, textDecoration: "none" }}>
                  <Icon name="clipboard" size={14} /> Ver comprovante (PDF)
                </a>
              ) : (
                <img src={entry.foto} alt="Comprovante" style={{ maxWidth: 160, borderRadius: 8, border: `1px solid ${C.rule}`, transform: "rotate(-1deg)", boxShadow: "0 2px 6px rgba(31,44,61,0.15)" }} />
              )}
            </div>
          )}
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
            <button onClick={onGeneratePDF} disabled={pdfBusy} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.brass}`, backgroundColor: C.brassSoft, color: C.brassDark, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 700, cursor: pdfBusy ? "default" : "pointer", opacity: pdfBusy ? 0.6 : 1 }}>
              {pdfBusy ? <Spinner size={13} color={C.brassDark} /> : <Icon name="printer" size={13} />} PDF
            </button>
            <button onClick={onEdit} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.rule}`, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><Icon name="pencil" size={13} /> Editar</button>
            {!confirmingDelete ? (
              <button onClick={onAskDelete} style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 12px", borderRadius: 8, border: `1.5px solid ${C.redSoft}`, backgroundColor: "#fff", color: C.red, fontFamily: FONT_SANS, fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}><Icon name="trash" size={13} /> Excluir</button>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: C.red }}>Confirmar exclusão?</span>
                <button onClick={onConfirmDelete} style={{ background: C.red, color: "#fff", border: "none", borderRadius: 6, padding: "5px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Sim</button>
                <button onClick={onCancelDelete} style={{ background: "none", color: C.inkSoft, border: `1px solid ${C.rule}`, borderRadius: 6, padding: "5px 10px", fontSize: 12, cursor: "pointer" }}>Não</button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

}

// ---------- Relatório Tab ----------
function RelatorioTab({ entries, clientes, onMarkSent, showToast, onGeneratePDF, pdfBusy, onBackup }) {
  const [dataInicio, setDataInicio] = useState("");
  const [dataFim, setDataFim] = useState("");
  const [apenasPendentes, setApenasPendentes] = useState(true);
  const [selecionados, setSelecionados] = useState(() => new Set());
  const [showPreview, setShowPreview] = useState(false);

  const filtrados = useMemo(() => {
    return entries.filter((en) => (apenasPendentes ? !en.enviado : true))
      .filter((en) => (dataInicio ? en.dataLevantamento >= dataInicio : true))
      .filter((en) => (dataFim ? en.dataLevantamento <= dataFim : true))
      .sort((a, b) => (a.dataLevantamento || "").localeCompare(b.dataLevantamento || ""));
  }, [entries, apenasPendentes, dataInicio, dataFim]);

  useEffect(() => { setSelecionados(new Set(filtrados.map((en) => en.id))); }, [dataInicio, dataFim, apenasPendentes, entries.length]);

  const lista = filtrados.filter((en) => selecionados.has(en.id));
  const listaP = lista.map((en) => ({ ...en, _pend: pendenciaTexto(en, (clientes || []).find((c) => c.id === en.clienteId) || null, entries) }));
  const totals = lista.reduce((acc, en) => {
    if (en.tipoLevantamento && en.tipoLevantamento !== "completo") { acc.principal += en.valorPrincipal || 0; acc.destaque += en.valorDestaque || 0; }
    else acc.principal += en.valorTotal || 0;
    acc.total += en.valorTotal || 0; acc.escritorio += en.valorEscritorio || 0; acc.cliente += en.valorCliente || 0;
    acc.flavio += en.valorFlavio || 0; acc.bruno += en.valorBruno || 0; acc.parceiro += en.valorParceiro || 0; return acc;
  }, { total: 0, escritorio: 0, cliente: 0, flavio: 0, bruno: 0, parceiro: 0, principal: 0, destaque: 0 });

  const periodoLabel = dataInicio || dataFim ? `${dataInicio ? formatDateBR(dataInicio) : "início"} a ${dataFim ? formatDateBR(dataFim) : "hoje"}` : "todos os registros";

  function reportText() {
    const linhas = listaP.map((en, i) => (
      `${i + 1}. ${en.cliente} — Proc. ${en.processo}${en.sucumbencial ? " (honorários sucumbenciais)" : ""}\n` +
      `   Banco: ${BANCOS[en.banco] ? BANCOS[en.banco].short : en.banco} | Data: ${formatDateBR(en.dataLevantamento)} | Responsável: ${en.responsavel}\n` +
      (tipoLevLabel(en) ? `   Levantamento: ${tipoLevLabel(en)}${en.valorPrincipal > 0 ? ` | ${reqLabel(en.tipoRequisicao)}: ${formatBRL(en.valorPrincipal)}` : ""}${en.valorDestaque > 0 ? ` | Destaque de honorários: ${formatBRL(en.valorDestaque)}` : ""}\n` : "") +
      `   Valor total: ${formatBRL(en.valorTotal)}\n` +
      `   Escritório: ${formatBRL(en.valorEscritorio)} | Cliente: ${formatBRL(en.valorCliente)} | Dr. Flávio: ${formatBRL(en.valorFlavio)} | Dr. Bruno (honorários): ${formatBRL(en.valorBruno)}` +
      (en.valorParceiro > 0 ? `\n   Parceiro(a)${en.parceiroNome ? " " + en.parceiroNome : ""}: ${formatBRL(en.valorParceiro)} (já descontado do escritório)` : "") +
      (en._pend ? `\n   ATENÇÃO — pendente: ${en._pend}` : "") +
      (en.obs ? `\n   Obs: ${en.obs}` : "")
    )).join("\n\n");
    return (
      `RELATÓRIO DE LEVANTAMENTO DE RPV — REZENDE MAIA ADVOCACIA\n` +
      `Gerado em ${formatDateBR(todayISO())} · Período: ${periodoLabel}\n` +
      `${lista.length} levantamento(s)\n\n${linhas || "(nenhum registro selecionado)"}\n\n————————————————————\nTOTAIS\n` +
      `Valor total levantado: ${formatBRL(totals.total)}\n` +
      (totals.destaque > 0 ? `   • RPV/Precatório (principal): ${formatBRL(totals.principal)}\n   • Destaque de honorários: ${formatBRL(totals.destaque)}\n` : "") +
      `Escritório: ${formatBRL(totals.escritorio)}\nCliente: ${formatBRL(totals.cliente)}\n` +
      `Dr. Flávio: ${formatBRL(totals.flavio)}\nDr. Bruno (honorários): ${formatBRL(totals.bruno)}` +
      (totals.parceiro > 0 ? `\nParceiros(as) — comissões (já descontadas do escritório): ${formatBRL(totals.parceiro)}` : "")
    );
  }

  async function copyReport() {
    const text = reportText();
    try {
      await navigator.clipboard.writeText(text);
      const ids = lista.filter((en) => !en.enviado).map((en) => en.id);
      if (ids.length > 0) await onMarkSent(ids, `Relatório copiado. ${ids.length} registro(s) movido(s) para o Histórico.`);
      else showToast("Relatório copiado. Cole no WhatsApp ou e-mail para o financeiro e Dr. Flávio.");
    }
    catch (e) { showToast("Não copiou automaticamente — selecione o texto do relatório manualmente.", "error"); setShowPreview(true); }
  }
  async function emitirPdf() {
    const ok = await onGeneratePDF(listaP, totals, periodoLabel);
    const ids = lista.filter((en) => !en.enviado).map((en) => en.id);
    if (ok && ids.length > 0) await onMarkSent(ids, `Relatório emitido. ${ids.length} registro(s) movido(s) para o Histórico.`);
  }
  function toggleSelect(id) { setSelecionados((prev) => { const next = new Set(prev); if (next.has(id)) next.delete(id); else next.add(id); return next; }); }

  return (
    <div>
      <div style={cardStyle}>
        <span style={sectionLabelStyle}>Filtros</span>
        <div style={gridTwo}>
          <Field label="De"><TextInput type="date" value={dataInicio} onChange={(e) => setDataInicio(e.target.value)} /></Field>
          <Field label="Até"><TextInput type="date" value={dataFim} onChange={(e) => setDataFim(e.target.value)} /></Field>
        </div>
        <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
          <input type="checkbox" checked={apenasPendentes} onChange={(e) => setApenasPendentes(e.target.checked)} style={{ width: 16, height: 16, accentColor: C.brass }} />
          <span style={{ fontFamily: FONT_SANS, fontSize: 13, color: C.ink }}>Ocultar os já emitidos em relatório (ficam no Histórico)</span>
        </label>
      </div>

      {filtrados.length === 0 ? (
        <EmptyState title="Nada pendente de relatório" text="Os levantamentos já emitidos em relatório ficam no Histórico. Desmarque “Ocultar os já emitidos” para vê-los aqui." />
      ) : (
        <React.Fragment>
          <div style={cardStyle}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <span style={{ ...sectionLabelStyle, marginBottom: 0 }}>Registros incluídos</span>
              <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: C.inkSoft }}>{selecionados.size}/{filtrados.length}</span>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {filtrados.map((en) => (
                <label key={en.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", borderRadius: 8, cursor: "pointer", backgroundColor: selecionados.has(en.id) ? C.brassSoft : C.parchmentDark }}>
                  <input type="checkbox" checked={selecionados.has(en.id)} onChange={() => toggleSelect(en.id)} style={{ width: 15, height: 15, accentColor: C.brass, flexShrink: 0 }} />
                  <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.ink, flex: 1, minWidth: 0 }}>{en.cliente} <span style={{ color: C.inkSoft }}>· {formatDateBR(en.dataLevantamento)}</span></span>
                  <span style={{ fontFamily: FONT_MONO, fontSize: 12.5, fontWeight: 700, color: C.ink }}>{formatBRL(en.valorTotal)}</span>
                </label>
              ))}
            </div>
          </div>

          <div style={{ ...cardStyle, backgroundColor: C.ink }}>
            <span style={{ fontFamily: FONT_SERIF, fontSize: 12, fontWeight: 700, color: C.brassSoft, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 10, display: "block" }}>Totais do relatório</span>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              <TotalRow label="Valor total levantado" value={totals.total} strong />
              {totals.destaque > 0 && <TotalRow label="· RPV/Precatório (principal)" value={totals.principal} />}
              {totals.destaque > 0 && <TotalRow label="· Destaque de honorários" value={totals.destaque} />}
              <TotalRow label={totals.parceiro > 0 ? "Escritório (líquido)" : "Escritório"} value={totals.escritorio} />
              <TotalRow label="Cliente" value={totals.cliente} />
              <TotalRow label="Dr. Flávio" value={totals.flavio} />
              <TotalRow label="Dr. Bruno (honorários)" value={totals.bruno} />
              {totals.parceiro > 0 && <TotalRow label="Parceiros(as) — comissões" value={totals.parceiro} />}
            </div>
          </div>

          <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
            <button onClick={copyReport} disabled={lista.length === 0} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: C.ink, color: "#fff", fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, padding: 13, borderRadius: 10, border: "none", cursor: lista.length === 0 ? "default" : "pointer", opacity: lista.length === 0 ? 0.5 : 1 }}>
              <Icon name="copy" size={15} /> Copiar texto
            </button>
            <button onClick={emitirPdf} disabled={lista.length === 0 || pdfBusy} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, padding: 13, borderRadius: 10, border: `1.5px solid ${C.rule}`, cursor: (lista.length === 0 || pdfBusy) ? "default" : "pointer", opacity: (lista.length === 0 || pdfBusy) ? 0.5 : 1 }}>
              {pdfBusy ? <Spinner size={15} color={C.ink} /> : <Icon name="printer" size={15} />} {pdfBusy ? "Gerando..." : "Baixar PDF"}
            </button>
          </div>

          <button onClick={() => setShowPreview((s) => !s)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 4, marginBottom: 12, fontFamily: FONT_SANS, fontSize: 12, color: C.inkSoft, background: "none", border: "none", cursor: "pointer" }}>
            {showPreview ? "Ocultar" : "Ver"} texto do relatório <Icon name={showPreview ? "chevronUp" : "chevronDown"} size={14} />
          </button>

          {lista.length > 0 && !lista.every((en) => en.enviado) && (
            <button onClick={() => onMarkSent(lista.map((en) => en.id))} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 16, backgroundColor: C.greenSoft, border: `1.5px solid ${C.green}`, color: C.green, fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, padding: 12, borderRadius: 10, cursor: "pointer" }}>
              <Icon name="check" size={15} /> Marcar selecionados como enviados
            </button>
          )}

          {showPreview && (
            <div style={{ backgroundColor: "#fff", border: `1px solid ${C.ruleSoft}`, borderRadius: 10, padding: 14, marginBottom: 20 }}>
              <pre style={{ fontFamily: FONT_MONO, fontSize: 11.5, color: C.ink, whiteSpace: "pre-wrap", wordBreak: "break-word", margin: 0, lineHeight: 1.5 }}>{reportText()}</pre>
            </div>
          )}
        </React.Fragment>
      )}

      <div style={cardStyle}>
        <span style={sectionLabelStyle}>Backup</span>
        <p style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.inkSoft, lineHeight: 1.5, marginBottom: 12 }}>
          Baixa um arquivo com todos os clientes e levantamentos cadastrados (inclusive fotos e PDFs de comprovante). Guarde essa cópia no computador, Google Drive ou onde preferir, como segurança extra.
        </p>
        <button
          onClick={onBackup}
          disabled={pdfBusy}
          style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, backgroundColor: "#fff", color: C.ink, fontFamily: FONT_SANS, fontSize: 13.5, fontWeight: 700, padding: 13, borderRadius: 10, border: `1.5px solid ${C.rule}`, cursor: pdfBusy ? "default" : "pointer", opacity: pdfBusy ? 0.6 : 1 }}
        >
          {pdfBusy ? <Spinner size={15} color={C.ink} /> : <Icon name="clipboard" size={15} />} {pdfBusy ? "Gerando..." : "Baixar backup completo"}
        </button>
      </div>
    </div>
  );
}
function TotalRow({ label, value, strong }) {

// ---------- PDF generation (real PDF file — works identically on iPhone, iPad and computer) ----------
const PDF_INK = [31, 44, 61];
const PDF_BRASS = [124, 97, 31];
const PDF_SOFT = [90, 107, 125];
const PDF_BRASS_BG = [241, 230, 200];

function pdfHeader(doc, subtitle) {
  doc.setFont("times", "bold");
  doc.setFontSize(10);
  doc.setTextColor(...PDF_BRASS);
  doc.text("REZENDE MAIA ADVOCACIA", 40, 46);
  doc.setFontSize(17);
  doc.setTextColor(...PDF_INK);
  doc.text(subtitle, 40, 66);
  doc.setDrawColor(...PDF_INK);
  doc.setLineWidth(1);
  doc.line(40, 76, 555, 76);
  return 100;
}
function pdfFooter(doc) {
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(138, 147, 160);
    doc.text(`Documento interno gerado pelo Controle de RPV — Rezende Maia Advocacia em ${nowLabel()}.`, 40, 810);
  }
}
function pdfInfoTable(doc, y, rows) {
  doc.autoTable({
    startY: y,
    body: rows,
    theme: "plain",
    styles: { font: "helvetica", fontSize: 10, cellPadding: 3, textColor: PDF_INK },
    columnStyles: { 0: { fontStyle: "bold", textColor: PDF_SOFT, cellWidth: 140 } },
    margin: { left: 40, right: 40 },
  });
  return doc.lastAutoTable.finalY + 14;
}

function buildSinglePdfBlob(entry, cliente, photo) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });
  let y = pdfHeader(doc, "Comprovante de Levantamento de RPV");

  const clientRows = [["Cliente", entry.cliente]];
  if (cliente && cliente.cpf) clientRows.push(["CPF", cliente.cpf]);
  if (cliente && cliente.numeroBeneficio) clientRows.push(["Nº do benefício", cliente.numeroBeneficio]);
  clientRows.push(["Nº do processo", entry.processo]);
  clientRows.push(["Dono do cliente", entry.donoCliente === "Flávio" ? "Dr. Flávio" : "Dr. Bruno"]);
  y = pdfInfoTable(doc, y, clientRows);

  const levRows = [
    ["Banco", BANCOS[entry.banco] ? BANCOS[entry.banco].label : entry.banco],
    ["Data do levantamento", formatDateBR(entry.dataLevantamento)],
    ["Responsável", entry.responsavel],
    ["Valor total levantado", formatBRL(entry.valorTotal)],
  ];
  if (entry.sucumbencial) levRows.push(["Natureza", "Honorários sucumbenciais (100% do dono do cliente)"]);
  if (tipoLevLabel(entry)) {
    levRows.push(["Tipo de levantamento", tipoLevLabel(entry)]);
    if (entry.valorPrincipal > 0) levRows.push([`Levantado — ${reqLabel(entry.tipoRequisicao)} (principal)`, formatBRL(entry.valorPrincipal)]);
    if (entry.valorDestaque > 0) levRows.push(["Levantado — destaque de honorários", formatBRL(entry.valorDestaque)]);
  }
  if (entry.valorExcedenteCliente > 0) levRows.push(["Honorários descontados do cliente (excedente do destaque)", formatBRL(entry.valorExcedenteCliente)]);
  if (entry._pend) levRows.push(["Pendente", entry._pend]);
  y = pdfInfoTable(doc, y, levRows);

  doc.setFont("times", "bold");
  doc.setFontSize(11);
  doc.setTextColor(...PDF_BRASS);
  doc.text("RATEIO", 40, y);
  y += 6;
  const rateioBody = [
    [entry.valorParceiro > 0 ? "Escritório (líquido, após comissão)" : "Escritório", formatBRL(entry.valorEscritorio)],
    ["Cliente", formatBRL(entry.valorCliente)],
    ["Dr. Flávio", formatBRL(entry.valorFlavio)],
    ["Dr. Bruno (honorários)", formatBRL(entry.valorBruno)],
  ];
  if (entry.valorParceiro > 0) rateioBody.push([`Parceiro(a)${entry.parceiroNome ? " — " + entry.parceiroNome : ""} (comissão paga pelo escritório)`, formatBRL(entry.valorParceiro)]);
  doc.autoTable({
    startY: y,
    head: [["Destinatário", "Valor"]],
    body: rateioBody,
    styles: { font: "helvetica", fontSize: 10, cellPadding: 6, textColor: PDF_INK },
    headStyles: { fillColor: PDF_BRASS_BG, textColor: PDF_BRASS, fontStyle: "bold" },
    columnStyles: { 1: { halign: "right" } },
    margin: { left: 40, right: 40 },
  });
  y = doc.lastAutoTable.finalY + 18;

  if (entry.obs) {
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...PDF_SOFT);
    doc.text("OBSERVAÇÕES", 40, y); y += 14;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...PDF_INK);
    const lines = doc.splitTextToSize(entry.obs, 500);
    doc.text(lines, 40, y); y += lines.length * 13 + 10;
  }

  if (photo && !isPdfDataUrl(photo)) {
    try {
      if (y > 620) { doc.addPage(); y = 60; }
      const props = doc.getImageProperties(photo);
      const w = 240;
      const h = (props.height / props.width) * w;
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...PDF_SOFT);
      doc.text("COMPROVANTE EMITIDO PELO BANCO", 40, y); y += 12;
      doc.addImage(photo, "JPEG", 40, y, w, h);
    } catch (e) { /* imagem inválida — ignora silenciosamente */ }
  } else if (photo && isPdfDataUrl(photo)) {
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(...PDF_SOFT);
    doc.text("COMPROVANTE EMITIDO PELO BANCO", 40, y); y += 14;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...PDF_INK);
    doc.text("Anexado em arquivo PDF separado.", 40, y);
  }

  pdfFooter(doc);
  return doc.output("blob");
}

function buildBatchPdfBlob(list, totals, periodoLabel) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4", orientation: "landscape" });
  let y = pdfHeader(doc, "Relatório de Levantamento de RPV");

  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...PDF_SOFT);

async function shareFiles(items, showToast) {
  // items: [{ blob, filename, type? }, ...]
  try {
    const files = items.map((it) => new File([it.blob], it.filename, { type: it.type || "application/pdf" }));
    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: items[0].filename });
      return true;
    }
  } catch (err) {
    if (err && err.name === "AbortError") return false; // usuário cancelou o compartilhamento
    // se o compartilhamento falhar por outro motivo, cai no download abaixo
  }
  let anyFailed = false;
  for (const it of items) {
    try {
      const url = URL.createObjectURL(it.blob);
      const a = document.createElement("a");
      a.href = url; a.download = it.filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (err) {
      anyFailed = true;
    }
  }
  if (showToast) {
    showToast(anyFailed ? "Não foi possível gerar o PDF neste navegador." : "Arquivo(s) baixado(s). Verifique a pasta de downloads ou o app Arquivos.", anyFailed ? "error" : "success");
  }
  return !anyFailed;
}
async function sharePdfBlob(blob, filename, showToast) {
  return shareFiles([{ blob, filename }], showToast);
}
