// ---------- Helpers ----------
function todayISO() { return new Date().toISOString().slice(0, 10); }

}
function formatDateBR(iso) {
  if (!iso) return "—";
  const parts = iso.split("-");
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}/${m}/${y}`;
}
function formatBRL(v) {

}
function formatPct(v) {

}
function parseNum(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function newId(prefix) { return (prefix || "id") + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8); }
function maskCPF(value) {
  const digits = String(value).replace(/\D/g, "").slice(0, 11);
  if (digits.length > 9) return digits.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, "$1.$2.$3-$4");
  if (digits.length > 6) return digits.replace(/(\d{3})(\d{3})(\d{1,3})/, "$1.$2.$3");
  if (digits.length > 3) return digits.replace(/(\d{3})(\d{1,3})/, "$1.$2");
  return digits;
}
function compressImage(file, maxW = 1000, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Falha ao ler arquivo"));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Falha ao carregar imagem"));
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let q = quality;
        let dataUrl = canvas.toDataURL("image/jpeg", q);
        let tries = 0;
        while (dataUrl.length > 700000 && tries < 6) {
          q = Math.max(0.3, q - 0.12);
          dataUrl = canvas.toDataURL("image/jpeg", q);
          tries++;
        }
        resolve(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Falha ao ler arquivo"));
    reader.onload = (e) => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}
function isPdfDataUrl(url) {
  return typeof url === "string" && url.indexOf("data:application/pdf") === 0;
}
function dataUrlToBlob(dataUrl) {
  const [meta, base64] = dataUrl.split(",");
  const mimeMatch = meta.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : "application/octet-stream";
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}
const MAX_PDF_BYTES = 700 * 1024;

const BANCOS = {
  CEF: { label: "Caixa Econômica Federal", short: "CEF", color: C.cef, accent: C.cefAccent },
  BB: { label: "Banco do Brasil", short: "BB", color: C.bb, accent: C.bbAccent },
};
const DONOS = { Bruno: { label: "Dr. Bruno" }, "Flávio": { label: "Dr. Flávio" } };

// Quanto do administrativo o cliente já pagou por fora (aceita o formato antigo: caixa marcada = pago por inteiro).
function adminPagoDe(cliente) {
  const adm = Math.max(0, Number(cliente.valorAdministrativo) || 0);
  const v = Math.max(0, Number(cliente.administrativoPagoValor) || 0);
  if (v > 0) return Math.min(v, adm);
  return cliente.administrativoPago ? adm : 0;
}
// Limite do administrativo: honorários + administrativo cobrados do cliente não passam de 50% do valor total da requisição.
const LIMITE_DESCONTO_CLIENTE = 0.5;

// Saque único (cliente SEM destaque de honorários): honorário = % de êxito sobre o valor levantado.
function computeSplit({ valorTotal, percentualExito, dono, sucumbencial, valorAdministrativo, administrativoJaPago, valorGastos, parceiroTipo, parceiroValor, parceiroJaPago }) {
  const total = Number(valorTotal) || 0;
  const donoIsBruno = dono === "Bruno";
  if (sucumbencial) {
    return { escritorio: 0, cliente: 0, flavio: donoIsBruno ? 0 : total, bruno: donoIsBruno ? total : 0, honorarioTotal: total, baseDivisivel: 0, excedente: total, administrativoAplicado: 0, administrativoPendente: 0, gastosAplicado: 0, comissaoParceiro: 0, baseComissao: 0, excedenteCliente: 0 };
  }
  const pct = (Number(percentualExito) || 0) / 100;
  const honorarioTotal = total * pct;
  const baseDivisivel = Math.min(honorarioTotal, total * 0.3);
  const excedente = Math.max(0, honorarioTotal - baseDivisivel);
  return fecharRateio({
    dono, honorarioTotal, baseDivisivel, excedente,
    honorarioPartes: { escritorio: baseDivisivel * 0.4, donoShare: baseDivisivel * 0.5 + excedente, outroShare: baseDivisivel * 0.1 },
    saldoCliente: Math.max(0, total - honorarioTotal), tetoAdministrativo: Math.max(0, total * LIMITE_DESCONTO_CLIENTE - honorarioTotal),
    valorAdministrativo, administrativoJaPago, valorGastos, parceiroTipo, parceiroValor, parceiroJaPago, excedenteCliente: 0,
  });
}

// Passo comum: administrativo (com teto de 50%), gastos, cliente e comissão do parceiro.
function fecharRateio({ dono, honorarioTotal, baseDivisivel, excedente, honorarioPartes, saldoCliente, tetoAdministrativo, valorAdministrativo, administrativoJaPago, valorGastos, parceiroTipo, parceiroValor, parceiroJaPago, excedenteCliente }) {
  const donoIsBruno = dono === "Bruno";
  let escritorio = honorarioPartes.escritorio;
  let donoShare = honorarioPartes.donoShare;
  const outroShare = honorarioPartes.outroShare;
  let restante = saldoCliente;

  // Valor administrativo: debitado do cliente só até o teto (50% do total menos os honorários) e só se ainda não foi pago.
  // Vai integralmente para o escritório (cliente do Bruno) ou para o Dr. Flávio (cliente dele).
  // O que passar do teto NÃO é debitado: fica pendente para cobrança por outro meio (cartão, boleto, nota promissória).
  // A parte que o cliente já pagou por fora não entra no cálculo nem no limite de 50%: só o que falta pagar.
  const admBruto = Math.max(0, Number(valorAdministrativo) || 0);
  const administrativoPagoValor = Math.min(admBruto, Math.max(0, Number(administrativoJaPago) || 0));
  const admDevido = admBruto - administrativoPagoValor;
  const administrativoAplicado = Math.min(admDevido, Math.max(0, tetoAdministrativo), restante);
  const administrativoPendente = Math.max(0, admDevido - administrativoAplicado);
  if (donoIsBruno) escritorio += administrativoAplicado; else donoShare += administrativoAplicado;
  restante -= administrativoAplicado;

  // Gastos reembolsáveis: o escritório já adiantou; saem do cliente e voltam 100% ao escritório.
  const gastosAplicado = Math.min(Math.max(0, Number(valorGastos) || 0), restante);
  escritorio += gastosAplicado;
  restante -= gastosAplicado;

  // Comissão de parceiro(a): sai SEMPRE da parte do escritório, nunca do cliente.
  // Base do % = honorários do escritório + administrativo (se cliente do Bruno), sem os gastos reembolsáveis.
  const baseComissao = Math.max(0, escritorio - gastosAplicado);
  let pv = Math.max(0, Number(parceiroValor) || 0);
  if (parceiroTipo === "fixo") pv = Math.max(0, pv - Math.max(0, Number(parceiroJaPago) || 0));
  let comissaoParceiro = 0;
  if (pv > 0) {
    comissaoParceiro = parceiroTipo === "fixo" ? pv : baseComissao * (pv / 100);
    comissaoParceiro = Math.min(comissaoParceiro, escritorio);
  }
  escritorio -= comissaoParceiro;
  return {
    escritorio, cliente: restante, comissaoParceiro, baseComissao,
    flavio: donoIsBruno ? outroShare : donoShare,
    bruno: donoIsBruno ? donoShare : outroShare,
    honorarioTotal, baseDivisivel, excedente, administrativoAplicado, administrativoPendente, administrativoPagoValor, gastosAplicado, excedenteCliente,
  };
}

// Plano de honorários de um cliente COM destaque.
//  total (T)  = valor do cliente (sem destaque) + destaque
//  H          = % contratado × T
//  excedente cobrado do cliente (E) = H − destaque (se o destaque não cobrir tudo)
//  honorário final (Hf) = destaque + E
//  divisível = até 30% de T (50% dono / 40% escritório / 10% outro sócio); o que passar disso é todo do dono.
function planoDestaque(cliente, totalFallback) {
  const D = Math.max(0, Number(cliente.valorDestaque) || 0);
  const T = Number(cliente.valorEstimado) > 0 ? Number(cliente.valorEstimado) : (Number(totalFallback) || 0);
  const pct = (Number(cliente.percentualExito) || 0) / 100;
  const H = T * pct;
  const E = Math.max(0, H - D);
  const Hf = D + E;
  const B = Math.min(Hf, T * 0.3);
  const X = Math.max(0, Hf - B);
  const k = Hf > 0 ? 1 / Hf : 0;
  return {
    T, D, L: Math.max(0, T - D), pct, H, E, Hf, B, X,
    rEscr: 0.4 * B * k, rDono: (0.5 * B + X) * k, rOutro: 0.1 * B * k,
    tetoAdministrativo: Math.max(0, T * LIMITE_DESCONTO_CLIENTE - Hf),
    destaqueMaiorQueContrato: D > H + 0.005,
  };
}

// Cliente COM destaque: o saque pode ter duas partes independentes.
//  - destaque levantado (vD): é honorário; rateado nas proporções do plano.
//  - principal levantado (vP): primeiro sai o excedente contratado (E), depois administrativo (até o teto), gastos e o resto é do cliente.
function computeDestaque({ cliente, vPrincipal, vDestaque, parceiroJaPago }) {
  const vp = Math.max(0, Number(vPrincipal) || 0), vd = Math.max(0, Number(vDestaque) || 0);
  const plano = planoDestaque(cliente, vp + vd);
  const excedenteCliente = Math.min(plano.E, vp);
  const hon = vd + excedenteCliente; // honorário efetivamente recebido neste lançamento
  const r = fecharRateio({
    dono: cliente.dono, honorarioTotal: hon,
    baseDivisivel: hon * (plano.Hf > 0 ? plano.B / plano.Hf : 0), excedente: hon * (plano.Hf > 0 ? plano.X / plano.Hf : 0),
    honorarioPartes: { escritorio: hon * plano.rEscr, donoShare: hon * plano.rDono, outroShare: hon * plano.rOutro },
    saldoCliente: vp - excedenteCliente, tetoAdministrativo: plano.tetoAdministrativo,
    valorAdministrativo: vp > 0 ? cliente.valorAdministrativo : 0, administrativoJaPago: adminPagoDe(cliente),
    valorGastos: vp > 0 ? cliente.gastosReembolsaveis : 0,
    parceiroTipo: cliente.parceiroTipo, parceiroValor: cliente.parceiroNome ? cliente.parceiroValor : 0, parceiroJaPago,
    excedenteCliente,
  });
  r.plano = plano;
  return r;
}

function computeLevantamento({ cliente, vPrincipal, vDestaque, sucumbencial, parceiroJaPago }) {
  const vp = Number(vPrincipal) || 0, vd = Number(vDestaque) || 0;
  if (!cliente.temDestaque || sucumbencial) {
    return computeSplit({
      valorTotal: vp + vd, percentualExito: cliente.percentualExito, dono: cliente.dono, sucumbencial: !!sucumbencial,
      valorAdministrativo: cliente.valorAdministrativo, administrativoJaPago: adminPagoDe(cliente), valorGastos: cliente.gastosReembolsaveis,
      parceiroTipo: cliente.parceiroTipo, parceiroValor: cliente.parceiroNome ? cliente.parceiroValor : 0, parceiroJaPago,
    });
  }
  return computeDestaque({ cliente, vPrincipal: vp, vDestaque: vd, parceiroJaPago });
}

// Quanto da comissão fixa do parceiro já foi paga em outros levantamentos do mesmo cliente.
function parceiroJaPagoDe(entries, clienteId, ignorarId) {
  if (!clienteId) return 0;
  return entries.filter((e) => e.clienteId === clienteId && e.id !== ignorarId).reduce((a, e) => a + (e.valorParceiro || 0), 0);
}

// O que já foi levantado de cada parte da requisição de um cliente.
function statusLevantamento(cliente, entries) {
  const meus = entries.filter((e) => e.clienteId === cliente.id && !e.sucumbencial);
  let principal = 0, destaque = 0, qtd = 0;
  meus.forEach((e) => {
    qtd++;
    if (e.tipoLevantamento && e.tipoLevantamento !== "completo") { principal += e.valorPrincipal || 0; destaque += e.valorDestaque || 0; }
    else principal += e.valorTotal || 0;
  });
  return { principal, destaque, qtd, principalFeito: principal > 0, destaqueFeito: destaque > 0 };
}
function reqLabel(tipo) { return tipo === "Precatório" ? "Precatório" : tipo === "RPV" ? "RPV" : "RPV/Precatório"; }
function tipoLevLabel(en) {
  const r = reqLabel(en.tipoRequisicao);

  if (en.tipoLevantamento === "principal") return `Somente ${r} (principal)`;
  if (en.tipoLevantamento === "ambos") return `${r} + destaque de honorários`;
  return null;
}
function tipoLevCurto(en) {
  if (en.tipoLevantamento === "destaque") return "Destaque";
  if (en.tipoLevantamento === "principal") return "Principal";
  if (en.tipoLevantamento === "ambos") return "Principal + destaque";
  return reqLabel(en.tipoRequisicao);
}
// Texto de pendência: parte da requisição ainda não levantada + administrativo que não coube no desconto do RPV.
function pendenciaTexto(entry, cliente, entries) {
  const partes = [];
  if (cliente && cliente.temDestaque && !entry.sucumbencial && (entry.tipoLevantamento === "principal" || entry.tipoLevantamento === "destaque")) {
    const st = statusLevantamento(cliente, entries);
    const r = reqLabel(cliente.tipoRequisicao);
    if (entry.tipoLevantamento === "principal" && !st.destaqueFeito) partes.push(`destaque de honorários${cliente.valorDestaque > 0 ? ` (previsto ${formatBRL(cliente.valorDestaque)})` : ""} ainda não levantado`);
    if (entry.tipoLevantamento === "destaque" && !st.principalFeito) {
      const liq = Math.max(0, (cliente.valorEstimado || 0) - (cliente.valorDestaque || 0));
      partes.push(`${r} (principal${liq > 0 ? `, previsto ${formatBRL(liq)}` : ""}) ainda não levantado`);
    }
  }
  if (entry.administrativoPendente > 0) partes.push(`valor administrativo de ${formatBRL(entry.administrativoPendente)} não coube no desconto do RPV (limite de 50%) e precisa ser confirmado por outro meio (cartão, boleto ou nota promissória)`);
  return partes.join("; ");
}
function administrativoDestino(dono) { return dono === "Flávio" ? "Dr. Flávio (integral)" : "Escritório (integral)"; }

const ESPECIES_BENEFICIO = [
  "Aposentadoria por incapacidade permanente", "Auxílio por incapacidade temporária", "Auxílio-acidente",
  "Aposentadoria por idade rural", "Aposentadoria por idade", "Salário-maternidade", "Pensão por morte",

];

const PC_CIDADE_PADRAO = "Presidente Tancredo Neves/BA";
const PC_MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

function dataUrlToBytes(dataUrl) {
  const comma = dataUrl.indexOf(",");
  const meta = dataUrl.slice(0, comma);
  const bin = atob(dataUrl.slice(comma + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const m = meta.match(/data:([^;]+)/);
  return { bytes, mime: m ? m[1] : "application/octet-stream" };
}
function loadPdfLib() {
  if (window.PDFLib) return Promise.resolve(window.PDFLib);
  if (loadPdfLib._p) return loadPdfLib._p;
  loadPdfLib._p = new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = "https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js";
    sc.onload = () => { if (window.PDFLib) resolve(window.PDFLib); else { loadPdfLib._p = null; reject(new Error("o gerador de PDF não carregou")); } };
    sc.onerror = () => { loadPdfLib._p = null; reject(new Error("sem internet para carregar o gerador de PDF")); };
    document.head.appendChild(sc);
  });
  return loadPdfLib._p;
}
// Lê o arquivo de um anexo: da memória (recém-escolhido), do levantamento ou da coleção "anexos".
async function resolverAnexo(item, entries) {
  if (item.dataUrl) return dataUrlToBytes(item.dataUrl);
  if (item.entryId) {
    const en = (entries || []).find((e) => e.id === item.entryId);
    if (en && en.foto) return dataUrlToBytes(en.foto);
    throw new Error("não achei o comprovante do levantamento de " + (item.nome || ""));
  }
  if (item.id) {
    const snap = await db.collection("anexos").doc(item.id).get();
    if (snap.exists && snap.data().dataUrl) return dataUrlToBytes(snap.data().dataUrl);
    throw new Error(`não achei o arquivo "${item.nome || item.id}"`);
  }
  throw new Error("anexo sem conteúdo");
}
// Grava no Firestore os arquivos novos. Devolve os itens com "id" (mantendo o dataUrl em memória para montar o PDF).
async function guardarAnexos(items, clienteId, tipo) {
  const out = [];
  for (const it of items || []) {
    if (it.id && !it.dataUrl) { out.push({ id: it.id, nome: it.nome, mime: it.mime }); continue; }
    const id = it.id || newId("anx");
    await db.collection("anexos").doc(id).set({ id, clienteId, tipo, nome: it.nome, mime: it.mime, dataUrl: it.dataUrl, criadoEm: Date.now() });
    out.push({ id, nome: it.nome, mime: it.mime, dataUrl: it.dataUrl });
  }
  return out;
}
function semDataUrl(obj) { return JSON.parse(JSON.stringify(obj, (k, v) => (k === "dataUrl" ? undefined : v))); }
function round2(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function bancoPrep(b) { return b === "BB" ? "no Banco do Brasil" : "na Caixa Econômica Federal"; }

// Detalhe de um levantamento (quanto foi descontado do cliente em cada item).
function detDeSplit(s, vP, vD, cliente) {
  return {
    bruto: round2(vP), destaque: round2(vD),
    honorarios: round2(cliente.temDestaque ? (s.excedenteCliente || 0) : (s.honorarioTotal || 0)),
    administrativo: round2(s.administrativoAplicado || 0), gastos: round2(s.gastosAplicado || 0),
    admPendente: round2(s.administrativoPendente || 0),
  };
}
// Usa o detalhe gravado no levantamento; se for um levantamento antigo, refaz o cálculo e confere com o que foi gravado.
function detalheEntry(en, cliente, entries) {
  if (en.det) return en.det;
  if (!cliente) return null;
  const parcial = en.tipoLevantamento && en.tipoLevantamento !== "completo";
  const vP = parcial ? (en.valorPrincipal || 0) : (en.valorTotal || 0);
  const vD = parcial ? (en.valorDestaque || 0) : 0;
  const s = computeLevantamento({ cliente, vPrincipal: vP, vDestaque: vD, sucumbencial: false, parceiroJaPago: parceiroJaPagoDe(entries, cliente.id, en.id) });
  if (Math.abs(s.cliente - (en.valorCliente || 0)) > 0.01 || Math.abs(s.escritorio - (en.valorEscritorio || 0)) > 0.01) return null;
  return detDeSplit(s, vP, vD, cliente);
}

// Situação do cliente em cada etapa do fluxo (define em qual aba ele aparece).
function situacaoCliente(c, entries, prestacoes) {
  const st = statusLevantamento(c, entries);
  const sucPend = !!c.temSucumbencia && !entries.some((e) => e.clienteId === c.id && e.sucumbencial);
  const aguardandoLev = c.temDestaque ? !(st.principalFeito && st.destaqueFeito) : !st.principalFeito;
  const temPrestacao = (prestacoes || []).some((p) => p.clienteId === c.id);
  return { st, sucPend, aguardandoLev, pendenteLancar: aguardandoLev || sucPend, temPrestacao, prestacaoPendente: st.principalFeito && !temPrestacao };
}

function novoDraftPrestacao(cliente, entries) {
  const gastos = (entries || []).filter((e) => e.clienteId === cliente.id && !e.sucumbencial).reduce((a, e) => {
    const d = detalheEntry(e, cliente, entries); return a + (d ? d.gastos : 0);
  }, 0);
  return {
    especie: cliente.especieBeneficio || "", dataContrato: cliente.dataContrato || "",
    contrato: (cliente.contratoAnexos || []).map((a) => ({ ...a })),
    despesas: gastos > 0 ? [{ key: newId("dp"), descricao: "", data: "", valor: String(round2(gastos)), anexos: [] }] : [],
    outros: [],
    repasse: { data: todayISO(), forma: "PIX", valor: "", favorecido: cliente.nome + (cliente.cpf ? " — CPF " + cliente.cpf : ""), anexos: [] },
    cidadeUf: PC_CIDADE_PADRAO, dataDecl: todayISO(),
  };
}

// Monta os números da prestação e lista o que falta (informações e documentos).
function montarPrestacao({ cliente, entries, draft }) {
  const info = [], docs = [];
  const meus = entries.filter((e) => e.clienteId === cliente.id && !e.sucumbencial).sort((a, b) => (a.dataLevantamento || "").localeCompare(b.dataLevantamento || ""));

  if (!cliente.nome) info.push("Nome do cliente");
  if (!(cliente.cpf || "").trim()) info.push("CPF do cliente (cadastro do cliente)");
  if (!(cliente.processo || "").trim()) info.push("Nº do processo (cadastro do cliente)");
  if (!(draft.especie || "").trim()) info.push("Espécie do benefício");
  if (!draft.dataContrato) info.push("Data de assinatura do contrato de honorários");
  if (!(cliente.percentualExito > 0)) info.push("Percentual de êxito do contrato (cadastro do cliente)");

  let bruto = 0, hon = 0, adm = 0, gast = 0, dest = 0, admPend = 0;
  const levs = [];
  meus.forEach((en) => {
    const det = detalheEntry(en, cliente, entries);
    const rotulo = `${formatDateBR(en.dataLevantamento)} (${formatBRL(en.valorTotal)})`;
    if (!det) { info.push(`Levantamento de ${rotulo}: não consegui detalhar os descontos (foi lançado com rateio manual ou antes desta função). Abra em Histórico → Levantamentos → Editar, toque em "Usar cálculo automático" e salve de novo`); return; }
    if (Math.abs(det.bruto - det.honorarios - det.administrativo - det.gastos - (en.valorCliente || 0)) > 0.02) {
      info.push(`Levantamento de ${rotulo}: os descontos não batem com o valor do cliente. Abra em Histórico → Levantamentos → Editar, toque em "Usar cálculo automático" e salve de novo`); return;
    }
    bruto += det.bruto; hon += det.honorarios; adm += det.administrativo; gast += det.gastos; dest += det.destaque || 0; admPend += det.admPendente || 0;
    levs.push({ en, det });
  });
  const levsCliente = levs.filter((l) => l.det.bruto > 0);
  if (levsCliente.length === 0 && meus.length === levs.length) info.push("Levantamento do valor do cliente (nenhum foi lançado ainda)");

  // Outros descontos
  const outros = (draft.outros || []).filter((o) => (o.descricao || "").trim() || parseNum(o.valor) > 0);
  outros.forEach((o, i) => {
    if (!(o.descricao || "").trim()) info.push(`Outros descontos, item ${i + 1}: descreva o desconto`);
    if (!(parseNum(o.valor) > 0)) info.push(`Outros descontos, item ${i + 1}: informe o valor`);
  });
  const outrosTotal = round2(outros.reduce((a, o) => a + parseNum(o.valor), 0));

  // Despesas reembolsáveis
  const desp = (draft.despesas || []).filter((d) => (d.descricao || "").trim() || parseNum(d.valor) > 0 || d.data || (d.anexos || []).length > 0);
  desp.forEach((d, i) => {
    const nome = (d.descricao || "").trim() || `item ${i + 1}`;
    if (!(d.descricao || "").trim()) info.push(`Despesa ${i + 1}: descreva a despesa`);
    if (!d.data) info.push(`Despesa "${nome}": informe a data`);
    if (!(parseNum(d.valor) > 0)) info.push(`Despesa "${nome}": informe o valor`);
    if ((d.anexos || []).length === 0) docs.push(`Comprovante da despesa "${nome}"`);
  });
  const despTotal = round2(desp.reduce((a, d) => a + parseNum(d.valor), 0));
  if (gast > 0 && desp.length === 0) info.push(`Despesas reembolsáveis: foram descontados ${formatBRL(gast)} do cliente — liste as despesas com valor, data e comprovante`);
  else if (Math.abs(despTotal - gast) > 0.01) info.push(`As despesas listadas somam ${formatBRL(despTotal)}, mas o valor de gastos reembolsáveis descontado do cliente foi ${formatBRL(gast)}. Ajuste os itens (ou o campo "Gastos reembolsáveis" no cadastro do cliente)`);

  const liquido = round2(bruto - hon - adm - gast - outrosTotal);
  if (liquido < 0) info.push("O valor líquido ficou negativo: confira os descontos");

  // Repasse
  const rp = draft.repasse || {};
  const rpValor = round2(parseNum(rp.valor));
  if (!rp.data) info.push("Repasse: data da transferência ao cliente");
  if (!(rp.forma || "").trim()) info.push("Repasse: forma (PIX, TED...)");
  if (!(rp.favorecido || "").trim()) info.push("Repasse: favorecido (nome e CPF)");
  if (!(rpValor > 0)) info.push("Repasse: valor transferido ao cliente");
  else if (Math.abs(rpValor - liquido) > 0.01) info.push(`Repasse: o valor transferido (${formatBRL(rpValor)}) é diferente do líquido a repassar (${formatBRL(liquido)}) — saldo remanescente de ${formatBRL(round2(liquido - rpValor))}. Corrija o valor ou os descontos`);
  if ((rp.anexos || []).length === 0) docs.push("Comprovante do repasse (transferência) ao cliente");
  if (!(draft.cidadeUf || "").trim()) info.push("Cidade/UF da declaração");
  if (!draft.dataDecl) info.push("Data da declaração");

  // Documentos
  if ((draft.contrato || []).length === 0) docs.push("Contrato de honorários assinado");
  levsCliente.forEach((l) => { if (!l.en.foto) docs.push(`Comprovante do levantamento de ${formatDateBR(l.en.dataLevantamento)} (${BANCOS[l.en.banco] ? BANCOS[l.en.banco].short : l.en.banco}) — anexe em Histórico → Levantamentos → Editar`); });

  // Texto do levantamento (banco + data)
  const bancosDatas = [];
  levsCliente.forEach((l) => { const t = `${bancoPrep(l.en.banco)} em ${formatDateBR(l.en.dataLevantamento)}`; if (bancosDatas.indexOf(t) < 0) bancosDatas.push(t); });
  const pct = formatPct(cliente.percentualExito);

  const notas = [];
  if (cliente.temDestaque && dest + (cliente.valorDestaque || 0) > 0) {
    const pl = planoDestaque(cliente, 0);
    notas.push(`Honorários contratados: ${pct} de ${formatBRL(pl.T)} = ${formatBRL(pl.H)}. Desse total, ${formatBRL(Math.min(pl.D, pl.H))} foram destacados pelo juízo e levantados em separado (não saem do valor do cliente)${hon > 0 ? ` e ${formatBRL(hon)} foram descontados do valor do cliente` : ""}.`);
  }
  if (adminPagoDe(cliente) > 0) notas.push(`Do valor administrativo, ${formatBRL(adminPagoDe(cliente))} já tinham sido pagos pelo cliente e não foram descontados deste levantamento.`);
  if (admPend > 0) notas.push(`Valor administrativo de ${formatBRL(admPend)} não coube no desconto do RPV (limite de 50%) e será acertado em separado, por cartão, boleto ou nota promissória.`);

  const anexos = {
    contrato: (draft.contrato || []).map((a) => ({ ...a, legenda: "Contrato de honorários" })),
    levantamento: levs.filter((l) => l.en.foto).map((l) => ({ entryId: l.en.id, nome: `${BANCOS[l.en.banco] ? BANCOS[l.en.banco].short : l.en.banco} ${formatDateBR(l.en.dataLevantamento)}`, mime: isPdfDataUrl(l.en.foto) ? "application/pdf" : "image/jpeg", legenda: `Levantamento ${BANCOS[l.en.banco] ? BANCOS[l.en.banco].short : l.en.banco} em ${formatDateBR(l.en.dataLevantamento)}` })),
    despesas: [], repasse: (rp.anexos || []).map((a) => ({ ...a, legenda: "Comprovante do repasse ao cliente" })),
  };
  desp.forEach((d) => (d.anexos || []).forEach((a) => anexos.despesas.push({ ...a, legenda: (d.descricao || "").trim() || "Despesa" })));

  const dados = {
    cliente: {
      nome: cliente.nome, cpf: cliente.cpf || "", processo: cliente.processo || "", especie: (draft.especie || "").trim(),
      dataContrato: draft.dataContrato || "", contratoTexto: `${cliente.valorAdministrativo > 0 ? "fixo + " : "apenas "}${pct}`,
    },
    despesas: desp.map((d) => ({ descricao: (d.descricao || "").trim(), data: d.data || "", valor: round2(parseNum(d.valor)) })),
    despesasTotal: despTotal,
    resumo: {
      bruto: round2(bruto), levantamentoTexto: bancosDatas.join(" e "), administrativo: round2(adm), honorarios: round2(hon), pct,
      despesas: round2(gast), outros: outrosTotal, outrosItens: outros.map((o) => ({ descricao: (o.descricao || "").trim(), valor: round2(parseNum(o.valor)) })), liquido,
    },
    notas,
    repasse: { data: rp.data || "", forma: (rp.forma || "").trim(), favorecido: (rp.favorecido || "").trim(), valor: rpValor, saldo: round2(liquido - rpValor) },
    cidadeUf: (draft.cidadeUf || "").trim(), dataDecl: draft.dataDecl || "",
    anexos,
  };
  return { ok: info.length === 0 && docs.length === 0, info, docs, dados, levsCliente };
}

// ---------- Leitura do PDF do RPV / Precatório ----------
// 1) carrega o pdf.js só quando o botão é usado; 2) junta o texto por linhas; 3) procura os campos por rótulo.
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (loadPdfJs._p) return loadPdfJs._p;
  loadPdfJs._p = new Promise((resolve, reject) => {
    const sc = document.createElement("script");
    sc.src = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js";
    sc.onload = () => {
      if (!window.pdfjsLib) { loadPdfJs._p = null; return reject(new Error("pdf.js não carregou")); }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    sc.onerror = () => { loadPdfJs._p = null; reject(new Error("Sem internet para carregar o leitor de PDF")); };
    document.head.appendChild(sc);
  });
  return loadPdfJs._p;
}
async function readPdfText(file) {
  const pdfjs = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  const pages = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const content = await page.getTextContent();
    pages.push(textItemsToLines(content.items));
  }
  return pages.join("\n");
}
// Agrupa os pedaços de texto do PDF em linhas (mesma altura = mesma linha, da esquerda para a direita).
function textItemsToLines(items) {
  const rows = [];
  items.forEach((it) => {
    if (!it.str || !it.str.trim()) return;
    const y = Math.round(it.transform[5]);
    const x = it.transform[4];
    let row = rows.find((r) => Math.abs(r.y - y) <= 2);
    if (!row) { row = { y, parts: [] }; rows.push(row); }
    row.parts.push({ x, str: it.str });
  });
  rows.sort((a, b) => b.y - a.y);
  return rows.map((r) => r.parts.sort((a, b) => a.x - b.x).map((p) => p.str).join(" ").replace(/\s+/g, " ").trim()).join("\n");
}

const RE_CNJ = /\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}/;
const RE_CPF_LOOSE = /(?:^|\D)(\d{3})(\.?)(\d{3})(\.?)(\d{3})(-?)(\d{2})(?!\d)/;
const RE_MONEY = /(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})(?!\d)/;
function moneyToNumber(str) { return parseFloat(String(str).replace(/\./g, "").replace(",", ".")); }
function maskCpfStr(a, b, c, d) { return `${a}.${b}.${c}-${d}`; }

const RE_ADVOGADO = /advogad|procurador|patrono|\bOAB\b|defensor|sociedade de advogados|escrit[óo]rio/i;
const RE_NAO_PESSOA = /tribunal|justi[çc]a|poder judici|minist[ée]rio|instituto nacional|\bINSS\b|uni[ãa]o|fazenda|procuradoria|sociedade|advogados|\bltda\b|banco|caixa econ|\bvara\b|se[çc][ãa]o|subse[çc][ãa]o|ju[íi]zo|requisi[çc][ãa]o|precat[óo]rio|requisit|processo|benef[íi]cio|dados|valor|total|n[úu]mero|data |nome|cpf|cnpj|r\$/i;

// Valor em dinheiro depois de um rótulo: na mesma linha ou nas 2 linhas seguintes (se elas não trouxerem outro rótulo).
function moneyAfterLabel(lines, labels) {
  for (const lab of labels) {
    for (let i = 0; i < lines.length; i++) {
      const m = lab.exec(lines[i]);
      if (!m) continue;
      const rest = lines[i].slice(m.index + m[0].length);
      const same = rest.match(RE_MONEY);
      if (same) return moneyToNumber(same[1]);
      for (let k = 1; k <= 2 && i + k < lines.length; k++) {
        const ln = lines[i + k];
        const letters = ln.replace(/R\$|sim|n[ãa]o|valor|[\d.,%\s:\-]/gi, "");
        const mm = ln.match(RE_MONEY);
        if (mm && letters.length === 0) return moneyToNumber(mm[1]);
        if (letters.length > 0) break;
      }
    }
  }
  return null;
}
function cleanName(raw) {
  if (!raw) return "";
  let n = raw.split(/\bCPF\b|\bCNPJ\b|\d|\||R\$|\bOAB\b|Nascimento|Data /i)[0];
  n = n.replace(/[:\-–()]+$/g, "").replace(/\s+/g, " ").trim();
  if (n.length < 5 || n.split(" ").length < 2) return "";
  if (RE_NAO_PESSOA.test(n)) return "";
  if (/[^A-Za-zÀ-ÿ'´` .]/.test(n)) return "";
  return n;
}
function titleCaseName(n) {
  if (n !== n.toUpperCase()) return n;
  return n.toLowerCase().replace(/(^|\s)([a-zà-ú])/g, (m, a, b) => a + b.toUpperCase()).replace(/\b(Da|De|Do|Das|Dos|E)\b/g, (w) => w.toLowerCase());
}
// O nome/CPF desta linha é de advogado? Sim se a própria linha cita advogado/OAB, se a linha seguinte traz a OAB,
// ou (quando o rótulo é genérico, tipo "Nome:") se o título logo acima é "Advogado".
function contextoAdvogado(lines, i, forte) {
  if (RE_ADVOGADO.test(lines[i])) return true;
  if (i + 1 < lines.length && /\bOAB\b/i.test(lines[i + 1])) return true;
  if (!forte) {
    for (let k = Math.max(0, i - 2); k < i; k++) if (/^(?:Advogad|Procurador|Patrono|Defensor)/i.test(lines[k])) return true;
  }
  return false;
}

function extractRequisicao(textRaw) {
  const text = String(textRaw || "").replace(/\u00a0/g, " ").replace(/[ \t]+/g, " ");
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  const fields = {}; const found = [];
  function put(key, value, label) { if (value !== undefined && value !== null && value !== "" && !(typeof value === "number" && isNaN(value))) { fields[key] = value; found.push(label); } }

  // Tipo (RPV x Precatório): vence o termo que aparece primeiro no documento.
  const iRpv = text.search(/requisi[çc][ãa]o de pequeno valor|\bRPV\b/i);
  const iPrec = text.search(/precat[óo]rio/i);
  if (iRpv >= 0 || iPrec >= 0) {
    const tipo = iRpv >= 0 && (iPrec < 0 || iRpv < iPrec) ? "RPV" : "Precatório";
    put("tipoRequisicao", tipo, "Tipo (" + tipo + ")");
  }

  // Processo (CNJ): prefere o que vem depois de "Processo", senão o primeiro do documento.
  let proc = null;
  const mProc = text.match(new RegExp("Processo[^\\d\\n]{0,40}(" + RE_CNJ.source + ")", "i"));
  if (mProc) proc = mProc[1]; else { const m = text.match(RE_CNJ); if (m) proc = m[0]; }
  put("processo", proc, "Nº do processo");

  // Nº do ofício / requisição.
  const labelsReq = [
    /N[úu]mero (?:do|da|de) (?:Of[ií]cio(?: Requisit[óo]rio)?|Requisi[çc][ãa]o(?: de Pequeno Valor)?|RPV|Precat[óo]rio|Controle|Protocolo)\s*[:\-]?/i,
    /N[ºo°.]{1,2}\s*(?:do|da|de)?\s*(?:Of[ií]cio(?: Requisit[óo]rio)?|Requisi[çc][ãa]o|RPV|Precat[óo]rio)\s*[:\-]?/i,
    /(?:Of[ií]cio Requisit[óo]rio|Requisi[çc][ãa]o(?: de Pequeno Valor)?|Precat[óo]rio|RPV)\s*(?:N[ºo°.]{1,2}|n[úu]mero)\s*[:\-]?/i,
    /Of[ií]cio Requisit[óo]rio\s*[:\-]/i,
  ];
  let numReq = null;
  for (const lab of labelsReq) {
    for (let i = 0; i < lines.length && !numReq; i++) {
      const m = lab.exec(lines[i]);
      if (!m) continue;
      const cand = [lines[i].slice(m.index + m[0].length), lines[i + 1] || ""];
      for (const c of cand) {
        const v = c.match(/^\s*([\dA-Za-z][\dA-Za-z./\-]{3,})/);
        if (v && /\d/.test(v[1]) && v[1] !== proc && !/^(do|da|de|no|nº)$/i.test(v[1])) { numReq = v[1].replace(/[.\-/]+$/, ""); break; }
      }
    }
    if (numReq) break;
  }
  put("numeroRequisicao", numReq, "Nº do ofício/requisição");

  // Beneficiário: candidatos com rótulo; descarta quem está em contexto de advogado.
  const reRotuloNome = /^(?:Nome(?: d[oa](?:\(a\))? (?:benefici[áa]rio|credor|requerente|autor|exequente|favorecido|parte))?|Benefici[áa]rio(?:\(a\))?(?:\(s\))?|Requerente(?:\(s\))?|Credor(?:\(a\))?|Exequente|Parte Autora|Autor(?:\(a\))?|Favorecido(?:\(a\))?)\s*[:\-]?\s*(.*)$/i;
  const cands = [];
  lines.forEach((ln, i) => {
    const m = ln.match(reRotuloNome);
    if (m) {
      const forte = /^(?:Benefici|Requerente|Credor|Exequente|Parte Autora|Autor|Favorecido|Nome d)/i.test(ln);
      let nome = cleanName(m[1]);
      let linhaNome = i;
      if (!nome) {
        for (let k = 1; k <= 2 && !nome && i + k < lines.length; k++) { nome = cleanName(lines[i + k]); linhaNome = i + k; if (/^(?:Nome|CPF|CNPJ)\b/i.test(lines[i + k])) break; }
      }
      if (nome) cands.push({ nome, linha: linhaNome, forte, money: linhaNome !== i ? (lines[linhaNome].match(RE_MONEY) || [])[1] : undefined, adv: contextoAdvogado(lines, i, forte) || contextoAdvogado(lines, linhaNome, forte) });
    }
    // Nome em maiúsculas logo antes de um CPF na mesma linha (tabelas).
    const mt = ln.match(/^([A-ZÀ-Ú][A-ZÀ-Ú' ]{8,}?)\s+(?:CPF\s*[:\-]?\s*)?\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/);
    if (mt) { const nome = cleanName(mt[1]); if (nome) cands.push({ nome, linha: i, forte: false, money: (ln.match(RE_MONEY) || [])[1], adv: contextoAdvogado(lines, i, false) }); }
  });
  const ok = cands.filter((c) => !c.adv);
  const escolhido = ok.find((c) => c.forte) || ok[0] || null;
  if (escolhido) put("nome", titleCaseName(escolhido.nome), "Nome do beneficiário");

  // CPF: o mais próximo do nome escolhido (mesma linha ou até 5 linhas depois); senão o primeiro fora de contexto de advogado.
  const cpfs = [];
  lines.forEach((ln, i) => {
    const re = new RegExp(RE_CPF_LOOSE.source, "g"); let m;
    while ((m = re.exec(ln)) !== null) {
      // 11 dígitos soltos só valem se houver "CPF" na linha (evita pegar outros números).
      const mascarado = !!(m[2] || m[4] || m[6]);
      if (!mascarado && !/CPF/i.test(ln) && !(i > 0 && /CPF/i.test(lines[i - 1]))) continue;
      cpfs.push({ cpf: maskCpfStr(m[1], m[3], m[5], m[7]), linha: i, adv: /\bOAB\b|advogad/i.test(ln) });
    }
  });
  let cpf = null;
  if (escolhido) { const perto = cpfs.filter((c) => !c.adv && c.linha >= escolhido.linha && c.linha <= escolhido.linha + 5)[0]; if (perto) cpf = perto.cpf; }
  if (!cpf) { const livre = cpfs.filter((c) => !c.adv); if (livre.length) cpf = livre[0].cpf; }
  put("cpf", cpf, "CPF");

  // Valores.
  const destaque = moneyAfterLabel(lines, [
    /Honor[áa]rios (?:advocat[íi]cios )?contratuais(?: destacados)?/i, /Honor[áa]rios contratuais/i,
    /Destaque (?:de |dos |do )?(?:valor de )?honor[áa]rios(?: contratuais| advocat[íi]cios)?/i, /Valor destacado/i, /Honor[áa]rios destacados/i, /Destaque/i,
  ]);
  if (destaque && destaque > 0) { put("valorDestaque", destaque, "Destaque de honorários"); fields.temDestaque = true; }

  const liquido = moneyAfterLabel(lines, [
    /Valor l[íi]quido(?: do (?:benefici[áa]rio|credor|requerente))?/i, /Total l[íi]quido/i, /Principal l[íi]quido/i, /Valor a receber/i,
    /Valor do (?:benefici[áa]rio|credor|requerente|cliente)/i, /Total do (?:benefici[áa]rio|credor|requerente)/i,
  ]);
  const total = moneyAfterLabel(lines, [
    /Valor total (?:da |do )?(?:requisi[çc][ãa]o|requisitado|a ser pago|do precat[óo]rio|da RPV|geral)/i,
    /Total (?:requisitado|da requisi[çc][ãa]o|geral)/i, /Valor (?:global|requisitado)/i, /Valor total/i,
  ]);
  if (liquido) put("valorLiquido", liquido, "Valor do cliente");
  else if (total) { put("valorLiquido", total, "Valor do cliente (confira: veio do total do PDF)"); fields.valorLiquidoDoTotal = true; }
  else if (escolhido && escolhido.money) put("valorLiquido", moneyToNumber(escolhido.money), "Valor do cliente (confira)");
  if (total) fields.valorTotalPdf = total;

  const suc = moneyAfterLabel(lines, [/Honor[áa]rios (?:advocat[íi]cios )?(?:de )?sucumb[êe]ncia(?:is)?/i, /Sucumb[êe]ncia/i]);
  if (suc && suc > 0) { put("valorSucumbencial", suc, "Honorários sucumbenciais"); fields.temSucumbencia = true; }

  const banco = /Caixa Econ[ôo]mica/i.test(text) ? "CEF" : /Banco do Brasil/i.test(text) ? "BB" : null;
  if (banco) fields.bancoDepositario = banco;
  return { fields, found };
}

function StatusStamp({ enviado }) {

// ---------- Login ----------
function LoginScreen() {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [loading, setLoading] = useState(false);

  async function handleLogin(e) {
    e.preventDefault();
    setErro("");
    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), senha);
    } catch (err) {
      const msgs = {
        "auth/invalid-email": "E-mail inválido.",
        "auth/user-not-found": "Usuário não encontrado. Peça para o administrador criar seu acesso no Firebase.",
        "auth/wrong-password": "Senha incorreta.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/too-many-requests": "Muitas tentativas. Aguarde um momento e tente de novo.",
      };
      setErro(msgs[err.code] || "Não foi possível entrar. Confira o e-mail e a senha.");
    }
    setLoading(false);
  }

  return (
    <div style={{ minHeight: "100vh", backgroundColor: C.ink, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: FONT_SANS }}>
      <form onSubmit={handleLogin} style={{ width: "100%", maxWidth: 340 }}>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 26 }}>
          <LogoMark size={54} />
          <span style={{ fontFamily: FONT_SANS, fontSize: 11, fontWeight: 700, letterSpacing: "0.14em", textTransform: "uppercase", color: C.brassSoft, marginTop: 12 }}>Rezende Maia Advocacia</span>
          <h1 style={{ fontFamily: FONT_SERIF, fontSize: 22, color: "#fff", marginTop: 2 }}>Controle de RPV</h1>
        </div>
        <div style={{ backgroundColor: "#28394E", borderRadius: 12, padding: 18 }}>
          <Field label="E-mail">
            <TextInput type="email" autoCapitalize="none" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seuemail@exemplo.com" required />
          </Field>
          <Field label="Senha">
            <TextInput type="password" value={senha} onChange={(e) => setSenha(e.target.value)} placeholder="••••••••" required />
          </Field>
          {erro && (
            <div style={{ backgroundColor: C.redSoft, border: `1px solid ${C.red}`, borderRadius: 8, padding: "8px 10px", marginBottom: 10 }}>
              <span style={{ fontFamily: FONT_SANS, fontSize: 12.5, color: C.red }}>{erro}</span>
            </div>
          )}
          <button type="submit" disabled={loading} style={{ width: "100%", backgroundColor: C.brass, color: "#fff", fontFamily: FONT_SANS, fontSize: 15, fontWeight: 700, padding: "13px", borderRadius: 9, border: "none", cursor: loading ? "default" : "pointer", opacity: loading ? 0.75 : 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
            {loading && <Spinner size={16} />} Entrar
          </button>
        </div>
        <p style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: "#8A9AAC", textAlign: "center", marginTop: 14 }}>
          Acesso restrito à equipe do escritório. Contas são criadas pelo administrador no painel do Firebase.
        </p>
      </form>
    </div>
  );
}

// ---------- Fee breakdown preview ----------
function FeeBreakdown({ dono, percentualExito, valorEstimado, valorAdministrativo, administrativoPago, administrativoPagoValor, valorGastos, parceiroNome, parceiroTipo, parceiroValor, temDestaque, valorDestaque }) {
  const valor = parseNum(valorEstimado);
  const temParceiro = !!(parceiroNome && String(parceiroNome).trim());
  const destaqueNum = temDestaque ? Math.min(parseNum(valorDestaque), valor) : 0;
  const comDestaque = destaqueNum > 0;
  const clienteSim = { percentualExito, dono, valorAdministrativo: parseNum(valorAdministrativo), administrativoPago, administrativoPagoValor: parseNum(administrativoPagoValor), gastosReembolsaveis: valorGastos, parceiroTipo, parceiroNome: temParceiro ? parceiroNome : "", parceiroValor, temDestaque: comDestaque, valorDestaque: destaqueNum, valorEstimado: valor };
  const split = computeLevantamento({ cliente: clienteSim, vPrincipal: valor - destaqueNum, vDestaque: destaqueNum, sucumbencial: false, parceiroJaPago: 0 });
  const plano = comDestaque ? split.plano : null;
  const donoLabel = dono === "Flávio" ? "Dr. Flávio" : "Dr. Bruno";
  const outroLabel = dono === "Flávio" ? "Dr. Bruno" : "Dr. Flávio";
  const donoTotal = dono === "Flávio" ? split.flavio : split.bruno;
  const outroTotal = dono === "Flávio" ? split.bruno : split.flavio;
  const donoIsBrunoLocal = dono === "Bruno";
  return (
    <div style={{ backgroundColor: C.ink, borderRadius: 10, padding: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon name="scale" size={14} color={C.brassSoft} />
        <span style={{ fontFamily: FONT_SERIF, fontSize: 12, fontWeight: 700, color: C.brassSoft, textTransform: "uppercase", letterSpacing: "0.06em" }}>Como ficam os honorários</span>
      </div>
      {valor > 0 ? (
        <React.Fragment>
          {comDestaque && <BreakdownRow label="Valor total (cliente + destaque)" value={valor} />}
          <BreakdownRow label={`Honorário total (${formatPct(percentualExito)} de ${formatBRL(valor)})`} value={split.honorarioTotal} />
          {comDestaque && <BreakdownRow label="· já destacado pelo juízo" value={plano.D} />}
          {comDestaque && plano.E > 0 && <BreakdownRow label="· excedente descontado do cliente" value={plano.E} highlight />}
          <BreakdownRow label="Base divisível (até 30% do valor)" value={split.baseDivisivel} />
          {split.excedente > 0 && <BreakdownRow label={`Excedente — 100% ${donoLabel}`} value={split.excedente} highlight />}
          <div style={{ height: 1, backgroundColor: "rgba(241,230,200,0.2)", margin: "8px 0" }} />
          <BreakdownRow label={split.comissaoParceiro > 0 ? "Escritório (líquido, após comissão)" : "Escritório (40% do divisível)"} value={split.escritorio} bold />
          {split.comissaoParceiro > 0 && <BreakdownRow label={`Parceiro(a) ${String(parceiroNome).trim()} — sai do escritório`} value={split.comissaoParceiro} highlight />}
          <BreakdownRow label={`${donoLabel}, dono do cliente (50% + excedente)`} value={donoTotal} bold />
          <BreakdownRow label={`${outroLabel}, outro sócio (10% do divisível)`} value={outroTotal} bold />
          <BreakdownRow label="Cliente recebe" value={split.cliente} />
          {(split.administrativoAplicado > 0 || split.administrativoPendente > 0 || split.administrativoPagoValor > 0 || split.gastosAplicado > 0 || split.comissaoParceiro > 0 || (comDestaque && plano.destaqueMaiorQueContrato)) && (
            <div style={{ marginTop: 6 }}>
              {split.administrativoAplicado > 0 && (
                <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: "#B7C2CE", lineHeight: 1.5 }}>
                  Já inclui {formatBRL(split.administrativoAplicado)} de valor administrativo, descontado do cliente e somado {donoIsBrunoLocal ? "ao escritório" : `a ${donoLabel}`} acima.
                </div>
              )}
              {split.administrativoPagoValor > 0 && (
                <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: "#B7C2CE", lineHeight: 1.5, marginBottom: 4 }}>
                  Administrativo: {formatBRL(split.administrativoPagoValor)} já pagos pelo cliente (fora do cálculo e do limite de 50%).
                </div>
              )}
              {split.administrativoPendente > 0 && (
                <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.bbAccent, lineHeight: 1.5, marginTop: split.administrativoAplicado > 0 ? 4 : 0 }}>
                  Administrativo: só dá para descontar do RPV {formatBRL(split.administrativoAplicado)} (limite de 50% do total menos os honorários). Restam {formatBRL(split.administrativoPendente)} a confirmar por outro meio (cartão, boleto ou nota promissória).
                </div>
              )}
              {comDestaque && plano.destaqueMaiorQueContrato && (
                <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: C.bbAccent, lineHeight: 1.5, marginTop: 4 }}>
                  O destaque ({formatBRL(plano.D)}) é maior que o honorário contratado ({formatBRL(plano.H)}). Considerei o destaque como honorário e não cobrei nada a mais do cliente.
                </div>
              )}
              {split.gastosAplicado > 0 && (
                <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: "#B7C2CE", lineHeight: 1.5, marginTop: (split.administrativoAplicado > 0 || split.administrativoPendente > 0) ? 4 : 0 }}>
                  Já inclui {formatBRL(split.gastosAplicado)} de gastos reembolsáveis, descontados do cliente e somados ao escritório acima.
                </div>
              )}
              {split.comissaoParceiro > 0 && (
                <div style={{ fontFamily: FONT_SANS, fontSize: 11.5, color: "#B7C2CE", lineHeight: 1.5, marginTop: (split.administrativoAplicado > 0 || split.gastosAplicado > 0) ? 4 : 0 }}>
                  Comissão de {formatBRL(split.comissaoParceiro)} ({parceiroTipo === "fixo" ? "valor fixo" : `${formatPct(parceiroValor)} de ${formatBRL(split.baseComissao)}`}) descontada somente do escritório.
                </div>
              )}
            </div>
          )}
        </React.Fragment>
      ) : (
        <span style={{ fontFamily: FONT_SANS, fontSize: 12, color: "#B7C2CE" }}>Informe o valor do RPV/precatório expedido para ver a simulação do rateio.</span>
      )}
    </div>
  );
}
